name: Prove DSPx parallel stack address and CPU selection

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dsp-stack-parallel-address-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prove:
    name: Prove all176 stack transitions and both reads with actual negative controls
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6

      - name: Record every tracked SHA and index entry before tools or preparation
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stack-parallel-address-proof"
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/stack-parallel-address-proof/tracked-before.sha256"
          git ls-files --stage > "$RUNNER_TEMP/stack-parallel-address-proof/index-before.txt"
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git rev-parse HEAD:verilog)" = 01ce8b6b4509a5a72e0ad739e06bf19e548a2fc1
          test "$(git hash-object --no-filters .github/scripts/prepare-dsp-stack-parallel-address-proof.py)" = 5539d45bb08518eb2d86e6826db02200dafbd681
          test "$(git hash-object --no-filters .github/scripts/prepare-dsp-stack-experiment.py)" = 81fb25b4819cd0412fab84977d8cf7dacbcc49a5
          test "$(git hash-object --no-filters .github/scripts/prepare-dsp-stack-late-permit-proof.py)" = 0244d752e67f6cc5119b62bd49efb4cc32312022
          test "$(git hash-object --no-filters .github/scripts/prepare-dsp-stack-late-low-proof.py)" = 30e782b863c8ad64262fde826fe28b7a4daf42b0
          test "$(git hash-object --no-filters .github/scripts/cut-dsp-stack-case-state.py)" = f76cb8a134e598f97f1d9e43a26c35637cc44903
          test "$(git hash-object --no-filters .github/scripts/download-measured-slow-path-proof.py)" = 09a778b7c0d79f224e0ff9f66a50bf802d69a90c
          test "$(git hash-object --no-filters .github/scripts/prepare-slow-path-proofs.py)" = 393d3156292af684ca3db498cc43a20de77bbda4
          test "$(git hash-object --no-filters .github/fixtures/slow-path-proof-data.json)" = 7833210e1b7523a28aefc6a680000889efe39391
          test "$(git hash-object --no-filters .github/fixtures/slow-path-parent-dsp.v)" = 80050b8015d47cbf4eb25c6fd8c14aa78c378790
          test "$(git hash-object --no-filters verilog/sd2snes_dsp/upd77c25.v)" = ba14f5b6dd198fbb5645f005fb3784890beec2c4
          test "$(git hash-object --no-filters verilog/sd2snes_dsp/config.vh)" = 1a9a6a14b8b08eb6e931ce2320326e913aa8000e
          test "$(git hash-object --no-filters verilog/sd2snes_dspx/config.vh)" = 4cf8aa3111a5bf103065cded5fb77fdfc39ee239

      - name: Preserve the exact failed native outcome and measured report basis
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, stat, subprocess, zipfile
          from pathlib import Path, PurePosixPath
          assert os.environ.get('GITHUB_ACTIONS') == 'true'
          root = Path(os.environ['RUNNER_TEMP']) / 'stack-parallel-address-proof'
          def get(route, binary=False):
              data = subprocess.check_output(['gh', 'api', 'repos/secprog/sd2snes/' + route], timeout=60)
              assert len(data) <= 8_000_000
              return data if binary else json.loads(data)
          run = get('actions/runs/41241427380')
          jobs = get('actions/runs/41241427380/jobs?per_page=100')
          assert run['id'] == 41241427380 and run['head_sha'] == '50fb1ed619c3cb204417c1387b196b1e5baa90f3'
          assert run['status'] == 'completed' and run['conclusion'] == 'failure'
          assert run['event'] == 'workflow_dispatch' and run['run_attempt'] == 1
          assert jobs['total_count'] == len(jobs['jobs']) == 1
          job = jobs['jobs'][0]
          assert job['id'] == 124655967451 and job['run_id'] == run['id']
          assert job['head_sha'] == run['head_sha'] and job['run_attempt'] == 1
          assert job['status'] == 'completed' and job['conclusion'] == 'failure'
          expected = {number: 'success' for number in list(range(1, 30)) + [58, 59]}
          expected.update({21: 'failure', 25: 'failure', 29: 'failure'})
          assert len(job['steps']) == len(expected)
          assert {step['number']: step['conclusion'] for step in job['steps']} == expected
          assert all(step['status'] == 'completed' for step in job['steps'])
          artifact = get('actions/artifacts/13058680983')
          digest = 'b2497f88024ed57e5690fbfe651b6252ed9bb4e6ff94b63d2a6f89694c28686a'
          assert artifact['id'] == 13058680983 and artifact['name'] == 'dsp-status-late-isolated-native-seed-68-reports'
          assert artifact['workflow_run']['id'] == run['id'] and artifact['workflow_run']['head_sha'] == run['head_sha']
          assert artifact['size_in_bytes'] == 1117950 and not artifact['expired']
          assert artifact['digest'] == 'sha256:' + digest
          raw = get('actions/artifacts/13058680983/zip', True)
          assert len(raw) == 1117950 and hashlib.sha256(raw).hexdigest() == digest
          files = {}
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              entries = archive.infolist()
              assert len(entries) == 49 and sum(item.file_size for item in entries) == 8449855
              for item in entries:
                  name, path = item.filename, PurePosixPath(item.filename)
                  assert not item.is_dir() and not path.is_absolute() and '..' not in path.parts
                  assert '\\' not in name and ':' not in name and name not in files
                  mode = item.external_attr >> 16
                  assert not (item.flag_bits & 1) and not stat.S_ISLNK(mode)
                  assert stat.S_IFMT(mode) in (0, stat.S_IFREG) and item.file_size <= 3_000_000
                  data = archive.read(item)
                  data.decode('utf-8', errors='strict')
                  files[name] = data
          pins = {
              'main.par': (9274, 'b77674d867f06147f8403fa27fff54bc769d3354686a3b98baf6711883bd6346'),
              'main.twr': (1736537, '730e8f50672b433aef96b9766b18ae53fb219b618f1bb93dd1eab8135813c6cd'),
          }
          for name, (length, digest) in pins.items():
              data = files['sd2snes/sd2snes/verilog/sd2snes_dspx/' + name]
              assert len(data) == length and hashlib.sha256(data).hexdigest() == digest
              (root / ('failed-native-' + name)).write_bytes(data)
          (root / 'failed-native-provenance.json').write_text(json.dumps(dict(run=run, jobs=jobs,
              artifact=artifact, fullZipSha256=hashlib.sha256(raw).hexdigest(),
              all49TextFiles=[dict(name=name, bytes=len(data), sha256=hashlib.sha256(data).hexdigest())
                              for name, data in sorted(files.items())]), indent=2) + '\n')
          print('Native 41241427380 remains FAILED: PAR/TRACE and routed artifact failure preserved; full ZIP verified before bounded text inspection.')
          print('Measured basis: stack10_4 ss_wa7 -1.336ns, four logic levels and 4.462ns final CE net; stack4_4 final CE 4.466ns. No new timing result.')
          PY

      - name: Bind the complete reviewed status proof and its original mixed-run outcome
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/stack-parallel-address-proof"
          python3 .github/scripts/download-measured-slow-path-proof.py dsp "$report/parent-proof" "$report/parent-proof-provenance.json"
          proof="$report/parent-proof"
          test "$(wc -l < "$proof/SHA256SUMS")" = 52
          (cd "$proof" && sha256sum --check SHA256SUMS)
          test -s "$proof/verified.txt"
          grep -F 'Yosys 0.33 (git sha1 2584903a060)' "$proof/tool-version.txt"
          grep -F 'Icarus Verilog version 12.0' "$proof/iverilog-version.txt"
          test "$(sha256sum "$proof/candidate.v" | cut -d' ' -f1)" = 95aa37433035439b6998e09e6fb2d85d934ea42f31f9666fd02085bf428e7007
          test "$(git hash-object --no-filters "$proof/candidate.v")" = 5fd95bbd641a0068fcca947bd9a2a26da67a4553
          test "$(sha256sum "$proof/gold.v" | cut -d' ' -f1)" = b993dd8bd302c7108ed53fe2abb800232831084d41d688471db8775533d9f35f
          test "$(sha256sum "$proof/gate.v" | cut -d' ' -f1)" = 228137f16b4c3a79d876175cb6cca876e5832d7eabf69a57c24612e39660df93
          for mode in binary xstate; do
            test "$(sha256sum "$proof/gate/miter-$mode.json" | cut -d' ' -f1)" = 630431e93f9b31305f5ccb3623fac80aa5f76ae31408e1ffaa27b1ecc18764ad
            grep -F 'SAT proof finished - no model found: SUCCESS!' "$proof/gate/proof-$mode.log"
          done
          for variant in bad-opdst bad-lddst bad-state bad-low-address bad-high-address bad-low-data bad-high-data bad-cpu-data bad-freeze bad-reset-hold bad-reset-clear; do
            test -s "$proof/$variant/miter-binary.json"
            test -s "$proof/$variant/counterexample-binary.json"
            grep -F 'SAT proof finished - model found: FAIL!' "$proof/$variant/proof-binary.log"
          done
          for variant in bad-x-guard bad-x-data; do
            test -s "$proof/$variant/miter-binary.json"
            test -s "$proof/$variant/miter-xstate.json"
            test -s "$proof/$variant/counterexample-xstate.json"
            grep -F 'SAT proof finished - no model found: SUCCESS!' "$proof/$variant/proof-binary.log"
            grep -F 'SAT proof finished - model found: FAIL!' "$proof/$variant/proof-xstate.log"
          done
          for variant in gold gate bad-opdst bad-lddst bad-state bad-low-address bad-high-address bad-low-data bad-high-data bad-cpu-data bad-freeze bad-reset-hold bad-reset-clear bad-x-guard bad-x-data; do
            test -s "$proof/$variant/state.json"
            test -s "$proof/$variant/transition.json"
            test -s "$proof/$variant/initial-state-audit.json"
            grep -F 'SAT proof finished - no model found: SUCCESS!' "$proof/$variant/state-view.log"
          done
          grep -F 'SAT proof finished - model found: FAIL!' "$proof/gold/state-view-mutant.log"
          test -s "$proof/gold/state-view-mutant-counterexample.json"
          cmp "$proof/original.v" .github/fixtures/slow-path-parent-dsp.v

      - name: Preserve the complete earlier 176-bit stack proof chain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object --no-filters .github/workflows/prove-dsp-stack-late-low.yml)" = 0b53d5e8ae8503efef7dd2542c6bdd1e58424a35
          python3 - <<'PY'
          import hashlib, io, json, os, stat, subprocess, zipfile
          from pathlib import Path, PurePosixPath
          assert os.environ.get('GITHUB_ACTIONS') == 'true'
          expected = json.loads('''{"run":41132173203,"head":"6b81898fba0273cfd944f03e1e75bc35ebe17a89","path":".github/workflows/prove-dsp-stack-late-low.yml","conclusion":"success","jobs":[{"id":124325549576,"conclusion":"success","steps":[{"number":1,"name":"Set up job","conclusion":"success"},{"number":2,"name":"Run actions/checkout@v6","conclusion":"success"},{"number":3,"name":"Record every tracked SHA and index entry before tools or preparation","conclusion":"success"},{"number":4,"name":"Install and identify hosted proof tools","conclusion":"success"},{"number":5,"name":"Prepare original and new decoder candidate without changing inputs","conclusion":"success"},{"number":6,"name":"Audit all state bits and prove their observation ordering","conclusion":"success"},{"number":7,"name":"Prove strict state and reads and require real binary and X counterexamples","conclusion":"success"},{"number":8,"name":"Require every tracked SHA and index entry and empty staged differences","conclusion":"success"},{"number":9,"name":"Retain exact feasibility models, audits, miters and actual counterexamples","conclusion":"success"},{"number":18,"name":"Post Run actions/checkout@v6","conclusion":"success"},{"number":19,"name":"Complete job","conclusion":"success"}]}],"artifacts":[{"id":13013851609,"name":"dsp-stack-late-low-proof","size_in_bytes":4016659,"digest":"sha256:dc4c16ea44b4c2769a70a81c9a09856e592e50bf6e81efc531d3a15d6c24ec4c"}]}''')
          def get(route, binary=False):
              data = subprocess.check_output(['gh', 'api', 'repos/secprog/sd2snes/' + route], timeout=60)
              assert len(data) <= 8_000_000
              return data if binary else json.loads(data)
          run = get('actions/runs/41132173203')
          jobs = get('actions/runs/41132173203/jobs?per_page=100')
          assert (run['id'], run['head_sha'], run['path'], run['status'], run['conclusion'], run['event'], run['run_attempt']) == (expected['run'], expected['head'], expected['path'], 'completed', 'success', 'workflow_dispatch', 1)
          assert jobs['total_count'] == len(jobs['jobs']) == 1
          job, job_expected = jobs['jobs'][0], expected['jobs'][0]
          assert (job['id'], job['run_id'], job['head_sha'], job['status'], job['conclusion'], job['run_attempt']) == (job_expected['id'], expected['run'], expected['head'], 'completed', 'success', 1)
          assert [{key: step[key] for key in ('number', 'name', 'conclusion')} for step in job['steps']] == job_expected['steps']
          assert all(step['status'] == 'completed' for step in job['steps'])
          artifact = get('actions/artifacts/13013851609')
          assert all(artifact[key] == value for key, value in expected['artifacts'][0].items())
          assert not artifact['expired']
          assert (artifact['workflow_run']['id'], artifact['workflow_run']['head_sha']) == (expected['run'], expected['head'])
          raw = get('actions/artifacts/13013851609/zip', True)
          digest = 'dc4c16ea44b4c2769a70a81c9a09856e592e50bf6e81efc531d3a15d6c24ec4c'
          assert len(raw) == 4016659 and hashlib.sha256(raw).hexdigest() == digest
          files = {}
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              entries = archive.infolist()
              assert len(entries) == 230 and sum(item.file_size for item in entries) == 68578823
              for item in entries:
                  name, path = item.filename, PurePosixPath(item.filename)
                  assert not item.is_dir() and not path.is_absolute() and '..' not in path.parts
                  assert chr(92) not in name and ':' not in name and name not in files
                  mode = item.external_attr >> 16
                  assert not (item.flag_bits & 1) and not stat.S_ISLNK(mode)
                  assert stat.S_IFMT(mode) in (0, stat.S_IFREG) and item.file_size <= 16_000_000
                  data = archive.read(item)
                  data.decode('utf-8', errors='strict')
                  files[name] = data
          verified = set()
          for line in files['SHA256SUMS'].decode().splitlines():
              sha, name = line.split('  ', 1)
              assert name not in verified and hashlib.sha256(files[name]).hexdigest() == sha
              verified.add(name)
          assert len(verified) == 52
          assert files['candidate-upd77c25.v'] == Path('.github/fixtures/slow-path-parent-dsp.v').read_bytes()
          assert files['original-upd77c25.v'] == Path('verilog/sd2snes_dsp/upd77c25.v').read_bytes()
          assert files['late-low-generator.py.txt'] == Path('.github/scripts/prepare-dsp-stack-late-low-proof.py').read_bytes()
          destination = Path(os.environ['RUNNER_TEMP']) / 'stack-parallel-address-prior-stack'
          assert not destination.exists()
          for name, data in files.items():
              target = destination / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          report = Path(os.environ['RUNNER_TEMP']) / 'stack-parallel-address-proof'
          (report / 'prior-stack-proof-provenance.json').write_text(json.dumps(dict(run=run, jobs=jobs,
              artifact=artifact, fullZipSha256=digest, files=230, textBytes=68578823, manifestEntries=52), indent=2) + '\n')
          print('Complete earlier 176-bit stack proof identity, all jobs/steps, full ZIP digest, bounded CRC/UTF8 inventory and all52 SHA entries verified; no proof re-executed.')
          PY
          proof="$RUNNER_TEMP/stack-parallel-address-prior-stack"
          test "$(wc -l < "$proof/SHA256SUMS")" = 52
          (cd "$proof" && sha256sum --check SHA256SUMS)
          test -s "$proof/verified.txt"
          grep -F 'Yosys 0.33 (git sha1 2584903a060)' "$proof/tool-version.txt"
          grep -F 'Icarus Verilog version 12.0' "$proof/iverilog-version.txt"
          test "$(sha256sum "$proof/candidate-upd77c25.v" | cut -d' ' -f1)" = b536c4ab74015b76751d0544e48cce23a458b70b2e0e34f101bdd18421907d4a
          test "$(sha256sum "$proof/gold.v" | cut -d' ' -f1)" = 4a167b7b4efe8252d33bf2c437c494509c77aadfe6dc407a437be0030c2d2d2e
          test "$(sha256sum "$proof/gate.v" | cut -d' ' -f1)" = a03a0c2c7836b32e42763a339d8a64a5223d672cf49b5d26f1f5ea9ac9466333
          test "$(git hash-object --no-filters "$proof/candidate-upd77c25.v")" = 80050b8015d47cbf4eb25c6fd8c14aa78c378790
          for mode in binary xstate; do
            test "$(sha256sum "$proof/gate/miter-$mode.json" | cut -d' ' -f1)" = e1f14ea4cfdf85032af3dc4da4405dac8ec67adadf29cc387d6bcb9e67dfdd42
            grep -F 'SAT proof finished - no model found: SUCCESS!' "$proof/gate/proof-$mode.log"
          done
          for variant in bad-data bad-run bad-restore bad-reset bad-push bad-strobe bad-lane bad-word bad-prefix bad-return; do
            test -s "$proof/$variant/miter-binary.json"
            test -s "$proof/$variant/counterexample-binary.json"
            grep -F 'SAT proof finished - model found: FAIL!' "$proof/$variant/proof-binary.log"
          done
          for variant in bad-x-call-data bad-x-restore-data bad-x-write-mask bad-x-address; do
            test -s "$proof/$variant/miter-binary.json"
            test -s "$proof/$variant/miter-xstate.json"
            test -s "$proof/$variant/counterexample-xstate.json"
            grep -F 'SAT proof finished - no model found: SUCCESS!' "$proof/$variant/proof-binary.log"
            grep -F 'SAT proof finished - model found: FAIL!' "$proof/$variant/proof-xstate.log"
          done
          for variant in gold gate bad-data bad-run bad-restore bad-reset bad-push bad-strobe bad-lane bad-word bad-prefix bad-return bad-x-call-data bad-x-restore-data bad-x-write-mask bad-x-address; do
            test -s "$proof/$variant/state-audit.log"
            test -s "$proof/$variant/state.json"
            test -s "$proof/$variant/transition.json"
            grep -F 'SAT proof finished - no model found: SUCCESS!' "$proof/$variant/state-view.log"
          done
          grep -F 'SAT proof finished - model found: FAIL!' "$proof/gold/state-view-mutant.log"
          test -s "$proof/gold/state-view-mutant-counterexample.json"
          cmp "$proof/original-upd77c25.v" verilog/sd2snes_dsp/upd77c25.v
          test "$(git hash-object --no-filters .github/fixtures/slow-path-parent-dsp.v)" = 80050b8015d47cbf4eb25c6fd8c14aa78c378790
          cmp "$proof/candidate-upd77c25.v" .github/fixtures/slow-path-parent-dsp.v
          cmp "$proof/candidate-upd77c25.v" "$RUNNER_TEMP/stack-parallel-address-proof/parent-proof/original.v"

      - name: Install and identify hosted proof tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys iverilog
          yosys -V | tee "$RUNNER_TEMP/stack-parallel-address-proof/tool-version.txt"
          grep -F 'Yosys 0.33 (git sha1 2584903a060)' "$RUNNER_TEMP/stack-parallel-address-proof/tool-version.txt"
          iverilog -V > "$RUNNER_TEMP/stack-parallel-address-proof/iverilog-version.txt" 2>&1
          grep -F 'Icarus Verilog version 12.0' "$RUNNER_TEMP/stack-parallel-address-proof/iverilog-version.txt"

      - name: Prepare exact original and parallel-decoder candidate without changing inputs
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          python3 .github/scripts/prepare-dsp-stack-parallel-address-proof.py \
            verilog/sd2snes_dsp/upd77c25.v "$RUNNER_TEMP/stack-parallel-address-proof/parent-proof" "$RUNNER_TEMP/stack-parallel-address-proof"

      - name: Audit all state bits and prove their observation ordering
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/stack-parallel-address-proof"
          sha256sum --check SHA256SUMS
          variants=(gold gate bad-data bad-run bad-restore bad-reset bad-push bad-strobe bad-lane bad-word bad-prefix bad-return bad-high-half bad-low-half bad-cpu-permit bad-x-call-data bad-x-restore-data bad-x-write-mask bad-x-address bad-x-high-address bad-x-cpu-guard)
          for variant in "${variants[@]}"; do
            mkdir "$variant"
            cp "$variant.v" "$variant/model.v"
            (
              cd "$variant"
              # Do not optimize away X-sensitive controls or dynamic memory
              # semantics with opt_expr or the general memory pipeline.
              yosys -l preparation.log -p 'read_verilog -sv -formal model.v; hierarchy -check -top stack_model; flatten; proc -ifx -noopt; check -assert; memory_memx; memory_collect; memory_map; dffunmap; setundef -undriven -undef; opt_clean; check -assert; write_json state.json'
              model_name=gate
              if [[ "$variant" == gold ]]; then model_name=gold; fi
              python3 "$GITHUB_WORKSPACE/.github/scripts/cut-dsp-stack-case-state.py" \
                state.json transition.json "$model_name" | tee state-audit.log
              yosys -l state-view.log -p "read_json transition.json; hierarchy -check -top $model_name; sat -verify -enable_undef -prove state_view_ok 1 -show-inputs -show state_view_ok -timeout 180"
              grep -F 'SAT proof finished - no model found: SUCCESS!' state-view.log
              if [[ "$variant" == gold ]]; then
                result=0
                yosys -l state-view-mutant.log -p 'read_json state-view-mutant.json; hierarchy -check -top gold; sat -verify -enable_undef -set-def-inputs -prove state_view_ok 1 -show-inputs -show state_view_ok -dump_json state-view-mutant-counterexample.json -timeout 180' || result=$?
                test "$result" -ne 0
                grep -F 'SAT proof finished - model found: FAIL!' state-view-mutant.log
                test -s state-view-mutant-counterexample.json
              fi
            )
          done

      - name: Prove strict state and reads and require real binary and X counterexamples
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/stack-parallel-address-proof"
          for mode in binary xstate; do
            if [[ "$mode" == binary ]]; then
              variants=(gate bad-data bad-run bad-restore bad-reset bad-push bad-strobe bad-lane bad-word bad-prefix bad-return bad-high-half bad-low-half bad-cpu-permit bad-x-call-data bad-x-restore-data bad-x-write-mask bad-x-address bad-x-high-address bad-x-cpu-guard)
              input_flags='-set-def-inputs'
            else
              variants=(bad-x-call-data bad-x-restore-data bad-x-write-mask bad-x-address bad-x-high-address bad-x-cpu-guard gate)
              input_flags=''
            fi
            for variant in "${variants[@]}"; do
              cat > "$variant/prove-$mode.ys" <<YOSYS
          read_json ../gold/transition.json
          read_json transition.json
          miter -equiv -make_assert -make_outputs -make_outcmp gold gate miter
          hierarchy -check -top miter
          flatten -wb
          hierarchy -check -top miter
          opt_clean
          check -assert
          write_json miter-$mode.json
          sat -verify -enable_undef $input_flags -prove-asserts -show-inputs -show-outputs -dump_json counterexample-$mode.json -timeout 300
          YOSYS
              result=0
              (cd "$variant" && yosys -l "proof-$mode.log" -s "prove-$mode.ys") || result=$?
              test -s "$variant/miter-$mode.json"
              if [[ "$variant" == gate || ( "$variant" == bad-x-* && "$mode" == binary ) ]]; then
                test "$result" -eq 0
                grep -F 'SAT proof finished - no model found: SUCCESS!' "$variant/proof-$mode.log"
              else
                test "$result" -ne 0
                grep -F 'SAT proof finished - model found: FAIL!' "$variant/proof-$mode.log"
                test -s "$variant/counterexample-$mode.json"
              fi
            done
          done
          sha256sum --check SHA256SUMS
          printf 'Fresh parallel-address decoder component proof: all176 stack transitions and both reads match for common binary and unrestricted Yosys-X state/inputs; thirteen binary and six binary-equivalent X mutations produced counterexamples. Independent source, state, actual miter and witness review remains required. No native mapping/timing, CoreGen integrity or hardware result.\n' \
            | tee verified.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Require every tracked SHA and index entry and empty staged differences
        if: always()
        run: |
          set -euo pipefail
          audit="$RUNNER_TEMP/stack-parallel-address-proof"
          test -s "$audit/tracked-before.sha256"
          test -s "$audit/index-before.txt"
          git ls-files -z | xargs -0 sha256sum > "$audit/tracked-after.sha256"
          git ls-files --stage > "$audit/index-after.txt"
          cmp "$audit/tracked-before.sha256" "$audit/tracked-after.sha256"
          cmp "$audit/index-before.txt" "$audit/index-after.txt"
          sha256sum --check "$audit/tracked-before.sha256" | tee "$audit/tracked-final-check.txt"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Retain exact feasibility models, audits, miters and actual counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsp-stack-parallel-address-proof
          path: ${{ runner.temp }}/stack-parallel-address-proof/
          if-no-files-found: error
          retention-days: 14
