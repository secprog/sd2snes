# Plan the first native recipe against exact retained DSP input; execute no PAR/TRACE.
name: Inspect retained DSP native command plan

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: successor-native-preflight-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  preflight:
    name: DSP retained native inputs and original command plan
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FAMILY: dsp
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Pin reviewed preparation and planning sources and pristine checkout
        id: inventory
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = b90ea0fc1636f25a7c4b7f6ef6661d040f90ce53
          test "$(git rev-parse HEAD:verilog)" = 01ce8b6b4509a5a72e0ad739e06bf19e548a2fc1
          test "$(git hash-object --no-filters .github/scripts/prepare-successor-native-inputs.py)" = 3e6d468080d70730a594d97408e508d78da23139
          test "$(git hash-object --no-filters .github/scripts/check-successor-native-plan.py)" = bbaff25d3fc0ffe98408502e1d5ee09882ebca87
          test "$(git hash-object --no-filters .github/fixtures/successor-native-input-data.json)" = 76a525bac242ab4da57becceec3a9ceeb60ab226
          test "$(git hash-object --no-filters .github/fixtures/successor-native-plan-data.json)" = 50d61482a1f952ce1bc4a603937b9c40e2dbd076
          test "$(git hash-object --no-filters .github/fixtures/successor-physical-acceptance.json)" = 56082c542f5ff97bc411718f1391eff71375e836
          git diff --exit-code
          git diff --cached --exit-code
          prefix="$RUNNER_TEMP/successor-native-preflight-dsp"
          git ls-files -z | xargs -0 sha256sum > "$prefix-pristine.sha256"
          git ls-files -s > "$prefix-pristine-index.txt"
          {
            printf 'EVIDENCE_ROOT=%s/successor-native-input-dsp\n' "$RUNNER_TEMP"
            printf 'CHECK_PREFIX=%s\n' "$prefix"
            printf 'OUTPUT_ROOT=%s/successor-native-plan-dsp\n' "$RUNNER_TEMP"
          } >> "$GITHUB_ENV"
          printf 'Checkout: %s\nProduction Verilog tree: %s\n' "$GITHUB_SHA" "$(git rev-parse HEAD:verilog)" | tee "$prefix-identity.txt"

      - name: Require hosted positive and adversarial command-plan controls
        run: |
          set -euo pipefail
          python3 .github/scripts/check-successor-native-plan.py --self-test | tee "$CHECK_PREFIX-controls.json"

      - name: Bind complete accepted evidence and restore only exact native inputs
        id: preparation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare-successor-native-inputs.py "$FAMILY" "$EVIDENCE_ROOT" | tee "$CHECK_PREFIX-preparation-console.txt"
          cmp "$CHECK_PREFIX-pristine-index.txt" "$EVIDENCE_ROOT/checkout-before-index.txt"
          find "$EVIDENCE_ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$CHECK_PREFIX-evidence-before.sha256"
          sha256sum --check "$EVIDENCE_ROOT/checkout-after-candidate.sha256" > "$CHECK_PREFIX-pre-image-source-check.txt"
          sha256sum --check "$EVIDENCE_ROOT/restored-inputs.sha256" > "$CHECK_PREFIX-pre-image-input-check.txt"

      - uses: ./.github/actions/prepare-build-image
        with:
          target: mk2

      - name: Collect actual original recipe plan in the exact ISE image without routing
        id: plan
        run: |
          set -euo pipefail
          python3 .github/scripts/check-successor-native-plan.py --collect "$FAMILY" "$EVIDENCE_ROOT" "$OUTPUT_ROOT" | tee "$CHECK_PREFIX-plan-console.txt"

      - name: Require every source, index and retained input unchanged after planning
        if: always() && steps.inventory.outcome == 'success'
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/successor-native-preflight-dsp"
          evidence="$RUNNER_TEMP/successor-native-input-dsp"
          git diff --cached --exit-code
          git ls-files -z | xargs -0 sha256sum > "$prefix-after.sha256"
          git ls-files -s > "$prefix-after-index.txt"
          cmp "$prefix-pristine-index.txt" "$prefix-after-index.txt"
          git diff --name-only > "$prefix-post-paths.txt"
          git diff --binary > "$prefix-post-source.diff"
          if [[ -f "$evidence/checkout-after-candidate.sha256" ]]; then
            sha256sum --check "$evidence/checkout-after-candidate.sha256" > "$prefix-final-source-check.txt"
            cmp "$evidence/checkout-after-candidate-index.txt" "$prefix-after-index.txt"
            sha256sum --check "$evidence/restored-inputs.sha256" > "$prefix-final-input-check.txt"
            test "$(cat "$prefix-post-paths.txt")" = verilog/sd2snes_dsp/upd77c25.v
          else
            cmp "$prefix-pristine.sha256" "$prefix-after.sha256"
            sha256sum --check "$prefix-pristine.sha256" > "$prefix-final-source-check.txt"
            git diff --exit-code
          fi
          if [[ -f "$prefix-evidence-before.sha256" ]]; then
            find "$evidence" -type f -print0 | sort -z | xargs -0 sha256sum > "$prefix-evidence-after.sha256"
            cmp "$prefix-evidence-before.sha256" "$prefix-evidence-after.sha256"
            sha256sum --check "$prefix-evidence-before.sha256" > "$prefix-final-evidence-check.txt"
          fi
          for product in main.ncd main.par main.twr main.ngd main.ngc main.bit; do
            test ! -e "verilog/sd2snes_dspx/$product"
          done

      - name: Retain full bounded text planning evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: successor-native-preflight-dsp-reports
          path: |
            ${{ runner.temp }}/successor-native-preflight-dsp-*.txt
            ${{ runner.temp }}/successor-native-preflight-dsp-*.json
            ${{ runner.temp }}/successor-native-preflight-dsp-*.sha256
            ${{ runner.temp }}/successor-native-preflight-dsp-*.diff
            ${{ runner.temp }}/successor-native-input-dsp/*.json
            ${{ runner.temp }}/successor-native-input-dsp/*.sha256
            ${{ runner.temp }}/successor-native-input-dsp/*index.txt
            ${{ runner.temp }}/successor-native-plan-dsp/*.json
            ${{ runner.temp }}/successor-native-plan-dsp/*.txt
          if-no-files-found: error
          retention-days: 14
