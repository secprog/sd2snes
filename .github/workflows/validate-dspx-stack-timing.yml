name: Inspect retained improved DSPX DR mapping

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dspx-retained-dr-mapping-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect one retained implementation without rebuilding
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Authenticate unchanged improved RTL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:verilog)" = 893e807029df25af8263fd63fa71dadabf02b0d0
          test -z "$(git diff f4bcfe872f4c10f067fd1d6eca72882fa23b5b26 HEAD -- verilog)"
          git diff --exit-code
      - name: Inspect exact original retained mapping on GitHub only
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/dr-mapping-api"
          gh api repos/secprog/sd2snes/actions/artifacts/14062690690 > "$RUNNER_TEMP/dr-mapping-api/artifact.json"
          gh api 'repos/secprog/sd2snes/actions/runs/43467561223/jobs?per_page=100' > "$RUNNER_TEMP/dr-mapping-api/jobs.json"
          gh api repos/secprog/sd2snes/actions/artifacts/14062690690/zip > "$RUNNER_TEMP/dr-mapping-design.zip"
          python3 .github/scripts/inspect-dspx-dr-control-native.py "$RUNNER_TEMP/dr-mapping-design.zip" "$RUNNER_TEMP/dr-mapping-api" "$RUNNER_TEMP/dr-mapping-text"
          cp "$RUNNER_TEMP/dr-mapping-api/"*.json "$RUNNER_TEMP/dr-mapping-text/"
          cat "$RUNNER_TEMP/dr-mapping-text/controls.json"
          cat "$RUNNER_TEMP/dr-mapping-text/inspection-result.json"
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: Retain bounded text and unchanged original failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dspx-dr-retained-mapping-${{ github.run_id }}
          path: ${{ runner.temp }}/dr-mapping-text/
          if-no-files-found: error
          retention-days: 14
