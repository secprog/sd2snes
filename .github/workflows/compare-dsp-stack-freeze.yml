name: Compare DSPx stack-local freeze replica

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsp-stack-freeze-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prove:
    name: Prove stack and freeze transitions; reject six mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Prepare pinned component and exact boundary projections
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare-dsp-stack-freeze-experiment.py \
            verilog/sd2snes_dsp/upd77c25.v "$RUNNER_TEMP/stack-freeze-proof"

      - name: Install formal tools on the GitHub runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys
          yosys -V | tee "$RUNNER_TEMP/stack-freeze-proof/tool-version.txt"

      - name: Prove all stack transitions and both reads
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/stack-freeze-proof"
          sha256sum --check SHA256SUMS
          for variant in gold gate bad-data bad-freeze bad-wrap; do
            mkdir "stack-$variant"
            cp "stack-$variant.v" "stack-$variant/model.v"
            (
              cd "stack-$variant"
              # Preserve all 176 unconstrained state bits and both reads;
              # explicit proof-only SP=0 X preserves the original invalid read.
              yosys -l preparation.log -p 'read_verilog -sv -formal model.v; hierarchy -check -top stack_model; flatten; proc; check -assert; memory -nowiden -memx; dffunmap; opt_expr -keepdc; setundef -undriven -undef; opt_clean; check -assert; write_json state.json'
              model_name=gate
              if [[ "$variant" == gold ]]; then model_name=gold; fi
              python3 "$GITHUB_WORKSPACE/.github/scripts/cut-dsp-stack-state.py" \
                state.json transition.json "$model_name" | tee state-audit.log
            )
          done
          for variant in gate bad-data bad-freeze bad-wrap; do
            cat > "stack-$variant/prove.ys" <<'YOSYS'
          read_json ../stack-gold/transition.json
          read_json transition.json
          miter -equiv -make_assert -make_outputs -make_outcmp -flatten gold gate miter
          hierarchy -check -top miter
          opt_clean
          check -assert
          sat -verify -enable_undef -set-def-inputs -prove-asserts -show-inputs -show-outputs -dump_json counterexample.json -timeout 180
          YOSYS
            result=0
            (cd "stack-$variant" && yosys -l proof.log -s prove.ys) || result=$?
            if [[ "$variant" == gate ]]; then
              test "$result" -eq 0
              grep -F 'SAT proof finished - no model found: SUCCESS!' "stack-$variant/proof.log"
            else
              test "$result" -ne 0
              grep -F 'SAT proof finished - model found: FAIL!' "stack-$variant/proof.log"
              test -s "stack-$variant/counterexample.json"
            fi
          done

      - name: Prove the freeze invariant and initialized relation
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/stack-freeze-proof"
          for variant in gate bad-reset bad-boundary bad-init; do
            mkdir "freeze-$variant"
            cp "freeze-$variant.v" "freeze-$variant/model.v"
            cat > "freeze-$variant/prove.ys" <<'YOSYS'
          read_verilog -sv -formal ../freeze-gold.v model.v
          proc
          miter -equiv -make_assert -make_outputs -make_outcmp -flatten gold gate miter
          hierarchy -check -top miter
          opt_clean
          check -assert
          sat -verify -enable_undef -set-def-inputs -prove-asserts -show-inputs -show-outputs -dump_json counterexample.json -timeout 180
          YOSYS
            result=0
            (cd "freeze-$variant" && yosys -l proof.log -s prove.ys) || result=$?
            if [[ "$variant" == gate ]]; then
              test "$result" -eq 0
              grep -F 'SAT proof finished - no model found: SUCCESS!' "freeze-$variant/proof.log"
            else
              test "$result" -ne 0
              grep -F 'SAT proof finished - model found: FAIL!' "freeze-$variant/proof.log"
              test -s "freeze-$variant/counterexample.json"
            fi
          done
          sha256sum --check SHA256SUMS
          printf 'All 176 stack transitions and both reads match under the separately proved initialized equal-freeze invariant; six deliberate mutations have counterexamples. Component proofs do not qualify the FPGA or hardware.\n' \
            | tee verified.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact proof inputs and counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsp-stack-freeze-proof
          path: ${{ runner.temp }}/stack-freeze-proof/
          if-no-files-found: error
          retention-days: 14

  native:
    name: DSPx proved stack-local freeze replica XST Speed MAP Area seed 68
    needs: prove
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: dsp-stack-freeze-proof
          path: ${{ runner.temp }}/stack-freeze-proof

      - name: Select only the proved runner-only candidate
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/stack-freeze-proof"
          (cd "$proof_dir" && sha256sum --check SHA256SUMS)
          test -s "$proof_dir/verified.txt"
          cmp "$proof_dir/original-upd77c25.v" verilog/sd2snes_dsp/upd77c25.v
          test "$(git hash-object --no-filters verilog/sd2snes_dsp/main.ucf)" = 4f34c4cf9e475ac171a216c3f15fff74918fd03c
          test "$(git hash-object --no-filters verilog/sd2snes_dspx/sd2snes_dspx.xise)" = 2822b63c005bce73e8e7aaf332bcdbd983d1492d
          test ! -e verilog/sd2snes_dspx/ucf.extra
          cp "$proof_dir/candidate-upd77c25.v" verilog/sd2snes_dsp/upd77c25.v
          {
            printf 'Runner checkout: %s\nXST Speed / MAP Area / seed 68; production UCF and project unchanged.\n' "$GITHUB_SHA"
            while IFS= read -r -d '' source_file; do
              printf '%s %s\n' "$(git hash-object --no-filters "$source_file")" "$source_file"
            done < <(git ls-files -z verilog/sd2snes_dsp/ verilog/sd2snes_dspx/ verilog/common.mk verilog/xilinx_scripts/ .github/scripts/build.sh)
          } | tee "$RUNNER_TEMP/dsp-stack-freeze-source.txt"

      - uses: ./.github/actions/prepare-build-image
        with:
          target: mk2

      - name: Compile DSPx with strict native PAR and TRACE checks
        env:
          ISE_CTABLE: '68'
        run: |
          set -euo pipefail
          docker image inspect sd2snes-ci:mk2 --format 'ISE image ID: {{.Id}}' \
            | tee -a "$RUNNER_TEMP/dsp-stack-freeze-source.txt"
          container_name=sd2snes-dsp-stack-freeze
          bash .github/scripts/report-activity.sh "$container_name" &
          activity_pid=$!
          trap 'kill "$activity_pid" 2>/dev/null || true; wait "$activity_pid" 2>/dev/null || true' EXIT
          docker run --rm --name "$container_name" --user 0:0 \
            --mac-address 08:00:27:68:c9:35 --env ISE_CTABLE \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            --entrypoint /bin/bash sd2snes-ci:mk2 .github/scripts/build.sh mk2 dspx \
            2>&1 | tee "$RUNNER_TEMP/dsp-stack-freeze-build.log"

      - name: Collect mapped or routed freeze-control evidence
        if: always()
        run: |
          set -euo pipefail
          core=verilog/sd2snes_dspx
          if [[ ! -s "$core/main_map.ncd" ]]; then
            printf 'Freeze-control inspection inconclusive: mapped NCD unavailable.\n' \
              | tee "$RUNNER_TEMP/dsp-stack-freeze-xdl.txt"
            exit 0
          fi
          design=main_map.ncd
          if [[ -s "$core/main.ncd" ]]; then design=main.ncd; fi
          docker run --rm --user 0:0 --mac-address 08:00:27:68:c9:35 \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work/verilog/sd2snes_dspx \
            --entrypoint /bin/bash sd2snes-ci:mk2 -c \
            'set -euo pipefail; xdl -ncd2xdl -nopips "$1" stack-freeze-audit.xdl' _ "$design"
          python3 - "$core/stack-freeze-audit.xdl" "$design" <<'PY' | tee "$RUNNER_TEMP/dsp-stack-freeze-xdl.txt"
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text()
          statements = re.findall(r'(?ms)^\s*(?:net|inst)\s+.*?;', text)
          selected = [item for item in statements
                      if 'ss_frozen' in item or 'ss_stack_frozen' in item]
          print(f'Freeze evidence from {sys.argv[2]}')
          if not selected:
              raise SystemExit('No named freeze instance or net found; inspection inconclusive')
          for item in selected:
              pins = len(re.findall(r'\binpin\b', item))
              print(f'Input pins in statement: {pins}')
              print(item)
          print('Manual review required; synthesis may rename or merge registers.')
          PY

      - name: Record available intermediate checksums
        if: always()
        run: |
          for result_file in main.ngc main.ngd main_map.ncd main.ncd; do
            if [[ -f "verilog/sd2snes_dspx/$result_file" ]]; then
              sha256sum "verilog/sd2snes_dspx/$result_file"
            fi
          done > "$RUNNER_TEMP/dsp-stack-freeze-checksums.txt"

      - name: Upload reports without publishing diagnostic bitstreams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsp-stack-freeze-seed-68
          path: |
            ${{ runner.temp }}/dsp-stack-freeze-source.txt
            ${{ runner.temp }}/dsp-stack-freeze-build.log
            ${{ runner.temp }}/dsp-stack-freeze-xdl.txt
            ${{ runner.temp }}/dsp-stack-freeze-checksums.txt
            verilog/sd2snes_dspx/main.xst
            verilog/sd2snes_dspx/main.prj
            verilog/sd2snes_dspx/main.pcf
            verilog/sd2snes_dspx/sd2snes_dspx.xise
            verilog/sd2snes_dspx/*.syr
            verilog/sd2snes_dspx/*.par
            verilog/sd2snes_dspx/*.mrp
            verilog/sd2snes_dspx/*.psr
            verilog/sd2snes_dspx/*.twr
            verilog/sd2snes_dspx/*.bld
            verilog/sd2snes_dspx/*.unroutes
          if-no-files-found: error
          retention-days: 14
