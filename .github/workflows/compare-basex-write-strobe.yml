name: Compare basex write-strobe retiming

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basex-write-strobe-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prove:
    name: Prove strobe initialization and transition; reject four mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Prepare pinned source and actual consumer boundary projections
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare-basex-strobe-experiment.py \
            verilog/sd2snes_base "$RUNNER_TEMP/strobe-proof"

      - name: Install formal tools on the GitHub runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys
          yosys -V | tee "$RUNNER_TEMP/strobe-proof/tool-version.txt"

      - name: Prove the initial relation and every binary transition
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/strobe-proof"
          sha256sum --check SHA256SUMS
          for variant in gate bad-index bad-init bad-polarity bad-consumer; do
            mkdir "$variant"
            cp "$variant.v" "$variant/model.v"
            cat > "$variant/prove.ys" <<'YOSYS'
          read_verilog -sv -formal ../gold.v model.v
          proc
          miter -equiv -make_assert -make_outputs -make_outcmp -flatten gold gate miter
          hierarchy -check -top miter
          opt_clean
          check -assert
          sat -verify -enable_undef -set-def-inputs -prove-asserts -show-inputs -show-outputs -dump_json counterexample.json -timeout 180
          YOSYS
            result=0
            (cd "$variant" && yosys -l proof.log -s prove.ys) || result=$?
            if [[ "$variant" == gate ]]; then
              test "$result" -eq 0
              grep -F 'SAT proof finished - no model found: SUCCESS!' "$variant/proof.log"
            else
              test "$result" -ne 0
              grep -F 'SAT proof finished - model found: FAIL!' "$variant/proof.log"
              test -s "$variant/counterexample.json"
            fi
          done
          sha256sum --check SHA256SUMS
          printf 'The exact initialized strobe relation is preserved on every binary transition; both bound inputs match and four mutations have counterexamples. This is a component boundary proof, not hardware qualification.\n' \
            | tee verified.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact proof inputs and counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basex-write-strobe-proof
          path: ${{ runner.temp }}/strobe-proof/
          if-no-files-found: error
          retention-days: 14

  native:
    name: Basex proved write-strobe candidate XST Speed MAP Area seed 46
    needs: prove
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: basex-write-strobe-proof
          path: ${{ runner.temp }}/strobe-proof

      - name: Select only the proved runner-only candidate
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/strobe-proof"
          (cd "$proof_dir" && sha256sum --check SHA256SUMS)
          test -s "$proof_dir/verified.txt"
          cmp "$proof_dir/original-main.v" verilog/sd2snes_base/main.v
          test "$(git hash-object --no-filters verilog/sd2snes_base/cheat.v)" = dfc2f4fe2dc21fdd07da735fa1cd57a7aa6f4f3f
          test "$(git hash-object --no-filters verilog/sd2snes_base/bsx.v)" = 3ca70f4901a5fefef1576bae144060462b4c4254
          test "$(git hash-object --no-filters verilog/sd2snes_base/main.ucf)" = e582e03059fbbcf21b4124e5dd7aa9ac8792fd6b
          test "$(git hash-object --no-filters verilog/sd2snes_basex/sd2snes_basex.xise)" = 5338e8fa5fef0af0c526ff99563b17a0763ed34a
          test ! -e verilog/sd2snes_basex/ucf.extra
          cp "$proof_dir/candidate-main.v" verilog/sd2snes_base/main.v
          {
            printf 'Runner checkout: %s\nXST Speed / MAP Area / seed 46; production UCF and project unchanged.\n' "$GITHUB_SHA"
            while IFS= read -r -d '' source_file; do
              printf '%s %s\n' "$(git hash-object --no-filters "$source_file")" "$source_file"
            done < <(git ls-files -z verilog/sd2snes_base/ verilog/sd2snes_basex/ verilog/common.mk verilog/xilinx_scripts/ .github/scripts/build.sh)
          } | tee "$RUNNER_TEMP/basex-strobe-source.txt"

      - uses: ./.github/actions/prepare-build-image
        with:
          target: mk2

      - name: Compile basex with strict native PAR and TRACE checks
        env:
          ISE_CTABLE: '46'
        run: |
          set -euo pipefail
          docker image inspect sd2snes-ci:mk2 --format 'ISE image ID: {{.Id}}' \
            | tee -a "$RUNNER_TEMP/basex-strobe-source.txt"
          container_name=sd2snes-basex-write-strobe
          bash .github/scripts/report-activity.sh "$container_name" &
          activity_pid=$!
          trap 'kill "$activity_pid" 2>/dev/null || true; wait "$activity_pid" 2>/dev/null || true' EXIT
          docker run --rm --name "$container_name" --user 0:0 \
            --mac-address 08:00:27:68:c9:35 --env ISE_CTABLE \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            --entrypoint /bin/bash sd2snes-ci:mk2 .github/scripts/build.sh mk2 basex \
            2>&1 | tee "$RUNNER_TEMP/basex-strobe-build.log"

      - name: Collect mapped or routed strobe-register evidence
        if: always()
        run: |
          set -euo pipefail
          core=verilog/sd2snes_basex
          if [[ ! -s "$core/main_map.ncd" ]]; then
            printf 'Strobe inspection inconclusive: mapped NCD unavailable.\n' \
              | tee "$RUNNER_TEMP/basex-strobe-xdl.txt"
            exit 0
          fi
          design=main_map.ncd
          if [[ -s "$core/main.ncd" ]]; then design=main.ncd; fi
          docker run --rm --user 0:0 --mac-address 08:00:27:68:c9:35 \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work/verilog/sd2snes_basex \
            --entrypoint /bin/bash sd2snes-ci:mk2 -c \
            'set -euo pipefail; xdl -ncd2xdl -nopips "$1" strobe-audit.xdl' _ "$design"
          python3 - "$core/strobe-audit.xdl" "$design" <<'PY' | tee "$RUNNER_TEMP/basex-strobe-xdl.txt"
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text()
          statements = re.findall(r'(?ms)^\s*(?:net|inst)\s+.*?;', text)
          selected = [item for item in statements if 'SNES_WR_end_fast' in item]
          print(f'Strobe evidence from {sys.argv[2]}')
          if not selected:
              raise SystemExit('No named strobe instance or net found; inspection inconclusive')
          for item in selected:
              pins = len(re.findall(r'\binpin\b', item))
              print(f'Input pins in statement: {pins}')
              print(item)
          print('Manual review required; synthesis may rename or merge the register.')
          PY

      - name: Record available intermediate checksums
        if: always()
        run: |
          for result_file in main.ngc main.ngd main_map.ncd main.ncd; do
            if [[ -f "verilog/sd2snes_basex/$result_file" ]]; then
              sha256sum "verilog/sd2snes_basex/$result_file"
            fi
          done > "$RUNNER_TEMP/basex-strobe-checksums.txt"

      - name: Upload reports without publishing diagnostic bitstreams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basex-write-strobe-seed-46
          path: |
            ${{ runner.temp }}/basex-strobe-source.txt
            ${{ runner.temp }}/basex-strobe-build.log
            ${{ runner.temp }}/basex-strobe-xdl.txt
            ${{ runner.temp }}/basex-strobe-checksums.txt
            verilog/sd2snes_basex/main.xst
            verilog/sd2snes_basex/main.prj
            verilog/sd2snes_basex/main.pcf
            verilog/sd2snes_basex/sd2snes_basex.xise
            verilog/sd2snes_basex/*.syr
            verilog/sd2snes_basex/*.par
            verilog/sd2snes_basex/*.mrp
            verilog/sd2snes_basex/*.psr
            verilog/sd2snes_basex/*.twr
            verilog/sd2snes_basex/*.bld
            verilog/sd2snes_basex/*.unroutes
          if-no-files-found: error
          retention-days: 14
