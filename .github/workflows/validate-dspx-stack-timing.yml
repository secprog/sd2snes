name: Repack complete DSPX proof text within review bounds
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dspx-proof-text-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Collect exact successful proof API and original artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:verilog)" = dac5ad8408848fa09292900be64886082515e744
          test "$(git diff --name-only 28385f4638a56ab406e4150719dafea813884d8e HEAD -- verilog)" = ''
          mkdir -p "$RUNNER_TEMP/proof-api"
          gh api repos/secprog/sd2snes/actions/artifacts/14054559816 > "$RUNNER_TEMP/proof-api/artifact.json"
          gh api 'repos/secprog/sd2snes/actions/runs/43459552100/jobs?per_page=100' > "$RUNNER_TEMP/proof-api/jobs.json"
          gh api repos/secprog/sd2snes/actions/artifacts/14054559816/zip > "$RUNNER_TEMP/source-proof.zip"
      - name: Consolidate thirteen console copies without losing original bytes
        run: |
          set -euo pipefail
          python3 .github/scripts/repack-dspx-proof-text.py "$RUNNER_TEMP/source-proof.zip" "$RUNNER_TEMP/proof-api" "$RUNNER_TEMP/repacked-proof" 28385f4638a56ab406e4150719dafea813884d8e
          test -z "$(git status --porcelain --untracked-files=all)"
      - name: Retain complete bounded proof text
        uses: actions/upload-artifact@v4
        with:
          name: dspx-stack-address-proof-repacked-text
          path: ${{ runner.temp }}/repacked-proof/
          if-no-files-found: error
          retention-days: 14
