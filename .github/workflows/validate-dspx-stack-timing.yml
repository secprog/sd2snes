name: Validate reproducible retained DSPX two-register physical relocation
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dspx-retained-ff-physical-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  native:
    name: Build one strict DSPX implementation with unchanged timing constraints
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bind exact DSPX-only production hook and unchanged RTL, constraints and native recipe
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dspx-native"
          mkdir "$report"
          python3 - "$report/source-contract.json" <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          def git(*args):return subprocess.check_output(['git',*args])
          base='4d0199bf639629284546858b2b92abcd840b48a9'
          expected={'.github/scripts/inspect-dspx-retained-ff-relocation.py': 'ca65e8a6132df6e19facdf22896cef4d00894815', '.github/scripts/validate-dspx-retained-ff-native.py': '021b39252f52033714e4bba3d8c79025da7d7950', 'verilog/sd2snes_dspx/Makefile': '2bc0d6111f3ba0edd03645bbe03ce02c1f3811e2', 'verilog/sd2snes_dspx/dma4_ff_relocation.tcl': 'e29662ffe5b0fe2a67da531eb48a876b281707f7', 'verilog/sd2snes_dspx/dma4_ff_physical.tcl': 'b7bcf55128513bd04c95c2aa498b9a9b7ce072c6', 'verilog/sd2snes_dspx/dma4_ff_relocation.sha256': '74938c9e6c4ba2432b7497883603bd6b249cbfdf'}
          assert git('rev-parse','HEAD').decode().strip()==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^').decode().strip()==base
          changed=set(git('diff','--name-only',base,'HEAD').decode().splitlines())
          assert changed==set(expected)|{'.github/workflows/validate-dspx-stack-timing.yml'}
          rows=[]
          for name,want in expected.items():
              raw=Path(name).read_bytes();actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              assert actual==want
              rows.append(dict(path=name,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),gitBlob=actual))
          assert Path('verilog/common.mk').read_bytes()==git('show',base+':verilog/common.mk')
          original=git('show',base+':verilog/sd2snes_dspx/Makefile')
          assert Path('verilog/sd2snes_dspx/Makefile').read_bytes().startswith(original)
          assert not Path('verilog/sd2snes_dspx/ucf.extra').exists()
          assert not Path('verilog/settings.local').exists()
          assert git('diff',base,'HEAD','--','verilog/sd2snes_dsp')==b''
          result=dict(head=os.environ['GITHUB_SHA'],base=base,exactChangedFiles=sorted(changed),files=rows,
              allOtherTrackedFilesEqualBase=True,allRtlConstraintsAndOriginalParTraceUnchanged=True,
              productionDspxPostMapHookWired=True,freshReproductionAndControlsRequiredBeforeNative=True)
          Path(sys.argv[1]).write_text(json.dumps(result,indent=2)+'\n');print(json.dumps(result,indent=2))
          PY
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$report/source-before"
          python3 .github/scripts/check-dspx-strict-timing.py --self-test "$report/strict-report-controls.json"
          printf 'Source head: %s\nIGNORE_TIMING=0\nOriginal DSPX MAP/PAR cost table=68\n' "$GITHUB_SHA" > "$report/identity.txt"
      - name: Download exact adopted baseline timing reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-dspx-retained-ff-native.py baseline "$RUNNER_TEMP/dspx-baseline"
      - name: Bind and retrieve the exact original failed-timing mapped checkpoint on GitHub only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="$RUNNER_TEMP/dspx-native/original-api"
          mkdir "$api"
          gh api repos/secprog/sd2snes/actions/runs/43467561223 > "$api/run.json"
          gh api 'repos/secprog/sd2snes/actions/runs/43467561223/jobs?per_page=100' > "$api/jobs.json"
          gh api repos/secprog/sd2snes/actions/artifacts/14062690690 > "$api/artifact.json"
          python3 - "$api/artifact.json" "$api/run.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]));r=json.load(open(sys.argv[2]))
          assert a['id']==14062690690 and a['size_in_bytes']==2520006
          assert a['digest']=='sha256:fae12362d987524ba0f7713e563f82bd27940b3f8010e7e43d589a17fe3ae93c'
          assert not a['expired'] and a['workflow_run']['id']==43467561223
          assert r['id']==43467561223 and r['head_sha']=='f4bcfe872f4c10f067fd1d6eca72882fa23b5b26'
          assert r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='failure'
          PY
          gh api repos/secprog/sd2snes/actions/artifacts/14062690690/zip > "$RUNNER_TEMP/dspx-original-best-github-only.zip"
      - name: Exercise existing hosted source and owned-container evidence controls
        run: |
          set -euo pipefail
          python3 .github/scripts/post-sync-evidence.py --self-test "$RUNNER_TEMP/dspx-evidence-controls"
      - uses: ./.github/actions/prepare-build-image
        with:
          target: mk2
      - name: Require actual production transaction failure controls before any fresh implementation
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-dspx-retained-ff-native.py controls \
            "$RUNNER_TEMP/dspx-original-best-github-only.zip" "$RUNNER_TEMP/dspx-native/original-api" \
            "$RUNNER_TEMP/dspx-ff-control-design-github-only" "$RUNNER_TEMP/dspx-native/production-controls"
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dspx-native/source-after-controls"
          cmp "$RUNNER_TEMP/dspx-native/source-before.json" "$RUNNER_TEMP/dspx-native/source-after-controls.json"
          cmp "$RUNNER_TEMP/dspx-native/source-before-index.txt" "$RUNNER_TEMP/dspx-native/source-after-controls-index.txt"
      - name: Generate all six isolated DSP IPs and verify both consumers reuse them
        run: |
          set -euo pipefail
          python3 .github/scripts/post-sync-evidence.py coregen \
            "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dspx-native/ip" dsp "dspx-ip-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$RUNNER_TEMP/dspx-native/source-after-ip"
          cmp "$RUNNER_TEMP/dspx-native/source-before.json" "$RUNNER_TEMP/dspx-native/source-after-ip.json"
          cmp "$RUNNER_TEMP/dspx-native/source-before-index.txt" "$RUNNER_TEMP/dspx-native/source-after-ip-index.txt"
      - name: Generate one original MAP checkpoint before any PAR invocation
        id: map
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dspx-native"
          name="dspx-map-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          image=sha256:5e3bbb00649997abca8843b1d82d8529eda99a0f2868d37ad9777e0ad5fd50e8
          test ! -e verilog/sd2snes_dspx/main_map.ncd
          test ! -e verilog/sd2snes_dspx/main.ncd
          docker image inspect "$image" > "$report/map-image.json"
          docker create --name "$name" --user 0:0 --network bridge --mac-address 08:00:27:68:c9:35 \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work --env ISE_CTABLE= --env IGNORE_TIMING=0 \
            --entrypoint /bin/bash "$image" -c \
            'exec make -j2 -C verilog/sd2snes_dspx main_map.ncd HOST=LINUX XILINX_ENV= IGNORE_TIMING=0' > "$report/map-container-id.txt"
          docker inspect "$name" > "$report/map-container-created.json"
          docker start "$name" > "$report/map-start.txt"
          docker inspect "$name" > "$report/map-container-started.json"
          set +e
          docker logs --follow "$name" 2>&1 | tee "$report/map-build.log"
          log_status=("${PIPESTATUS[@]}")
          docker wait "$name" > "$report/map-exit.txt"
          wait_status=$?
          docker inspect "$name" > "$report/map-container-finished.json"
          inspect_status=$?
          set -e
          printf 'log=%s tee=%s wait=%s inspect=%s\n' "${log_status[0]}" "${log_status[1]}" "$wait_status" "$inspect_status" > "$report/map-collection-exits.txt"
          python3 - "$report/map-container-started.json" "$report/map-container-finished.json" "$image" <<'PY'
          import json, sys
          x,=json.load(open(sys.argv[1])); y,=json.load(open(sys.argv[2]))
          assert x['Image']==y['Image']==sys.argv[3]
          assert x['Config']['Entrypoint']==['/bin/bash']
          assert x['Config']['Cmd']==['-c','exec make -j2 -C verilog/sd2snes_dspx main_map.ncd HOST=LINUX XILINX_ENV= IGNORE_TIMING=0']
          assert x['Config']['User']=='0:0' and x['Config']['WorkingDir']=='/work'
          assert x['HostConfig']['NetworkMode']=='bridge'
          assert x['NetworkSettings']['Networks']['bridge']['MacAddress']=='08:00:27:68:c9:35'
          env=dict(v.split('=',1) for v in x['Config']['Env'])
          assert env['IGNORE_TIMING']=='0' and env['ISE_CTABLE']==''
          assert not any(k.startswith('MAKE') for k in env)
          assert x['State']['Running'] is True and y['State']['Running'] is False
          assert y['State']['ExitCode']==0 and not y['State']['OOMKilled']
          PY
          test "${log_status[0]}" = 0 && test "${log_status[1]}" = 0
          test "$wait_status" = 0 && test "$inspect_status" = 0
          test "$(cat "$report/map-exit.txt")" = 0
          test ! -e verilog/sd2snes_dspx/main.ncd
      - name: Verify fresh original MAP reproduction and complete production-converted graph before PAR
        id: placement
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dspx-native"
          python3 .github/scripts/validate-dspx-retained-ff-native.py fresh \
            "$RUNNER_TEMP/dspx-original-best-github-only.zip" "$report/original-api" \
            verilog/sd2snes_dspx "$report/physical" "$RUNNER_TEMP/dspx-original-comparison-github-only"
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$report/source-after-map"
          cmp "$report/source-before.json" "$report/source-after-map.json"
          cmp "$report/source-before-index.txt" "$report/source-after-map-index.txt"
          sha256sum --check "$report/ip/generated-products.sha256" > "$report/physical/ip-pre-par-check.txt"
      - name: Run the original strict DSPX build once and retain its real exit
        id: native
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dspx-native"
          name="dspx-native-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          image=sha256:5e3bbb00649997abca8843b1d82d8529eda99a0f2868d37ad9777e0ad5fd50e8
          test -s "$report/physical/fresh-structural-result.json"
          python3 .github/scripts/validate-dspx-retained-ff-native.py inputs verilog/sd2snes_dspx "$report/physical"
          docker image inspect "$image" > "$report/native-image.json"
          docker create --name "$name" --user 0:0 --network bridge --mac-address 08:00:27:68:c9:35 \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work --env ISE_CTABLE= --env IGNORE_TIMING=0 \
            --entrypoint /bin/bash "$image" .github/scripts/build.sh mk2 dspx > "$report/native-container-id.txt"
          docker inspect "$name" > "$report/native-container-created.json"
          docker start "$name" > "$report/native-start.txt"
          docker inspect "$name" > "$report/native-container-started.json"
          set +e
          docker logs --follow "$name" 2>&1 | tee "$report/native-build.log"
          log_status=("${PIPESTATUS[@]}")
          docker wait "$name" > "$report/native-exit.txt"
          wait_status=$?
          docker inspect "$name" > "$report/native-container-finished.json"
          inspect_status=$?
          set -e
          printf 'log=%s tee=%s wait=%s inspect=%s\n' "${log_status[0]}" "${log_status[1]}" "$wait_status" "$inspect_status" > "$report/collection-exits.txt"
          python3 - "$report/native-container-started.json" "$image" <<'PY'
          import json, sys
          x, = json.load(open(sys.argv[1]))
          assert x['Image'] == sys.argv[2]
          assert x['Config']['Entrypoint'] == ['/bin/bash']
          assert x['Config']['Cmd'] == ['.github/scripts/build.sh', 'mk2', 'dspx']
          assert x['Config']['User'] == '0:0' and x['Config']['WorkingDir'] == '/work'
          assert x['HostConfig']['NetworkMode'] == 'bridge'
          assert x['NetworkSettings']['Networks']['bridge']['MacAddress'] == '08:00:27:68:c9:35'
          env = dict(v.split('=',1) for v in x['Config']['Env'])
          assert env['IGNORE_TIMING'] == '0' and env['ISE_CTABLE'] == ''
          assert not any(k.startswith('MAKE') for k in env)
          assert x['State']['Running'] is True
          PY
          test "${log_status[0]}" = 0 && test "${log_status[1]}" = 0
          test "$wait_status" = 0 && test "$inspect_status" = 0
          test "$(cat "$report/native-exit.txt")" = 0
      - name: Preserve source, isolated IP products and all native text reports
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dspx-native"
          mkdir -p "$report/native-reports"
          python3 - "$report/native-reports" <<'PY'
          import hashlib, json, shutil, sys
          from pathlib import Path
          root, output = Path('verilog/sd2snes_dspx'), Path(sys.argv[1])
          rows = []
          for path in sorted(root.iterdir()):
              if path.is_file() and path.suffix in ('.syr','.par','.mrp','.psr','.bld','.bgn','.twr','.unroutes','.pcf','.xst','.prj','.ut','.tsi','.ucf'):
                  assert not path.is_symlink()
                  raw = path.read_bytes()
                  raw.decode('utf-8')
                  assert b'\0' not in raw
                  shutil.copyfile(path,output/path.name)
                  rows.append(dict(path=path.as_posix(),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest()))
          (output/'report-index.json').write_text(json.dumps(rows,indent=2)+'\n')
          products = []
          for path in sorted(root.glob('*.ncd')):
              products.append(dict(path=path.as_posix(),bytes=path.stat().st_size,sha256=hashlib.sha256(path.read_bytes()).hexdigest()))
          (output/'native-product-identities.json').write_text(json.dumps(products,indent=2)+'\n')
          PY
          python3 - "$RUNNER_TEMP/dspx-native/production-hook-text" <<'PY'
          import hashlib,json,shutil,sys
          from pathlib import Path
          root=Path('verilog/sd2snes_dspx/.dma4-ff-relocation');out=Path(sys.argv[1]);out.mkdir()
          rows=[]
          for path in sorted(root.glob('generation-*/*')):
              assert not path.is_symlink()
              if not path.is_file() or path.suffix not in ('.txt','.log','.sha256'):continue
              data=path.read_bytes();assert len(data)<=3000000 and b'\0' not in data;data.decode('utf-8')
              dest=out/path.relative_to(root);dest.parent.mkdir(parents=True,exist_ok=True);shutil.copyfile(path,dest)
              rows.append(dict(path=path.relative_to(root).as_posix(),bytes=len(data),sha256=hashlib.sha256(data).hexdigest()))
          (out/'generation-text-index.json').write_text(json.dumps(rows,indent=2)+'\n')
          PY
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$report/source-after"
          cmp "$report/source-before.json" "$report/source-after.json"
          cmp "$report/source-before-index.txt" "$report/source-after-index.txt"
          test -s "$report/ip/generated-products.sha256"
          sha256sum --check "$report/ip/generated-products.sha256" > "$report/ip-final-check.txt"
          find verilog/sd2snes_dsp/ip/mk2/build -type f -print0 | sort -z | xargs -0 sha256sum > "$report/ip-final-products.sha256"
          cmp "$report/ip/generated-products.sha256" "$report/ip-final-products.sha256"
          printf 'Full source/index/IP immutability verified\n' > "$report/integrity-verified.txt"
      - name: Require exact prechecked mapped inputs after original native continuation
        if: always() && steps.native.outcome != 'skipped'
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-dspx-retained-ff-native.py inputs verilog/sd2snes_dspx "$RUNNER_TEMP/dspx-native/physical"
      - name: Measure improvement while retaining actual strict timing failures
        if: always() && steps.native.outcome != 'skipped'
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-dspx-retained-ff-native.py analyze "$RUNNER_TEMP/dspx-native" "$RUNNER_TEMP/dspx-baseline"
      - name: Require routed zero-score setup and hold with exact native options and PCF
        run: |
          set -euo pipefail
          python3 .github/scripts/check-dspx-strict-timing.py "$RUNNER_TEMP/dspx-native"
          python3 - "$RUNNER_TEMP/dspx-native" <<'PY'
          import json, sys
          from pathlib import Path
          report=Path(sys.argv[1])
          result=json.loads((report/'report-timing-validation.json').read_text())
          finished,=json.loads((report/'native-container-finished.json').read_text())
          assert finished['State']['ExitCode'] == 0 and not finished['State']['OOMKilled']
          assert (report/'native-exit.txt').read_text().strip() == '0'
          result['nativeExitPassed'] = True
          (report/'strict-timing-result.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Audit complete combined text evidence without weakening any raw or file bound
        if: always()
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/dspx-native" <<'PY'
          from pathlib import Path
          import hashlib,json,stat,sys
          root=Path(sys.argv[1]);rows=[];total=0;seen=set()
          for path in sorted(root.rglob('*')):
              assert not path.is_symlink()
              if path.is_dir():continue
              assert stat.S_ISREG(path.stat().st_mode)
              name=path.relative_to(root).as_posix();assert name.casefold() not in seen;seen.add(name.casefold())
              assert path.suffix in ('.json','.txt','.log','.raw','.stat','.sha256','.syr','.par','.mrp','.psr','.bld','.bgn','.twr','.unroutes','.pcf','.xst','.prj','.ut','.tsi','.ucf')
              data=path.read_bytes();assert len(data)<=3000000 and b'\0' not in data;data.decode('utf-8')
              total+=len(data);rows.append(dict(path=name,bytes=len(data),sha256=hashlib.sha256(data).hexdigest()))
          assert len(rows)<1024 and total<112000000
          result=dict(fileCount=len(rows),bytes=total,files=rows,allRegularSafeUtf8NoNul=True,noTruncation=True,noNativeOrFullXdlFiles=True)
          raw=(json.dumps(result,indent=2)+'\n').encode();assert len(raw)<=3000000 and total+len(raw)<=112000000
          (root/'safe-text-union.json').write_bytes(raw)
          print(json.dumps({k:v for k,v in result.items() if k!='files'},indent=2))
          PY
      - name: Upload complete source-bound native text evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dspx-retained-ff-physical-native-reports
          path: ${{ runner.temp }}/dspx-native/
          if-no-files-found: error
          retention-days: 14
      - name: Retain hosted evidence-control receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dspx-retained-ff-physical-evidence-controls
          path: ${{ runner.temp }}/dspx-evidence-controls/self-test-results.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload candidate FPGA only after all strict gates pass
        uses: actions/upload-artifact@v4
        with:
          name: dspx-retained-ff-physical-strict-candidate
          path: |
            verilog/sd2snes_dspx/fpga_dspx.bit
            ${{ runner.temp }}/dspx-native/strict-timing-result.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain implementation for future read-only hosted inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dspx-retained-ff-physical-design-github-only
          include-hidden-files: true
          path: |
            verilog/sd2snes_dspx/main_map.ncd
            verilog/sd2snes_dspx/main.ncd
            verilog/sd2snes_dspx/main.ngd
            verilog/sd2snes_dspx/main.ngc
            verilog/sd2snes_dspx/main.pcf
            verilog/sd2snes_dsp/ip/mk2/build/*.ngc
            verilog/sd2snes_dsp/ip/mk2/build/*.v
            verilog/sd2snes_dspx/.dma4-ff-relocation/
            ${{ runner.temp }}/dspx-ff-control-design-github-only/
            ${{ runner.temp }}/dspx-original-comparison-github-only/
          if-no-files-found: error
          retention-days: 14
      - name: Remove only this job's completed containers
        if: always()
        run: |
          for kind in map native; do
            name="dspx-$kind-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            if docker container inspect "$name" >/dev/null 2>&1; then
              running=$(docker inspect --format '{{.State.Running}}' "$name")
              if [[ "$running" == false ]]; then docker rm "$name"; fi
            fi
          done
