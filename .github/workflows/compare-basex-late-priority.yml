name: Compare basex late command-priority boundary

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: basex-late-priority-native-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  native:
    name: Basex proved late priority, XST Speed MAP Area seed 46
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6

      - name: Download the independently inspected source-bound proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/secprog/sd2snes/actions/runs/40788461937 --jq .conclusion)" = success
          test "$(gh api repos/secprog/sd2snes/actions/runs/40788461937 --jq .head_sha)" = a5f22b04ce216fecb4d89a33f5d4ef8a4ea5c194
          gh api repos/secprog/sd2snes/actions/artifacts/12860227711 > "$RUNNER_TEMP/late-proof-metadata.json"
          python3 - "$RUNNER_TEMP/late-proof-metadata.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          artifact = json.loads(Path(sys.argv[1]).read_text())
          expected = {'id': 12860227711, 'name': 'basex-late-priority-proof', 'expired': False,
                      'digest': 'sha256:b4883a31cef378083008fcdfa5bbed9fcadc728cb72956d264bd3aae93adbf99'}
          if any(artifact.get(key) != value for key, value in expected.items()):
              raise SystemExit('Proof artifact identity differs')
          run = artifact['workflow_run']
          if run['id'] != 40788461937 or run['head_sha'] != 'a5f22b04ce216fecb4d89a33f5d4ef8a4ea5c194':
              raise SystemExit('Proof run identity differs')
          PY
          gh api repos/secprog/sd2snes/actions/artifacts/12860227711/zip > "$RUNNER_TEMP/late-proof.zip"
          printf 'b4883a31cef378083008fcdfa5bbed9fcadc728cb72956d264bd3aae93adbf99  %s\n' "$RUNNER_TEMP/late-proof.zip" | sha256sum --check
          python3 - "$RUNNER_TEMP/late-proof.zip" "$RUNNER_TEMP/basex-late-priority-proof" <<'PY'
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath
          root = Path(sys.argv[2])
          with zipfile.ZipFile(sys.argv[1]) as archive:
              entries = archive.infolist()
              if len(entries) != 185 or sum(item.file_size for item in entries) != 18823484:
                  raise SystemExit('Unexpected complete proof artifact inventory')
              for item in entries:
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in item.filename or ':' in item.filename:
                      raise SystemExit('Unsafe proof artifact path')
                  if item.file_size > 2_000_000:
                      raise SystemExit('Unexpectedly large proof member')
              archive.extractall(root)
          print('Exact independently reviewed proof artifact ZIP identity and complete contents verified.')
          PY

      - name: Download the original basex timing report for comparison
        uses: actions/download-artifact@v4
        with:
          name: basex-write-gate-original-seed-46
          path: ${{ runner.temp }}/basex-late-original
          run-id: 40528297097
          github-token: ${{ github.token }}

      - name: Select exactly the proved runner-only source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:verilog)" = 4e50365f59f38217b67c5126276873a29be737d5
          test "$(git hash-object --no-filters .github/scripts/build.sh)" = 847665b375209d705de918d54f89cff194b074b1
          test "$(git hash-object --no-filters .github/actions/prepare-build-image/action.yml)" = ac2a66fc24d4a15658b666cdc5f5db7964df4c3b
          test "$(git hash-object --no-filters verilog/common.mk)" = 1dd382cd82f2fdd56391dc8245d0782a6b356402
          test "$(git hash-object --no-filters .github/scripts/inspect-dsp-retained-map.py)" = 2b3b867372717b5729e26cb4880cb1af0b01a965
          git diff --exit-code -- verilog .github/scripts/build.sh .github/actions/prepare-build-image/action.yml
          git diff --cached --exit-code
          test "$(git hash-object --no-filters verilog/sd2snes_base/cheat.v)" = dfc2f4fe2dc21fdd07da735fa1cd57a7aa6f4f3f
          test "$(git hash-object --no-filters verilog/sd2snes_base/main.ucf)" = e582e03059fbbcf21b4124e5dd7aa9ac8792fd6b
          test "$(git hash-object --no-filters verilog/sd2snes_basex/sd2snes_basex.xise)" = 5338e8fa5fef0af0c526ff99563b17a0763ed34a
          test ! -e verilog/sd2snes_basex/ucf.extra
          proof="$RUNNER_TEMP/basex-late-priority-proof"
          (cd "$proof" && sha256sum --check SHA256SUMS)
          test -s "$proof/verified.txt"
          test "$(sha256sum "$proof/candidate-cheat.v" | cut -d' ' -f1)" = 9876c274f810f28f333dabfabfe6f7b238ec8975a47c9171aefc0d38493155ac
          test "$(sha256sum "$proof/gold.v" | cut -d' ' -f1)" = 009bdaa200e3fc2a43f98df6b96f8519b21c9fb2915b97b1200c1e1add2df3f9
          test "$(sha256sum "$proof/gate.v" | cut -d' ' -f1)" = df00b9091015a01a02322b519a552fb3848d9d810bad37a1b8df695a217992ba
          test "$(git hash-object --no-filters "$proof/candidate-cheat.v")" = 95477267cc3c356c389439b07b8da30bfe718eb5
          for mode in binary xstate; do
            test "$(sha256sum "$proof/gate/miter-$mode.json" | cut -d' ' -f1)" = 0c8de9bbbab6a5599db37742ad0ec34d525585463f11f9c16cdac25cb4982382
            grep -F 'SAT proof finished - no model found: SUCCESS!' "$proof/gate/proof-$mode.log"
          done
          for variant in bad-data bad-unlock bad-exe bad-enable bad-strobe bad-reset bad-pgm bad-index; do
            test -s "$proof/$variant/miter-binary.json"
            test -s "$proof/$variant/counterexample-binary.json"
            grep -F 'SAT proof finished - model found: FAIL!' "$proof/$variant/proof-binary.log"
          done
          for variant in bad-x-command bad-x-select bad-x-data; do
            test -s "$proof/$variant/miter-binary.json"
            test -s "$proof/$variant/miter-xstate.json"
            test -s "$proof/$variant/counterexample-xstate.json"
            grep -F 'SAT proof finished - no model found: SUCCESS!' "$proof/$variant/proof-binary.log"
            grep -F 'SAT proof finished - model found: FAIL!' "$proof/$variant/proof-xstate.log"
          done
          for variant in gold gate bad-data bad-unlock bad-exe bad-enable bad-strobe bad-reset bad-pgm bad-index bad-x-command bad-x-select bad-x-data; do
            test -s "$proof/$variant/state-audit.log"
            test -s "$proof/$variant/state.json"
            test -s "$proof/$variant/transition.json"
            grep -F 'SAT proof finished - no model found: SUCCESS!' "$proof/$variant/state-view.log"
          done
          grep -F 'SAT proof finished - model found: FAIL!' "$proof/gold/state-view-mutant.log"
          test -s "$proof/gold/state-view-mutant-counterexample.json"
          cmp "$proof/original-cheat.v" verilog/sd2snes_base/cheat.v
          cp "$proof/candidate-cheat.v" verilog/sd2snes_base/cheat.v
          test "$(git diff --name-only)" = verilog/sd2snes_base/cheat.v
          {
            printf 'Checkout: %s\nVerilog tree: %s\n' "$GITHUB_SHA" "$(git rev-parse HEAD:verilog)"
            printf 'Proof run: 40788461937; candidate cheat blob: 95477267cc3c356c389439b07b8da30bfe718eb5\n'
            printf 'Original project: 5338e8fa5fef0af0c526ff99563b17a0763ed34a; original UCF: e582e03059fbbcf21b4124e5dd7aa9ac8792fd6b\n'
            printf 'Diagnostic target: XST Speed, timing-driven MAP Area, PAR high, seed 46. No timing requirements changed.\n'
          } | tee "$RUNNER_TEMP/basex-late-priority-identity.txt"

      - uses: ./.github/actions/prepare-build-image
        with:
          target: mk2

      - name: Compile using strict native PAR and TRACE checks
        id: compile
        env:
          ISE_CTABLE: '46'
        run: |
          set -euo pipefail
          image_id=$(docker image inspect sd2snes-ci:mk2 --format '{{.Id}}')
          printf 'ISE image ID: %s\n' "$image_id" | tee -a "$RUNNER_TEMP/basex-late-priority-identity.txt"
          test "$image_id" = sha256:5e3bbb00649997abca8843b1d82d8529eda99a0f2868d37ad9777e0ad5fd50e8
          container_name=sd2snes-basex-late-priority
          bash .github/scripts/report-activity.sh "$container_name" &
          activity_pid=$!
          trap 'kill "$activity_pid" 2>/dev/null || true; wait "$activity_pid" 2>/dev/null || true' EXIT
          docker run --rm --name "$container_name" --user 0:0 \
            --mac-address 08:00:27:68:c9:35 --env ISE_CTABLE \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            --entrypoint /bin/bash sd2snes-ci:mk2 .github/scripts/build.sh mk2 basex \
            2>&1 | tee "$RUNNER_TEMP/basex-late-priority-build.log"

      - name: Retain every post-build tracked difference and generated IP hash
        if: always() && steps.compile.outcome != 'skipped'
        run: |
          set -euo pipefail
          git diff --no-ext-diff --no-renames --binary > "$RUNNER_TEMP/basex-late-priority-post.diff"
          git diff --cached --no-ext-diff --no-renames --binary > "$RUNNER_TEMP/basex-late-priority-post-staged.diff"
          git diff --no-ext-diff --no-renames --name-only | tee "$RUNNER_TEMP/basex-late-priority-post-paths.txt"
          for path in verilog/sd2snes_base/cheat.v verilog/sd2snes_base/main.ucf verilog/sd2snes_basex/sd2snes_basex.xise; do
            printf '%s %s\n' "$(git hash-object --no-filters "$path")" "$path"
          done | tee "$RUNNER_TEMP/basex-late-priority-post-hashes.txt"
          {
            missing=0
            for core in dac_buf msu_databuf snescmd_buf; do
              file="verilog/sd2snes_base/ip/mk2/$core.ngc"
              if [[ -s "$file" ]]; then sha256sum "$file"; else printf 'MISSING %s\n' "$file"; missing=1; fi
            done
            exit "$missing"
          } | tee "$RUNNER_TEMP/basex-late-priority-ngc-hashes.txt"

      - name: Verify candidate, project, constraints and all tracked inputs
        if: always() && steps.compile.outcome != 'skipped'
        run: |
          set -euo pipefail
          test "$(git hash-object --no-filters verilog/sd2snes_base/cheat.v)" = 95477267cc3c356c389439b07b8da30bfe718eb5
          test "$(git hash-object --no-filters verilog/sd2snes_base/main.ucf)" = e582e03059fbbcf21b4124e5dd7aa9ac8792fd6b
          test "$(git hash-object --no-filters verilog/sd2snes_basex/sd2snes_basex.xise)" = 5338e8fa5fef0af0c526ff99563b17a0763ed34a
          test "$(git diff --name-only)" = verilog/sd2snes_base/cheat.v
          git diff --cached --exit-code
          echo 'Only the proved cheat candidate differs among all tracked inputs; staged inputs are unchanged.'

      - name: Verify actual synthesis, map and route options
        if: always() && steps.compile.outcome != 'skipped'
        run: |
          set -euo pipefail
          grep -Fx -- '-opt_mode Speed' verilog/sd2snes_basex/main.xst
          grep -Fx -- '-define { MK2 BASE_EXT }' verilog/sd2snes_basex/main.xst
          grep -Fx -- '-resource_sharing Yes' verilog/sd2snes_basex/main.xst
          grep -Fx -- '-register_balancing Yes' verilog/sd2snes_basex/main.xst
          python3 - "$RUNNER_TEMP/basex-late-priority-build.log" <<'PY'
          import re
          import shlex
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors="strict").splitlines()
          for tool, expected in (
              ("map", {"-logic_opt": "on", "-ol": "high", "-xe": "n", "-t": "46", "-register_duplication": "on", "-cm": "area"}),
              ("par", {"-ol": "high", "-xe": "c", "-t": "46"}),
          ):
              commands = [line for line in lines if re.search(r"/" + tool + r"\s+-", line)]
              if len(commands) != 1:
                  raise SystemExit(f"Missing or ambiguous {tool} command")
              args = shlex.split(commands[0].split(" || ", 1)[0].strip())
              if tool == "map" and args.count("-timing") != 1:
                  raise SystemExit("MAP is not explicitly timing-driven")
              for flag, value in expected.items():
                  if args.count(flag) != 1 or args.index(flag) + 1 >= len(args) or args[args.index(flag) + 1] != value:
                      raise SystemExit(f"Unexpected {tool} option {flag}")
              print(f"Verified {tool} command: {commands[0]}")
          PY

      - name: Compare PCF timing statements with the original report
        if: always() && steps.compile.outcome != 'skipped'
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/basex-late-original" verilog/sd2snes_basex/main.pcf <<'PY'
          import hashlib
          import re
          import sys
          from pathlib import Path
          originals = list(Path(sys.argv[1]).rglob('main.pcf'))
          if len(originals) != 1:
              raise SystemExit('Missing or ambiguous original PCF')
          if hashlib.sha256(originals[0].read_bytes()).hexdigest() != 'fcc454491b6784f08a93ddfc802ab7c6a984d5dc8583b9e005d65255b25096fe':
              raise SystemExit('Original PCF hash differs from the retained baseline report')
          def timing(path):
              lines = path.read_text().splitlines()
              return [line.strip() for line in lines if re.match(r'^(SYSTEM_JITTER|TS_\S+\s*=)', line.strip())]
          old, new = timing(originals[0]), timing(Path(sys.argv[2]))
          if not old or old != new:
              raise SystemExit(f'PCF timing statements differ: old={old!r}, new={new!r}')
          print('\n'.join(new))
          PY

      - name: Inspect actual mapped late-priority statements
        if: always() && steps.compile.outcome != 'skipped'
        run: |
          set -euo pipefail
          core=verilog/sd2snes_basex
          grep -F 'Set property "LUT_MAP = yes" for unit <cheat_command_permit>.' "$core/main.syr"
          grep -F 'Set property "LUT_MAP = yes" for unit <cheat_program_late_and>.' "$core/main.syr"
          test -s "$core/main_map.ncd"
          sha256sum "$core/main_map.ncd" | tee "$RUNNER_TEMP/basex-late-priority-map-sha256.txt"
          docker run --rm --user 0:0 --mac-address 08:00:27:68:c9:35 \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work/verilog/sd2snes_basex \
            --entrypoint /bin/bash sd2snes-ci:mk2 -c \
            'set -euo pipefail; xdl -ncd2xdl -nopips main_map.ncd late-priority-audit.xdl'
          sha256sum --check "$RUNNER_TEMP/basex-late-priority-map-sha256.txt"
          python3 - "$core/late-priority-audit.xdl" <<'PY' | tee "$RUNNER_TEMP/basex-late-priority-xdl.txt"
          import importlib.util
          import re
          import sys
          from pathlib import Path
          script = Path('.github/scripts/inspect-dsp-retained-map.py')
          spec = importlib.util.spec_from_file_location('xdl', script)
          xdl = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(xdl)
          xdl.fixture_checks()
          instances, nets = xdl.parse(Path(sys.argv[1]).read_text())
          names = re.compile(r'cheat_late_|cheat_early_|command_permit|early_select_[0-5]|late_and_[0-5]')
          selected_instances = {name for name, text in instances.items() if names.search(text)}
          for target in ('snes_cheat/cheat_data_1_1', 'snes_cheat/cheat_addr_1_3'):
              comp = xdl.bind(instances, target)
              ce_name, ce = xdl.ce_for(nets, comp)
              selected_instances.add(comp)
              drivers = [pin for pin in xdl.net_pins(ce) if pin[0] == 'outpin']
              if len(drivers) != 1 or drivers[0][1] not in instances:
                  raise SystemExit('Missing target CE driver')
              selected_instances.add(drivers[0][1])
              print(f'Actual mapped target {target}: COMP={comp}, CE={ce_name}, driver={drivers[0]}')
          selected_nets = {name for name, text in nets.items() if names.search(text) or any(
              comp in selected_instances for kind, comp, pin in xdl.net_pins(text))}
          records = [instances[name] for name in sorted(selected_instances)]
          records += [nets[name] for name in sorted(selected_nets)]
          if not selected_instances or len(selected_instances) > 400 or len(selected_nets) > 700 or sum(len(item) for item in records) > 3_000_000:
              raise SystemExit('Missing/excessive complete mapped evidence; inspection inconclusive')
          joined = '\n'.join(records)
          if 'command_permit' not in joined or any(f'late_and_{i}' not in joined for i in range(6)):
              raise SystemExit('Named command or final-gate evidence missing; inspection inconclusive')
          print(f'Parsed {len(instances)} instances/{len(nets)} nets; retained {len(selected_instances)} complete instances/{len(selected_nets)} complete nets.')
          print('Mapped candidate evidence only. Physical COMP names do not imply logical register coupling. No baseline, routed benefit or full logical-cone proof.')
          print(joined)
          PY

      - name: Confirm the native timing result
        if: always() && steps.compile.outcome == 'success'
        run: |
          set -euo pipefail
          grep -Eq 'Timing Score: 0 \(Setup: 0, Hold: 0' verilog/sd2snes_basex/main.par
          grep -Eq 'Timing errors: 0[[:space:]]+Score: 0[[:space:]]+\(Setup/Max: 0, Hold: 0\)' verilog/sd2snes_basex/main.twr
          echo 'Native PAR and TRACE explicitly report zero timing errors.'

      - name: Require original tracked inputs after all native inspections
        if: always() && steps.compile.outcome != 'skipped'
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = verilog/sd2snes_base/cheat.v
          git diff --cached --exit-code
          test "$(git hash-object --no-filters verilog/sd2snes_base/cheat.v)" = 95477267cc3c356c389439b07b8da30bfe718eb5

      - name: Upload small reports and source differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basex-late-priority-seed-46-reports
          path: |
            ${{ runner.temp }}/basex-late-priority-identity.txt
            ${{ runner.temp }}/basex-late-priority-build.log
            ${{ runner.temp }}/basex-late-priority-post.diff
            ${{ runner.temp }}/basex-late-priority-post-staged.diff
            ${{ runner.temp }}/basex-late-priority-post-paths.txt
            ${{ runner.temp }}/basex-late-priority-post-hashes.txt
            ${{ runner.temp }}/basex-late-priority-ngc-hashes.txt
            ${{ runner.temp }}/basex-late-priority-map-sha256.txt
            ${{ runner.temp }}/basex-late-priority-xdl.txt
            verilog/sd2snes_basex/main.xst
            verilog/sd2snes_basex/main.prj
            verilog/sd2snes_basex/main.pcf
            verilog/sd2snes_basex/sd2snes_basex.xise
            verilog/sd2snes_basex/*.syr
            verilog/sd2snes_basex/*.par
            verilog/sd2snes_basex/*.mrp
            verilog/sd2snes_basex/*.psr
            verilog/sd2snes_basex/*.twr
            verilog/sd2snes_basex/*.bld
            verilog/sd2snes_basex/*.unroutes
          if-no-files-found: error
          retention-days: 14

      - name: Retain the mapped NCD separately on GitHub
        if: always() && steps.compile.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: basex-late-priority-seed-46-mapped-ncd
          path: verilog/sd2snes_basex/main_map.ncd
          if-no-files-found: error
          retention-days: 14
