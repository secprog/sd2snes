name: Compare CX4 GPR bank timing

on:
  workflow_dispatch:
    inputs:
      include_original:
        description: Rebuild the original control alongside the candidate
        type: boolean
        default: false
      synthesis_goal:
        description: Diagnostic XST optimization goal; other project properties stay fixed
        type: choice
        options: [Area, Speed]
        default: Speed
      map_goal:
        description: Diagnostic MAP cover mode; other implementation properties stay fixed
        type: choice
        options: [Balanced, Speed]
        default: Speed
      audit_tsi:
        description: Generate a separate post-route timing-constraint interaction report
        type: boolean
        default: false
      audit_sampler_paths:
        description: Inspect DAC synchronizer paths under the existing timing constraints
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cx4-gpr-banks-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prove:
    name: Prove every GPR transition and read; reject data and priority mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Prepare pinned component and native diagnostic sources
        run: |
          set -euo pipefail
          # Retain the pre-banking baseline after promoting the proved source.
          # The generator independently verifies its complete Git blob.
          baseline=b52dd4568a5cb9e7ec390c0c5be5aa17ed008dce
          git fetch --no-tags --depth=1 origin "$baseline"
          git show "$baseline:verilog/sd2snes_cx4/cx4.v" > "$RUNNER_TEMP/original-cx4.v"
          python3 .github/scripts/prepare-cx4-gpr-experiment.py \
            "$RUNNER_TEMP/original-cx4.v" "$RUNNER_TEMP/gpr-proof"
          cmp "$RUNNER_TEMP/gpr-proof/candidate-cx4.v" verilog/sd2snes_cx4/cx4.v

      - name: Install formal tools on the GitHub runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys
          yosys -V | tee "$RUNNER_TEMP/gpr-proof/tool-version.txt"

      - name: Prove the full transition relation and both read paths
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/gpr-proof"
          sha256sum --check SHA256SUMS
          for variant in gold gate bad-data bad-priority; do
            mkdir "$variant"
            cp "$variant.v" "$variant/model.v"
            (
              cd "$variant"
              # Preserve the exact 48-byte bound and the existing bus register.
              # Default read-port widening pads this non-power-of-two memory.
              # Check the source model before lowering. memory_map leaves the
              # nonexistent 48..63 read-mux leaves undriven; explicitly retain
              # them as X, never zero and never as new unconstrained inputs.
              yosys -l preparation.log -p 'read_verilog -sv -formal model.v; hierarchy -check -top gpr_model; proc; check -assert; memory -nowiden -memx; dffunmap; opt_expr -keepdc; setundef -undriven -undef; opt_clean; check -assert; write_json state.json'
              model_name=gate
              if [[ "$variant" == gold ]]; then model_name=gold; fi
              python3 "$GITHUB_WORKSPACE/.github/scripts/cut-cx4-gpr-state.py" \
                state.json transition.json "$model_name" | tee state-audit.log
            )
          done
          for variant in gate bad-data bad-priority; do
            cat > "$variant/prove.ys" <<'YOSYS'
          read_json ../gold/transition.json
          read_json transition.json
          miter -equiv -make_assert -make_outputs -make_outcmp -flatten gold gate miter
          hierarchy -check -top miter
          opt_clean
          check -assert
          sat -verify -enable_undef -set-def-inputs -prove-asserts -show-inputs -show-outputs -dump_json counterexample.json -timeout 180
          YOSYS
            result=0
            (cd "$variant" && yosys -l proof.log -s prove.ys) || result=$?
            if [[ "$variant" == gate ]]; then
              test "$result" -eq 0
              grep -F 'SAT proof finished - no model found: SUCCESS!' "$variant/proof.log"
            else
              test "$result" -ne 0
              grep -F 'SAT proof finished - model found: FAIL!' "$variant/proof.log"
              test -s "$variant/counterexample.json"
            fi
          done
          sha256sum --check SHA256SUMS
          printf 'All 392 next-state bits and CPU reads match for every common state and input; both negative controls rejected.\n' \
            | tee verified.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact proof inputs, state audit and counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cx4-gpr-bank-proof
          path: ${{ runner.temp }}/gpr-proof/
          if-no-files-found: error
          retention-days: 14

  compare:
    name: CX4 ${{ matrix.source }} XST ${{ inputs.synthesis_goal }} MAP ${{ inputs.map_goal }} seed 1
    needs: prove
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(inputs.include_original && '["original","banked"]' || '["banked"]') }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: cx4-gpr-bank-proof
          path: ${{ runner.temp }}/gpr-proof

      - name: Select only the proved diagnostic source
        env:
          SOURCE: ${{ matrix.source }}
          XST_GOAL: ${{ inputs.synthesis_goal }}
          MAP_GOAL: ${{ inputs.map_goal }}
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/gpr-proof"
          (cd "$proof_dir" && sha256sum --check SHA256SUMS)
          test -s "$proof_dir/verified.txt"
          cmp "$proof_dir/candidate-cx4.v" verilog/sd2snes_cx4/cx4.v
          if [[ "$SOURCE" == original ]]; then
            cp "$proof_dir/original-cx4.v" verilog/sd2snes_cx4/cx4.v
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          goal = os.environ["XST_GOAL"]
          if goal not in ("Area", "Speed"):
              raise SystemExit("Invalid diagnostic synthesis goal")
          cover = os.environ["MAP_GOAL"]
          if cover not in ("Balanced", "Speed"):
              raise SystemExit("Invalid diagnostic MAP cover mode")
          path = Path("verilog/sd2snes_cx4/sd2snes_cx4.xise")
          text = path.read_text()
          original = 'xil_pn:name="Optimization Goal" xil_pn:value="Speed"'
          if text.count(original) != 1:
              raise SystemExit("Expected exactly one production Speed synthesis property")
          text = text.replace(original, original.replace('"Speed"', f'"{goal}"'))
          original_cover = 'xil_pn:name="Optimization Strategy (Cover Mode)" xil_pn:value="Speed"'
          if text.count(original_cover) != 1:
              raise SystemExit("Expected exactly one production Speed MAP property")
          text = text.replace(original_cover, original_cover.replace('"Speed"', f'"{cover}"'))
          path.write_text(text)
          PY
          {
            printf 'Diagnostic source: %s\nRunner checkout: %s\n' "$SOURCE" "$GITHUB_SHA"
            printf 'XST goal: %s; MAP cover: %s; placement seed: 1. Other project properties, clocks and timing constraints unchanged.\n' "$XST_GOAL" "$MAP_GOAL"
            while IFS= read -r -d '' source_file; do
              printf '%s %s\n' "$(git hash-object --no-filters "$source_file")" "$source_file"
            done < <(git ls-files -z verilog/sd2snes_cx4/ verilog/common.mk verilog/xilinx_scripts/ .github/scripts/build.sh)
          } | tee "$RUNNER_TEMP/cx4-source.txt"

      - uses: ./.github/actions/prepare-build-image
        with:
          target: mk2

      - name: Compile CX4 with strict native PAR and TRACE checks
        env:
          ISE_CTABLE: '1'
        run: |
          set -euo pipefail
          docker image inspect sd2snes-ci:mk2 --format 'ISE image ID: {{.Id}}' \
            | tee -a "$RUNNER_TEMP/cx4-source.txt"
          container_name=sd2snes-cx4-gpr-banks
          bash .github/scripts/report-activity.sh "$container_name" &
          activity_pid=$!
          trap 'kill "$activity_pid" 2>/dev/null || true; wait "$activity_pid" 2>/dev/null || true' EXIT
          docker run --rm --name "$container_name" --user 0:0 \
            --mac-address 08:00:27:68:c9:35 --env ISE_CTABLE \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            --entrypoint /bin/bash sd2snes-ci:mk2 .github/scripts/build.sh mk2 cx4 \
            2>&1 | tee "$RUNNER_TEMP/cx4-build.log"

      - name: Verify production DAC paths use the single-cycle requirement
        run: |
          set -euo pipefail
          core=verilog/sd2snes_cx4
          python3 .github/scripts/cx4-single-cycle-audit.py check-pcf "$core/main.pcf"
          python3 .github/scripts/cx4-single-cycle-audit.py check "$core/main.twr" \
            | tee "$RUNNER_TEMP/cx4-production-dac-result.txt"

      - name: Audit constraint interactions on the routed design
        if: inputs.audit_tsi
        run: |
          set -euo pipefail
          docker run --rm --user 0:0 --mac-address 08:00:27:68:c9:35 \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work/verilog/sd2snes_cx4 \
            --entrypoint /bin/bash sd2snes-ci:mk2 -c '
              set -euo pipefail
              test -s main.ncd && test -s main.pcf && test -s main.twr
              sha256sum main.ncd main.pcf main.twr > tsi-input-checksums.txt
              trce -tsi main.tsi -o tsi-audit.twr main.ncd main.pcf
              test -s main.tsi
              sha256sum --check tsi-input-checksums.txt
            ' 2>&1 | tee "$RUNNER_TEMP/cx4-tsi.log"

      - name: Inspect routed DAC synchronizer paths under existing constraints
        if: inputs.audit_sampler_paths
        run: |
          set -euo pipefail
          core=verilog/sd2snes_cx4
          test -s "$core/main.ncd" && test -s "$core/main.pcf" && test -s "$core/main.twr"
          sha256sum "$core/main.ncd" "$core/main.pcf" "$core/main.twr" \
            > "$RUNNER_TEMP/cx4-sampler-inputs.sha256"
          trap 'rm -f "$core/sampler-full.twr"' EXIT
          trace_status=0
          docker run --rm --user 0:0 --mac-address 08:00:27:68:c9:35 \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work/verilog/sd2snes_cx4 \
            --entrypoint /bin/bash sd2snes-ci:mk2 -c '
              set -euo pipefail
              trce -v 10 -n 1000 -o sampler-full.twr main.ncd main.pcf
            ' 2>&1 | tee "$RUNNER_TEMP/cx4-sampler-trace.log" || trace_status=$?
          sha256sum --check "$RUNNER_TEMP/cx4-sampler-inputs.sha256"
          test "$trace_status" -eq 0
          python3 .github/scripts/inspect-cx4-sampler-paths.py "$core/sampler-full.twr" --cycles 1 \
            | tee "$RUNNER_TEMP/cx4-sampler-paths.txt"

      - name: Record available intermediate checksums
        if: always()
        run: |
          for result_file in main.ngc main.ngd main_map.ncd main.ncd; do
            if [[ -f "verilog/sd2snes_cx4/$result_file" ]]; then
              sha256sum "verilog/sd2snes_cx4/$result_file"
            fi
          done > "$RUNNER_TEMP/cx4-build-checksums.txt"

      - name: Upload reports without publishing diagnostic bitstreams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cx4-gpr-${{ matrix.source }}-xst-${{ inputs.synthesis_goal }}-map-${{ inputs.map_goal }}-seed-1
          path: |
            ${{ runner.temp }}/cx4-source.txt
            ${{ runner.temp }}/cx4-build.log
            ${{ runner.temp }}/cx4-tsi.log
            ${{ runner.temp }}/cx4-production-dac-result.txt
            ${{ runner.temp }}/cx4-sampler-trace.log
            ${{ runner.temp }}/cx4-sampler-paths.txt
            ${{ runner.temp }}/cx4-sampler-inputs.sha256
            ${{ runner.temp }}/cx4-build-checksums.txt
            verilog/sd2snes_cx4/main.xst
            verilog/sd2snes_cx4/main.prj
            verilog/sd2snes_cx4/main.pcf
            verilog/sd2snes_cx4/sd2snes_cx4.xise
            verilog/sd2snes_cx4/*.syr
            verilog/sd2snes_cx4/*.par
            verilog/sd2snes_cx4/*.mrp
            verilog/sd2snes_cx4/*.psr
            verilog/sd2snes_cx4/*.twr
            verilog/sd2snes_cx4/*.tsi
            verilog/sd2snes_cx4/tsi-input-checksums.txt
            verilog/sd2snes_cx4/*.bld
            verilog/sd2snes_cx4/*.unroutes
          if-no-files-found: error
          retention-days: 14
