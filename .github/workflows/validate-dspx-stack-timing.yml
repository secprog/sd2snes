name: Inspect retained DSPX two-register relocation without native build
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dspx-retained-ff-relocation-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  inspect:
    name: Convert and independently compare the complete retained mapping only
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bind exact diagnostic-only source additions and unchanged production inputs
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dspx-relocation-text"
          mkdir "$report"
          python3 - "$report/source-contract.json" <<'PY'
          import hashlib,json,os,subprocess,sys
          from pathlib import Path
          def git(*args):return subprocess.check_output(['git',*args])
          parent='4d0199bf639629284546858b2b92abcd840b48a9'
          expected={
              '.github/scripts/inspect-dspx-retained-ff-relocation.py':'cc8974b90ec30e14f2cdc683eeccf97c2955aecf',
              'verilog/sd2snes_dspx/dma4_ff_relocation.tcl':'e29662ffe5b0fe2a67da531eb48a876b281707f7'}
          assert git('rev-parse','HEAD').decode().strip()==os.environ['GITHUB_SHA']
          assert git('rev-parse','HEAD^').decode().strip()==parent
          changed=set(git('diff','--name-only',parent,'HEAD').decode().splitlines())
          assert changed==set(expected)|{'.github/workflows/validate-dspx-stack-timing.yml'}
          rows=[]
          for name,want in expected.items():
              raw=Path(name).read_bytes()
              actual=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              assert actual==want
              rows.append(dict(path=name,bytes=len(raw),gitBlob=actual,sha256=hashlib.sha256(raw).hexdigest()))
          for name in ['verilog/common.mk','verilog/sd2snes_dspx/Makefile',
                       'verilog/sd2snes_dsp/main.v','verilog/sd2snes_dsp/upd77c25.v',
                       '.github/scripts/post-sync-evidence.py','.github/actions/prepare-build-image/action.yml']:
              assert Path(name).read_bytes()==git('show',parent+':'+name)
          assert git('diff',parent,'HEAD','--','verilog/sd2snes_dsp','verilog/sd2snes_base')==b''
          assert not Path('verilog/sd2snes_dspx/ucf.extra').exists()
          result=dict(head=os.environ['GITHUB_SHA'],parent=parent,files=rows,
              exactChangedFiles=sorted(changed),allOtherTrackedFilesEqualParent=True,
              productionRtlMakefilesConstraintsAndOriginalParTraceUnchanged=True,
              productionHookWired=False,nativeEligible=False,noTimingResult=True)
          Path(sys.argv[1]).write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$report/source-before"
      - name: Run existing hosted source and owned-container evidence controls
        run: |
          set -euo pipefail
          python3 .github/scripts/post-sync-evidence.py --self-test "$RUNNER_TEMP/dspx-relocation-controls"
          cp "$RUNNER_TEMP/dspx-relocation-controls/self-test-results.json" "$RUNNER_TEMP/dspx-relocation-text/evidence-controls.json"
      - name: Bind and retrieve the exact original failed-timing mapped checkpoint on GitHub only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="$RUNNER_TEMP/dspx-relocation-text/api"
          mkdir "$api"
          gh api repos/secprog/sd2snes/actions/runs/43467561223 > "$api/run.json"
          gh api 'repos/secprog/sd2snes/actions/runs/43467561223/jobs?per_page=100' > "$api/jobs.json"
          gh api repos/secprog/sd2snes/actions/artifacts/14062690690 > "$api/artifact.json"
          python3 - "$api/artifact.json" "$api/run.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]));r=json.load(open(sys.argv[2]))
          assert a['id']==14062690690 and a['size_in_bytes']==2520006
          assert a['digest']=='sha256:fae12362d987524ba0f7713e563f82bd27940b3f8010e7e43d589a17fe3ae93c'
          assert not a['expired'] and a['workflow_run']['id']==43467561223
          assert r['id']==43467561223 and r['head_sha']=='f4bcfe872f4c10f067fd1d6eca72882fa23b5b26'
          assert r['run_attempt']==1 and r['status']=='completed' and r['conclusion']=='failure'
          PY
          gh api repos/secprog/sd2snes/actions/artifacts/14062690690/zip > "$RUNNER_TEMP/dspx-original-best-github-only.zip"
      - uses: ./.github/actions/prepare-build-image
        with:
          target: mk2
      - name: Capture direct tool statuses, hosted controls, two conversions and complete record conservation
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dspx-relocation-text"
          set +e
          python3 .github/scripts/inspect-dspx-retained-ff-relocation.py \
            "$RUNNER_TEMP/dspx-original-best-github-only.zip" "$report/api" \
            "$RUNNER_TEMP/dspx-relocation-design" "$report/inspection" \
            /work/verilog/sd2snes_dspx/dma4_ff_relocation.tcl 2>&1 | tee "$report/inspection-console.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf 'helper=%s tee=%s\n' "${statuses[0]}" "${statuses[1]}" > "$report/inspection-exits.txt"
          test "${statuses[0]}" = 0 && test "${statuses[1]}" = 0
      - name: Preserve complete source/index immutability and audit the complete safe-text union
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dspx-relocation-text"
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$report/source-after"
          cmp "$report/source-before.json" "$report/source-after.json"
          cmp "$report/source-before-index.txt" "$report/source-after-index.txt"
          python3 - "$report" <<'PY'
          import hashlib,json,stat,sys
          from pathlib import Path
          root=Path(sys.argv[1]);rows=[];total=0;seen=set()
          for path in sorted(root.rglob('*')):
              assert not path.is_symlink()
              if path.is_dir():continue
              assert stat.S_ISREG(path.stat().st_mode)
              rel=path.relative_to(root).as_posix()
              assert rel.casefold() not in seen;seen.add(rel.casefold())
              assert path.suffix in ('.json','.txt','.log','.raw')
              raw=path.read_bytes()
              assert len(raw)<=3000000 and b'\0' not in raw
              raw.decode('utf-8');total+=len(raw)
              rows.append(dict(path=rel,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest()))
          assert len(rows)<1024 and total<112000000
          result=dict(files=rows,fileCount=len(rows),bytes=total,allRegularSafeUtf8NoNul=True,
              noTruncation=True,originalWholeHashGatesUnchanged=True,allExecutionGitHubOnly=True,
              nativeEligible=False,noTimingResult=True)
          raw=(json.dumps(result,indent=2)+'\n').encode()
          assert len(raw)<=3000000 and total+len(raw)<=112000000
          (root/'safe-text-union.json').write_bytes(raw)
          print(json.dumps({k:v for k,v in result.items() if k!='files'},indent=2))
          PY
      - name: Upload bounded raw records and complete source, tool and record-index text evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dspx-retained-ff-relocation-text
          path: ${{ runner.temp }}/dspx-relocation-text/
          if-no-files-found: error
          retention-days: 14
      - name: Keep all original and converted native designs exclusively on GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dspx-retained-ff-relocation-design-github-only
          path: ${{ runner.temp }}/dspx-relocation-design/
          if-no-files-found: warn
          retention-days: 14
