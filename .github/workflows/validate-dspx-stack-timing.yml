name: Recover complete basex and ST0018 production reports
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: basex-st0018-report-recovery
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Recover complete existing reports without any native or proof execution
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 .github/scripts/recover-basex-st0018-native-reports.py "$RUNNER_TEMP/recovered-native-reports"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basex-st0018-recovered-complete-production-text
          path: ${{ runner.temp }}/recovered-native-reports/
          if-no-files-found: error
          retention-days: 14
