name: Prepare cached build image
description: Restore a prepared toolchain image, or build and cache it before compilation.
inputs:
  target:
    description: Build environment (mk2, mk3, or software).
    required: true
runs:
  using: composite
  steps:
    - name: Free hosted runner disk space for FPGA tools
      if: inputs.target != 'software'
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
          /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
        df -h /

    - name: Restore toolchain image
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/sd2snes-images/${{ inputs.target }}.tar
        key: ${{ runner.os }}-${{ runner.arch }}-sd2snes-image-v1-${{ inputs.target }}-${{ hashFiles(format('.github/docker/{0}.Dockerfile', inputs.target), format('.github/docker/{0}', inputs.target == 'software' && 'build-gcc13.sh' || 'trim-ise.sh')) }}

    - name: Free hosted runner disk space for software preparation
      if: inputs.target == 'software' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        available_kib=$(df --output=avail -k / | tail -1)
        if ((available_kib < 20 * 1024 * 1024)); then
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/powershell
        fi
        df -h /

    - name: Restore SNES assembler source
      if: inputs.target == 'software' && steps.cache.outputs.cache-hit != 'true'
      id: snes-source
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/sd2snes-sources/snescom-1.8.1.1.tar.xz
        key: sd2snes-source-snescom-1.8.1.1-7caade189572d4463c281b48d1bc68b5f9f7070c40b02e220565a6b48b18ae2a

    - name: Fetch and verify SNES assembler source
      if: inputs.target == 'software' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        archive="$RUNNER_TEMP/sd2snes-sources/snescom-1.8.1.1.tar.xz"
        mkdir -p "$(dirname "$archive")"
        if [[ ! -f "$archive" ]]; then
          for url in \
            https://bisqwit.iki.fi/src/arch/snescom-1.8.1.1.tar.xz \
            http://bisqwit.iki.fi/src/arch/snescom-1.8.1.1.tar.xz \
            https://web.archive.org/web/20180814103935id_/https://bisqwit.iki.fi/src/arch/snescom-1.8.1.1.tar.xz; do
            # The fixed SHA-256 also verifies the archived upstream copy.
            if curl -4 --http1.1 --fail --location --connect-timeout 20 --max-time 180 --retry 3 \
              "$url" -o "$archive"; then
              break
            fi
          done
        fi
        echo "7caade189572d4463c281b48d1bc68b5f9f7070c40b02e220565a6b48b18ae2a  $archive" | sha256sum --check
        cp "$archive" .github/docker/snescom.tar.xz

    - name: Save SNES assembler source
      if: inputs.target == 'software' && steps.cache.outputs.cache-hit != 'true' && steps.snes-source.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/sd2snes-sources/snescom-1.8.1.1.tar.xz
        key: ${{ steps.snes-source.outputs.cache-primary-key }}

    - name: Build toolchain image on cache miss
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        BUILD_TARGET: ${{ inputs.target }}
      run: |
        case "$BUILD_TARGET" in mk2|mk3|software) ;; *) exit 2 ;; esac
        docker build --file ".github/docker/$BUILD_TARGET.Dockerfile" \
          --tag "sd2snes-ci:$BUILD_TARGET" .github/docker
        # Drop the large vendor/intermediate stages before writing a cache tar.
        # The tagged final image is retained by Docker.
        docker builder prune --all --force
        mkdir -p "$RUNNER_TEMP/sd2snes-images"
        docker image save "sd2snes-ci:$BUILD_TARGET" \
          --output "$RUNNER_TEMP/sd2snes-images/$BUILD_TARGET.tar"

    # Save immediately: a source/timing failure must not discard provisioning.
    - name: Save toolchain image
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/sd2snes-images/${{ inputs.target }}.tar
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Load cached toolchain image
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      env:
        BUILD_TARGET: ${{ inputs.target }}
      run: docker image load --input "$RUNNER_TEMP/sd2snes-images/$BUILD_TARGET.tar"

    - name: Release temporary image archive
      shell: bash
      env:
        BUILD_TARGET: ${{ inputs.target }}
      run: |
        rm -f "$RUNNER_TEMP/sd2snes-images/$BUILD_TARGET.tar"
        docker image inspect "sd2snes-ci:$BUILD_TARGET" --format '{{.Id}} {{.Size}} bytes'
        df -h /
