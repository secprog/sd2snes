name: Inspect adopted DSPX DMA write-enable mapping
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dspx-dma-write-inspection-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  inspect:
    name: Inspect exact retained baseline without rebuilding
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Authenticate unchanged adopted DSPX source
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dma-write-snapshots"
          mkdir "$report"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD:verilog)" = 893e807029df25af8263fd63fa71dadabf02b0d0
          test -z "$(git diff 4d0199bf639629284546858b2b92abcd840b48a9 HEAD -- verilog)"
          test "$(git hash-object --no-filters .github/scripts/inspect-dspx-dma-write-baseline.py)" = bdf304c04277ba6a89e0e03b45c36a394bb8dd53
          test "$(git hash-object --no-filters .github/scripts/post-sync-evidence.py)" = fdb60667eb015c3769b2adc452864396ff64e9e7
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$report/source-before"
      - name: Inspect original mapped DMA register controls on GitHub only
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/dma-write-api"
          gh api repos/secprog/sd2snes/actions/artifacts/14062690690 > "$RUNNER_TEMP/dma-write-api/artifact.json"
          gh api 'repos/secprog/sd2snes/actions/runs/43467561223/jobs?per_page=100' > "$RUNNER_TEMP/dma-write-api/jobs.json"
          gh api repos/secprog/sd2snes/actions/artifacts/14062690690/zip > "$RUNNER_TEMP/dma-write-design.zip"
          python3 .github/scripts/inspect-dspx-dma-write-baseline.py "$RUNNER_TEMP/dma-write-design.zip" "$RUNNER_TEMP/dma-write-api" "$RUNNER_TEMP/dma-write-text"
          cp "$RUNNER_TEMP/dma-write-api/"*.json "$RUNNER_TEMP/dma-write-text/"
          cat "$RUNNER_TEMP/dma-write-text/controls.json"
          cat "$RUNNER_TEMP/dma-write-text/inspection-result.json"
      - name: Require unchanged full checkout and index
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dma-write-snapshots"
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$report/source-after"
          cmp "$report/source-before.json" "$report/source-after.json"
          cmp "$report/source-before-index.txt" "$report/source-after-index.txt"
      - name: Retain bounded text including incomplete collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dspx-dma-write-baseline-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dma-write-text/
            ${{ runner.temp }}/dma-write-snapshots/
            ${{ runner.temp }}/dma-write-api/
          if-no-files-found: error
          retention-days: 14
