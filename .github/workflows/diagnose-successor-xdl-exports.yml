# Characterize two fresh read-only exports of each exact retained NCD.
# Preserve the earlier whole-XDL hash failures; do not alter or waive those gates.
name: Diagnose retained successor XDL export identity

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: successor-xdl-export-diagnosis-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: basex
            xdl_name: srtc-late-bits-map.xdl
            ncd_sha256: d7491c9fa35596d64c3ab6d6820b3c36f04769ae469467524cc17258f453dc5f
          - family: dsp
            xdl_name: late-low-map.xdl
            ncd_sha256: 4f7b507e401b716cc16da5c89f2c7bfe18bdb6b33bc1dd76db36e43f7b961113
    name: Diagnose exact retained ${{ matrix.family }} XDL exports
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Locate isolated evidence directories on the hosted runner
        run: |
          set -euo pipefail
          {
            printf 'EVIDENCE_ROOT=%s/xdl-diagnosis-evidence-%s\n' "$RUNNER_TEMP" '${{ matrix.family }}'
            printf 'CHECK_PREFIX=%s/xdl-diagnosis-%s\n' "$RUNNER_TEMP" '${{ matrix.family }}'
            printf 'EXPORT_ROOT=%s/xdl-diagnosis-exports-%s\n' "$RUNNER_TEMP" '${{ matrix.family }}'
            printf 'OUTPUT_ROOT=%s/xdl-diagnosis-output-%s\n' "$RUNNER_TEMP" '${{ matrix.family }}'
          } >> "$GITHUB_ENV"

      - name: Pin diagnostic sources and inventory every tracked input
        id: inventory
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 6d581dc4c82afa3ad8cb0838ed34a4997a33e69b
          test "$(git rev-parse HEAD:verilog)" = 01ce8b6b4509a5a72e0ad739e06bf19e548a2fc1
          test "$(git hash-object --no-filters .github/fixtures/successor-xdl-export-failure-data.json)" = 1ca4a8fae7d092fd5b9f586327947be86c8be9f9
          test "$(git hash-object --no-filters .github/fixtures/successor-retained-map-data.json)" = 636410f9f5d073d6b8d19a04b2c6f71b34e4ed49
          test "$(git hash-object --no-filters .github/scripts/download-successor-retained-map.py)" = b26865903a6a533a7e1e971f50e93e1cb943d10e
          test "$(git hash-object --no-filters .github/scripts/inspect-successor-xdl-exports.py)" = c39a18e54840563689dd1d19474eb352384afdc5
          test "$(git hash-object --no-filters .github/scripts/inspect-dsp-retained-map.py)" = 2b3b867372717b5729e26cb4880cb1af0b01a965
          test "$(git hash-object --no-filters .github/actions/prepare-build-image/action.yml)" = ac2a66fc24d4a15658b666cdc5f5db7964df4c3b
          git diff --exit-code
          git diff --cached --exit-code
          git ls-files -z | xargs -0 sha256sum > "$CHECK_PREFIX-before.sha256"
          git ls-files -s > "$CHECK_PREFIX-before-index.txt"
          printf 'Checkout: %s\nProduction Verilog tree: %s\nPrior failed inspection head: %s\n' "$GITHUB_SHA" "$(git rev-parse HEAD:verilog)" "$(git rev-parse HEAD^)" | tee "$CHECK_PREFIX-identity.txt"

      - name: Validate hosted export-analysis controls
        run: |
          set -euo pipefail
          python3 .github/scripts/inspect-successor-xdl-exports.py --self-test

      - name: Bind original MAP evidence and preserve exact later export-gate failures
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/download-successor-retained-map.py '${{ matrix.family }}' "$EVIDENCE_ROOT"
          cp "$EVIDENCE_ROOT/download-provenance.json" "$CHECK_PREFIX-map-provenance.json"
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('pinned_downloader', '.github/scripts/download-successor-retained-map.py')
          helper = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(helper)
          expected = json.loads(Path('.github/fixtures/successor-xdl-export-failure-data.json').read_text())
          run_id = expected['run']['id']
          run = helper.api(f'actions/runs/{run_id}')
          helper.same_fields(run, expected['run'], 'Exact failed export-inspection run')
          jobs = helper.api(f'actions/runs/{run_id}/jobs?per_page=100')
          by_job = {j['id']: j for j in jobs['jobs']}
          if jobs['total_count'] != len(expected['jobs']) or len(jobs['jobs']) != jobs['total_count'] or set(by_job) != {j['id'] for j in expected['jobs']}:
              raise SystemExit('Complete failed-inspection jobs differ')
          for job in expected['jobs']:
              helper.same_fields(by_job[job['id']], job, 'Exact failed job and every step')
          inventory = helper.api(f'actions/runs/{run_id}/artifacts?per_page=100')
          by_artifact = {a['id']: a for a in inventory['artifacts']}
          if inventory['total_count'] != len(expected['artifacts']) or len(inventory['artifacts']) != inventory['total_count'] or set(by_artifact) != {a['id'] for a in expected['artifacts']}:
              raise SystemExit('Complete failure-report artifact set differs')
          output = Path(os.environ['EVIDENCE_ROOT']) / 'failed-inspection'
          output.mkdir(exist_ok=False)
          retained = []
          for artifact in expected['artifacts']:
              actual = by_artifact[artifact['id']]
              helper.same_fields(actual, artifact, 'Exact failed-inspection report artifact')
              if actual['expired'] or actual['workflow_run']['id'] != run_id or actual['workflow_run']['head_sha'] != run['head_sha']:
                  raise SystemExit('Expired or mismatched failed-inspection report')
              raw, records = helper.verified_zip(actual)
              target_root = output / artifact['name']
              target_root.mkdir()
              for path, data in records:
                  target = target_root / path
                  if target_root.resolve() not in target.resolve().parents:
                      raise SystemExit('Failure report path escapes output')
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
              (output / (artifact['name'] + '.zip')).write_bytes(raw)
              retained.append({'artifact': actual, 'members': len(records)})
          result = {'run': run, 'jobs': jobs, 'artifacts': inventory, 'retainedReports': retained,
                    'historicalExportFailuresPreserved': True, 'causeOfHistoricalMismatch': 'undetermined',
                    'historicalFullXdlBytesUnavailable': True, 'noGateRemovedOrWaived': True}
          Path(os.environ['CHECK_PREFIX'] + '-failed-inspection-provenance.json').write_text(json.dumps(result, indent=2) + '\n')
          print('Exact two failed export-inspection jobs, every step and both digest-verified complete text artifacts preserved.')
          PY
          find "$EVIDENCE_ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$CHECK_PREFIX-evidence-before.sha256"
          printf '%s  %s\n' '${{ matrix.ncd_sha256 }}' "$EVIDENCE_ROOT/input/main_map.ncd" | sha256sum --check

      - uses: ./.github/actions/prepare-build-image
        with:
          target: mk2

      - name: Produce two controlled read-only exports of the identical retained NCD
        id: exports
        run: |
          set -euo pipefail
          image_id=$(docker image inspect sd2snes-ci:mk2 --format '{{.Id}}')
          printf 'ISE image ID: %s\n' "$image_id" | tee -a "$CHECK_PREFIX-identity.txt"
          test "$image_id" = sha256:5e3bbb00649997abca8843b1d82d8529eda99a0f2868d37ad9777e0ad5fd50e8
          mkdir "$EXPORT_ROOT"
          stat --printf='Input NCD bytes=%s mtime=%y\n' "$EVIDENCE_ROOT/input/main_map.ncd" | tee "$CHECK_PREFIX-input-file-metadata.txt"
          docker run --rm --read-only --network none --user 0:0 \
            --tmpfs /tmp:rw,exec,size=256m --mac-address 08:00:27:68:c9:35 \
            --env EXPECTED_NCD_SHA='${{ matrix.ncd_sha256 }}' \
            --volume "$EVIDENCE_ROOT/input/main_map.ncd:/input/main_map.ncd:ro" \
            --volume "$EXPORT_ROOT:/output" --workdir /tmp \
            --entrypoint /bin/bash sd2snes-ci:mk2 -c \
            'set -euo pipefail
             printf "%s  %s\n" "$EXPECTED_NCD_SHA" /input/main_map.ncd | sha256sum --check
             printf "Export A UTC: "; date -u +%Y-%m-%dT%H:%M:%SZ
             xdl -ncd2xdl -nopips /input/main_map.ncd /output/${{ matrix.xdl_name }}
             mv -- /output/${{ matrix.xdl_name }} /output/export-a.xdl
             printf "%s  %s\n" "$EXPECTED_NCD_SHA" /input/main_map.ncd | sha256sum --check
             sleep 2
             printf "Export B UTC: "; date -u +%Y-%m-%dT%H:%M:%SZ
             xdl -ncd2xdl -nopips /input/main_map.ncd /output/${{ matrix.xdl_name }}
             mv -- /output/${{ matrix.xdl_name }} /output/export-b.xdl
             printf "%s  %s\n" "$EXPECTED_NCD_SHA" /input/main_map.ncd | sha256sum --check' \
            2>&1 | tee "$CHECK_PREFIX-conversion-console.txt"
          printf '%s  %s\n' '${{ matrix.ncd_sha256 }}' "$EVIDENCE_ROOT/input/main_map.ncd" | sha256sum --check
          test -s "$EXPORT_ROOT/export-a.xdl"
          test -s "$EXPORT_ROOT/export-b.xdl"
          test "$(stat -c %s "$EXPORT_ROOT/export-a.xdl")" -le 32000000
          test "$(stat -c %s "$EXPORT_ROOT/export-b.xdl")" -le 32000000
          sha256sum "$EXPORT_ROOT/export-a.xdl" "$EXPORT_ROOT/export-b.xdl" | tee "$CHECK_PREFIX-exports-before.sha256"

      - name: Preserve full fresh XDL exports separately on GitHub
        if: always() && steps.exports.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: successor-xdl-export-${{ matrix.family }}-full-exports-github-only
          path: ${{ runner.temp }}/xdl-diagnosis-exports-${{ matrix.family }}/*.xdl
          if-no-files-found: error
          retention-days: 14

      - name: Retain exact export differences and original-record comparisons
        run: |
          set -euo pipefail
          python3 -u .github/scripts/inspect-successor-xdl-exports.py '${{ matrix.family }}' "$EXPORT_ROOT/export-a.xdl" "$EXPORT_ROOT/export-b.xdl" "$EVIDENCE_ROOT/reports" "$OUTPUT_ROOT" \
            2>&1 | tee "$CHECK_PREFIX-diagnosis-console.txt"
          sha256sum --check "$CHECK_PREFIX-exports-before.sha256"

      - name: Require complete source, evidence and export inventories unchanged
        if: always() && steps.inventory.outcome == 'success'
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          git ls-files -z | xargs -0 sha256sum > "$CHECK_PREFIX-after.sha256"
          cmp "$CHECK_PREFIX-before.sha256" "$CHECK_PREFIX-after.sha256"
          sha256sum --check "$CHECK_PREFIX-before.sha256" > "$CHECK_PREFIX-final-manifest-check.txt"
          git ls-files -s > "$CHECK_PREFIX-after-index.txt"
          cmp "$CHECK_PREFIX-before-index.txt" "$CHECK_PREFIX-after-index.txt"
          if [[ '${{ steps.evidence.outcome }}' == success ]]; then
            find "$EVIDENCE_ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$CHECK_PREFIX-evidence-after.sha256"
            cmp "$CHECK_PREFIX-evidence-before.sha256" "$CHECK_PREFIX-evidence-after.sha256"
            sha256sum --check "$CHECK_PREFIX-evidence-before.sha256" > "$CHECK_PREFIX-evidence-final-check.txt"
          fi
          if [[ '${{ steps.exports.outcome }}' == success ]]; then
            find "$EXPORT_ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$CHECK_PREFIX-exports-after.sha256"
            cmp "$CHECK_PREFIX-exports-before.sha256" "$CHECK_PREFIX-exports-after.sha256"
            sha256sum --check "$CHECK_PREFIX-exports-before.sha256"
          fi

      - name: Retain bounded text diagnosis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: successor-xdl-export-${{ matrix.family }}-reports
          path: |
            ${{ runner.temp }}/xdl-diagnosis-${{ matrix.family }}-*.txt
            ${{ runner.temp }}/xdl-diagnosis-${{ matrix.family }}-*.json
            ${{ runner.temp }}/xdl-diagnosis-${{ matrix.family }}-*.sha256
            ${{ runner.temp }}/xdl-diagnosis-output-${{ matrix.family }}/**/*.txt
            ${{ runner.temp }}/xdl-diagnosis-output-${{ matrix.family }}/**/*.json
          if-no-files-found: error
          retention-days: 14

