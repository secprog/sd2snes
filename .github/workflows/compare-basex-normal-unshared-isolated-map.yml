              raise SystemExit('Original failure retention or diagnostic scope differs')
          raw = subprocess.check_output(['gh', 'api', 'repos/secprog/sd2snes/actions/artifacts/13053965982/zip'])
          if len(raw) != 1717375 or hashlib.sha256(raw).hexdigest() != 'c35142e5f6718a75d0ddad4bdf6ecbb989b5e7951b64a7a9fb93edf032e89b53':
              raise SystemExit('Stable report guard ZIP digest differs')
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              entries = archive.infolist()
              if len(entries) != 79 or sum(i.file_size for i in entries) != 14224454 or any(i.file_size > 8_000_000 for i in entries):
                  raise SystemExit('Unexpected complete stable report guard inventory')
              names = set()
              for item in entries:
                  p = PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts or ':' in item.filename or chr(92) in item.filename or item.filename in names:
                      raise SystemExit('Unsafe/duplicate stable report guard member')
                  names.add(item.filename)
              summaries = [i for i in entries if i.filename.endswith('/summary.json')]
              if len(summaries) != 1:
                  raise SystemExit('Missing/duplicate stable report summary')
