name: Validate ST0018 mask implementation and strict hold timing
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: st0018-mask-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  IGNORE_TIMING: '0'
jobs:
  proof:
    name: Prove the complete ST0018 CPU transition and all mask bits
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bind only the complete reviewed CPU rewrite and original IP isolation
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/st0018-proof"
          mkdir "$report"
          python3 .github/scripts/validate-st0018-mask-timing.py contract "$report"
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$report/source-before"
      - name: Install and identify GitHub-hosted formal and simulation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys iverilog
          yosys -V | tee "$RUNNER_TEMP/st0018-proof/yosys-version.txt"
          grep -F 'Yosys 0.33 (git sha1 2584903a060)' "$RUNNER_TEMP/st0018-proof/yosys-version.txt"
          iverilog -V > "$RUNNER_TEMP/st0018-proof/iverilog-version.txt" 2>&1
          grep -F 'Icarus Verilog version 12.0' "$RUNNER_TEMP/st0018-proof/iverilog-version.txt"
      - name: Prove all CPU and register-file state and require actual bad-mask and clock-enable counterexamples
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-st0018-mask-timing.py proof "$RUNNER_TEMP/st0018-proof/models"
      - name: Require unchanged complete source and index after all hosted proofs
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/st0018-proof"
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$report/source-after"
          cmp "$report/source-before.json" "$report/source-after.json"
          cmp "$report/source-before-index.txt" "$report/source-after-index.txt"
          printf 'Complete source and index unchanged\n' > "$report/integrity-verified.txt"
      - name: Audit all bounded proof text before upload
        if: always()
        run: python3 .github/scripts/validate-st0018-mask-timing.py union "$RUNNER_TEMP/st0018-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: st0018-mask-complete-source-proof
          path: ${{ runner.temp }}/st0018-proof/
          if-no-files-found: error
          retention-days: 14
  native:
    name: Build one ST0018 candidate and inspect all setup and hold records
    needs: proof
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: st0018-mask-complete-source-proof
          path: ${{ runner.temp }}/st0018-proof-binding
      - name: Bind native source to this run's successful complete CPU proof
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/st0018-native"
          mkdir "$report"
          python3 .github/scripts/validate-st0018-mask-timing.py contract "$report"
          python3 - "$RUNNER_TEMP/st0018-proof-binding/models/proof-result.json" <<'PY'
          import json,os,sys
          p=json.load(open(sys.argv[1]))
          assert p['head']==os.environ['GITHUB_SHA']
          assert p['completeCpuAndRegfile'] and p['strictXEquality'] and p['arbitrarySharedState']
          assert p['actualMaskComparisons']==4352 and len(p['sat'])==4
          assert all(x['actualSatResult'] for x in p['sat'])
          assert [x['exit'] for x in p['sat']]==[0,0,1,1]
          PY
          cmp "$report/source-contract.json" "$RUNNER_TEMP/st0018-proof-binding/source-contract.json"
          cp "$RUNNER_TEMP/st0018-proof-binding/models/proof-result.json" "$report/accepted-source-proof.json"
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$report/source-before"
      - name: Bind exact original ST0018 report artifact and authentic workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/validate-st0018-mask-timing.py baseline "$RUNNER_TEMP/st0018-native/baseline"
      - name: Exercise existing hosted source and owned-container evidence controls
        run: python3 .github/scripts/post-sync-evidence.py --self-test "$RUNNER_TEMP/st0018-native/evidence-controls"
      - uses: ./.github/actions/prepare-build-image
        with:
          target: mk2
      - name: Generate only the original isolated ST0018 IP and retain every product
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/st0018-native"
          python3 .github/scripts/validate-st0018-mask-timing.py container "$report" ip
          python3 .github/scripts/validate-st0018-mask-timing.py freeze-ip "$report" before
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$report/source-after-ip"
          cmp "$report/source-before.json" "$report/source-after-ip.json"
          cmp "$report/source-before-index.txt" "$report/source-after-ip-index.txt"
      - name: Run the original strict ST0018 production build exactly once
        id: native
        run: python3 .github/scripts/validate-st0018-mask-timing.py container "$RUNNER_TEMP/st0018-native" native
      - name: Check FROM-TO hold coverage explicitly without changing the routed input or any PCF byte
        if: success()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/st0018-native"
          sha256sum verilog/sd2snes_st0018/main.ncd verilog/sd2snes_st0018/main.pcf > "$report/hold-inputs-before.sha256"
          stat --printf '%n %s %y\n' verilog/sd2snes_st0018/main.ncd verilog/sd2snes_st0018/main.pcf > "$report/hold-inputs-before.stat"
          python3 .github/scripts/validate-st0018-mask-timing.py container "$report" hold
          sha256sum --check "$report/hold-inputs-before.sha256" > "$report/hold-inputs-check.txt"
          stat --printf '%n %s %y\n' verilog/sd2snes_st0018/main.ncd verilog/sd2snes_st0018/main.pcf > "$report/hold-inputs-after.stat"
          cmp "$report/hold-inputs-before.stat" "$report/hold-inputs-after.stat"
      - name: Preserve all native reports and require complete source and IP immutability
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/st0018-native"
          python3 .github/scripts/validate-st0018-mask-timing.py collect "$report"
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$report/source-after"
          cmp "$report/source-before.json" "$report/source-after.json"
          cmp "$report/source-before-index.txt" "$report/source-after-index.txt"
          python3 .github/scripts/validate-st0018-mask-timing.py freeze-ip "$report" after
          printf 'Complete source/index/IP byte and mtime checks passed\n' > "$report/integrity-verified.txt"
      - name: Measure incremental hold improvement and retain any real strict timing failure
        if: always() && steps.native.outcome != 'skipped'
        run: python3 .github/scripts/validate-st0018-mask-timing.py analyze "$RUNNER_TEMP/st0018-native" "$RUNNER_TEMP/st0018-native/baseline"
      - name: Audit complete bounded native text
        if: always()
        run: python3 .github/scripts/validate-st0018-mask-timing.py union "$RUNNER_TEMP/st0018-native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: st0018-mask-complete-native-reports
          path: ${{ runner.temp }}/st0018-native/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: st0018-mask-design-github-only
          path: |
            verilog/sd2snes_st0018/*.ncd
            verilog/sd2snes_st0018/*.ngd
            verilog/sd2snes_st0018/*.ngc
            verilog/sd2snes_st0018/*.pcf
            verilog/sd2snes_st0018/*.bit
            verilog/sd2snes_st0018/ip/mk2/build/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

