name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build:
        description: Three board-specific releases, software checks with existing FPGA images, or menus only
        type: choice
        options: [all, software, menus, fpga]
        default: all
      ignore_timing:
        description: Build and upload timing-unverified packages; native tool failures still fail
        type: boolean
        default: false
      fpga_run_id:
        description: Run containing fpga-mk3 (required for software checks)
        type: string
      mk2_run_id:
        description: Optional run containing fpga-mk2-mini, to reuse the MkII bootstrap
        type: string
      fpga_cores:
        description: For fpga mode only, optional comma-separated targets (e.g. mk2:sgb,mk2:gsu)
        type: string
      gbc_rtl_only:
        description: For explicit GBC FPGA targets, optionally run RTL checks without native FPGA builds
        type: choice
        options: [none, all, clock]
        default: none
      gbc_mcu_check:
        description: Also compile normal and experimental MkII GBC firmware with a freshly built bootstrap
        type: boolean
        default: false
      placement_seeds:
        description: For MkII fpga mode only, optional comma-separated placer seeds (1..100)
        type: string
      release_target:
        description: Packages to build in full release mode (MkIII variants share the FPGA build)
        type: choice
        options: [all, mk2, mk3, mk3-stm32, mk3-both]
        default: all

permissions:
  contents: read
  actions: read

env:
  IGNORE_TIMING: ${{ github.event_name == 'workflow_dispatch' && inputs.ignore_timing && '1' || '0' }}

concurrency:
  group: firmware-${{ github.ref }}-${{ inputs.build || 'all' }}-${{ inputs.release_target || 'all' }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'latest' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  gbc-checks:
    if: inputs.build == 'fpga' && contains(inputs.fpga_cores, 'gbc')
    name: Check GBC framebuffer, GB audio and both SNES players
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        if: inputs.gbc_rtl_only != 'all' && inputs.gbc_rtl_only != 'clock'
        with:
          repository: RPGHacker/asar
          ref: 6a6dbdaed8cb773e583052ce4f66375bd896c3a1
          path: .ci-tools/asar-src
      - name: Prepare hosted simulation and assembly tools
        env:
          RTL_ONLY: ${{ inputs.gbc_rtl_only }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends iverilog
          if [[ "$RTL_ONLY" == all || "$RTL_ONLY" == clock ]]; then exit 0; fi
          sudo apt-get install -y --no-install-recommends cmake g++
          cmake -S .ci-tools/asar-src/src -B .ci-tools/asar-build -DCMAKE_BUILD_TYPE=Release \
            -DASAR_GEN_EXE=ON -DASAR_GEN_DLL=OFF -DASAR_GEN_LIB=OFF \
            -DASAR_GEN_EXE_TEST=OFF -DASAR_GEN_DLL_TEST=OFF
          cmake --build .ci-tools/asar-build --target asar-standalone --parallel 2
      - name: Execute pixel, SRAM backpressure, reset and GB audio comparisons
        env:
          RTL_ONLY: ${{ inputs.gbc_rtl_only }}
        run: |
          set -o pipefail
          args=()
          if [[ "$RTL_ONLY" == clock ]]; then args+=(--clock-only); fi
          python3 tests/test_gbc_mk2.py "${args[@]}" | tee "$RUNNER_TEMP/gbc-rtl.log"
      - name: Assemble and validate both wire protocols and existing player behavior
        if: inputs.gbc_rtl_only != 'all' && inputs.gbc_rtl_only != 'clock'
        run: |
          set -o pipefail
          export ASAR="$GITHUB_WORKSPACE/.ci-tools/asar-build/asar/bin/asar"
          make -C snes/gbc all mk2 harness check ASAR="$ASAR" | tee "$RUNNER_TEMP/gbc-assembly.log"
          python3 snes/gbc/selfcheck.py -v misc/gbc_snes_mk2.bin
          GBC_BIN_REQUIRED=1 bash tests/host/run_gbc_player.sh | tee "$RUNNER_TEMP/gbc-player.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gbc-player-and-rtl-checks
          path: |
            ${{ runner.temp }}/gbc-*.log
            misc/gbc_snes.bin
            misc/gbc_snes_mk2.bin
          retention-days: 14

  package-contract:
    if: inputs.build != 'fpga' || inputs.gbc_mcu_check
    name: Check firmware and overlay package contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Exercise matching-build and malformed-package controls
        run: |
          set -euo pipefail
          python3 .github/scripts/check-fpga-manifest.py self-test
          bash .github/scripts/check-mcu.sh --self-test

  prepare-software:
    if: inputs.build != 'fpga' || inputs.gbc_mcu_check
    name: Prepare cached GCC 13.5 toolchain
    needs: package-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-build-image
        with:
          target: software

  fpga-plan:
    if: inputs.build != 'software' && inputs.build != 'menus' && !(inputs.build == 'fpga' && contains(inputs.fpga_cores, 'gbc') && (inputs.gbc_rtl_only == 'all' || inputs.gbc_rtl_only == 'clock'))
    name: Check complete FPGA core coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.cores.outputs.matrix }}
      boards: ${{ steps.cores.outputs.boards }}
      packages: ${{ steps.cores.outputs.packages }}
    steps:
      - uses: actions/checkout@v6
      - name: Check build scripts and derive matrix from Makefile
        id: cores
        env:
          FPGA_CORES: ${{ inputs.build == 'fpga' && inputs.fpga_cores || '' }}
          PLACEMENT_SEEDS: ${{ inputs.build == 'fpga' && inputs.placement_seeds || '' }}
          RELEASE_TARGET: ${{ inputs.build == 'fpga' && 'all' || inputs.release_target || 'all' }}
        run: |
          bash -n .github/scripts/build.sh
          python3 .github/scripts/check-fpga-manifest.py matrix >> "$GITHUB_OUTPUT"

  prepare-fpga:
    # Explicit GBC experiments have one core per board; each core job already
    # restores/builds the same image. Avoid loading those images twice per run.
    if: inputs.build != 'fpga' || !contains(inputs.fpga_cores, 'gbc')
    name: Prepare cached ${{ matrix.board }} FPGA tools
    needs: fpga-plan
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.fpga-plan.outputs.boards) }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-build-image
        with:
          target: ${{ matrix.board }}

  fpga-core:
    if: ${{ !cancelled() && needs.fpga-plan.result == 'success' && (needs.prepare-fpga.result == 'success' || (inputs.build == 'fpga' && contains(inputs.fpga_cores, 'gbc'))) }}
    name: Build ${{ matrix.board }} core ${{ matrix.core }}${{ matrix.seed && format(' seed {0}', matrix.seed) || '' }}
    needs: [fpga-plan, prepare-fpga]
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.fpga-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6

      - name: Verify SMS clock-enable timing model
        if: matrix.board == 'mk3' && matrix.core == 'sms'
        run: |
          if ! command -v iverilog >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends iverilog
          fi
          iverilog -g2012 -Iverilog/sd2snes_sms -s tb_sms_ce \
            -o "$RUNNER_TEMP/sms-ce-test" verilog/sd2snes_sms/tb_sms_ce.v
          vvp "$RUNNER_TEMP/sms-ce-test"

      - uses: ./.github/actions/prepare-build-image
        with:
          target: ${{ matrix.board }}

      - name: Compile FPGA core
        env:
          BOARD: ${{ matrix.board }}
          CORE: ${{ matrix.core }}
          ISE_CTABLE: ${{ matrix.seed }}
        run: |
          set -o pipefail
          container_name="sd2snes-$BOARD"
          args=(--rm --name "$container_name" --user 0:0 --volume "$GITHUB_WORKSPACE:/work" --workdir /work)
          if [[ "$BOARD" == mk2 ]]; then
            # Host ID of the bundled ISE VM license (documented by upstream ise14).
            args+=(--mac-address 08:00:27:68:c9:35)
          fi
          bash .github/scripts/report-activity.sh "$container_name" &
          activity_pid=$!
          trap 'kill "$activity_pid" 2>/dev/null || true; wait "$activity_pid" 2>/dev/null || true' EXIT
          docker run "${args[@]}" --env ISE_CTABLE --env IGNORE_TIMING --entrypoint /bin/bash "sd2snes-ci:$BOARD" \
            .github/scripts/build.sh "$BOARD" "$CORE" 2>&1 | tee "$RUNNER_TEMP/fpga-build.log"

      - name: Export experimental MkII GBC synthesis for resource analysis
        if: always() && matrix.board == 'mk2' && matrix.core == 'gbc'
        run: |
          if [[ -s verilog/sd2snes_gbc/main.ngc ]]; then
            docker run --rm --user 0:0 --mac-address 08:00:27:68:c9:35 \
              --volume "$GITHUB_WORKSPACE:/work" --workdir /work/verilog/sd2snes_gbc \
              --entrypoint /bin/bash sd2snes-ci:mk2 \
              -c 'netgen -w -sim -ofmt verilog main.ngc main_synth.v'
          fi

      - name: Verify MkII byte-wide log against the installed Xilinx RAM model
        if: always() && matrix.board == 'mk2' && matrix.core == 'gbc'
        run: |
          set -euo pipefail
          if ! command -v iverilog >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends iverilog
          fi
          # Use the licensed tool image in place; do not redistribute its model.
          docker run --rm --entrypoint /bin/bash sd2snes-ci:mk2 \
            -c 'cat "$XILINX/verilog/src/unisims/RAMB16_S9_S36.v" "$XILINX/verilog/src/glbl.v"' \
            > "$RUNNER_TEMP/gbc-vendor-bram.v"
          iverilog -g2012 -s gbc_log_ram_tb -s glbl -o "$RUNNER_TEMP/gbc-vendor-bram.vvp" \
            tests/rtl/gbc_log_ram_tb.v verilog/sd2snes_gbc/mk2_memory.v \
            "$RUNNER_TEMP/gbc-vendor-bram.v"
          vvp "$RUNNER_TEMP/gbc-vendor-bram.vvp" | tee "$RUNNER_TEMP/gbc-log-vendor.log"

      - name: Collect FPGA image
        env:
          FPGA_EXT: ${{ matrix.extension }}
          CORE: ${{ matrix.core }}
        run: |
          file="verilog/sd2snes_$CORE/fpga_$CORE.$FPGA_EXT"
          test -s "$file"
          mkdir -p "$RUNNER_TEMP/fpga-artifact"
          cp --parents "$file" "$RUNNER_TEMP/fpga-artifact/"

      - uses: actions/upload-artifact@v4
        with:
          name: fpga-${{ matrix.board }}-core-${{ matrix.core }}${{ matrix.seed && format('-seed-{0}', matrix.seed) || '' }}
          path: ${{ runner.temp }}/fpga-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Upload core build and timing reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fpga-reports-${{ matrix.board }}-${{ matrix.core }}${{ matrix.seed && format('-seed-{0}', matrix.seed) || '' }}
          path: |
            ${{ runner.temp }}/fpga-build.log
            ${{ runner.temp }}/gbc-log-vendor.log
            verilog/*/*.syr
            verilog/*/*.par
            verilog/*/*.mrp
            verilog/*/*.psr
            verilog/*/*.bld
            verilog/*/*.bgn
            verilog/*/*.twr
            verilog/*/*.pcf
            verilog/*/*.xst
            verilog/*/*.prj
            verilog/sd2snes_gbc/main_synth.v
            verilog/*/*.unroutes
            verilog/*/output_files/*.rpt
            verilog/*/output_files/*.summary
          if-no-files-found: ignore
          retention-days: 14

  fpga:
    name: Collect complete ${{ matrix.board }} FPGA set
    needs: [fpga-plan, fpga-core]
    # A failure on one board must not discard a complete set for the other.
    if: ${{ !cancelled() && needs.fpga-plan.result == 'success' && inputs.build != 'fpga' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(needs.fpga-plan.outputs.boards) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: fpga-${{ matrix.board }}-core-*
          merge-multiple: true
          path: .
      - name: Verify complete board artifact
        env:
          BOARD: ${{ matrix.board }}
        run: python3 .github/scripts/check-fpga-manifest.py artifact "$BOARD"
      - name: Collect verified images
        env:
          EXT: ${{ matrix.board == 'mk2' && 'bit' || 'bi3' }}
        run: |
          mkdir -p "$RUNNER_TEMP/fpga-artifact"
          cp --parents verilog/*/fpga_*."$EXT" "$RUNNER_TEMP/fpga-artifact/"
      - uses: actions/upload-artifact@v4
        with:
          name: fpga-${{ matrix.board }}
          path: ${{ runner.temp }}/fpga-artifact/
          if-no-files-found: error
          retention-days: 14

  menus:
    if: inputs.build != 'fpga'
    name: Build SNES menus and onboarding
    needs: prepare-software
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-build-image
        with:
          target: software

      - name: Compile and validate menus
        run: |
          docker run --rm --user 0:0 --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            sd2snes-ci:software /bin/bash .github/scripts/build.sh menus

      - name: Provision the accepted SameBoy boot and license
        id: bootprovision
        run: |
          set -euo pipefail
          # The fresh player record is owned by the root menu-build container.
          # Provision in that same image/user context; forward no credentials.
          docker run --rm --user 0:0 --volume "$GITHUB_WORKSPACE:/work" \
            --volume "$RUNNER_TEMP:/reports" --workdir /work \
            --env GITHUB_ACTIONS=true --env PYTHONDONTWRITEBYTECODE=1 \
            --entrypoint python3 sd2snes-ci:software \
            .github/scripts/provision-sameboy-boot.py /reports/sameboy-provision
          test ! -e "$RUNNER_TEMP/sameboy-provision/provision-failure.json"
          python3 - "$RUNNER_TEMP/sameboy-provision/provision-result.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          if json.loads(Path(sys.argv[1]).read_text())['provisioned'] is not True:
              raise SystemExit('SameBoy provisioning did not complete')
          PY

      - name: Preserve SameBoy boot provisioning evidence
        if: always() && steps.bootprovision.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: sameboy-boot-provision-reports
          path: ${{ runner.temp }}/sameboy-provision/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: menus
          path: |
            snes/menu.bin
            snes/m3nu.bin
            snes/igmenu.bin
            snes/onboarding.bin
            snes/lang_*.bin
            snes/lang_*.fnt
          if-no-files-found: error
          retention-days: 14

      - name: Upload MkII Atari player and source records
        uses: actions/upload-artifact@v4
        with:
          name: atari-player
          path: |
            misc/atari_snes.bin
            snes/atari/build.log
            snes/atari/toolchain.log
            snes/atari/source-output.sha256
            snes/players/toolchains/cc65/
          if-no-files-found: error
          retention-days: 14

      - name: Upload MkIII players and source records
        uses: actions/upload-artifact@v4
        with:
          name: mk3-players
          path: |
            misc/nes_snes.bin
            misc/nes_snes.map
            misc/sms_snes.bin
            misc/gbc_snes.bin
            misc/a26_snes.bin
            misc/cgb_boot.bin
            misc/cgb_boot.LICENSE
            snes/players/build.log
            snes/players/toolchain.log
            snes/players/source-output.sha256
            snes/players/source-before.sha256
            snes/players/source-check.log
            snes/players/toolchains/
          if-no-files-found: error
          retention-days: 14

      - name: Upload menu failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: menu-failure-reports
          path: |
            snes/*.log
            snes/*.map
            snes/onboarding/*.log
            snes/atari/*.log
            snes/atari/source-output.sha256
            snes/players/*.log
            snes/players/source-output.sha256
            snes/players/source-before.sha256
            snes/players/toolchains/
            misc/nes_snes.map
          if-no-files-found: ignore
          retention-days: 14

  mini-mk2:
    if: (inputs.build == 'software' && inputs.mk2_run_id == '') || (inputs.build == 'fpga' && inputs.gbc_mcu_check && contains(inputs.fpga_cores, 'mk2:gbc'))
    name: Build MkII firmware bootstrap
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-build-image
        with:
          target: mk2
      - name: Compile only the mini FPGA image
        run: |
          set -euo pipefail
          case "$IGNORE_TIMING" in 0|1) ;; *) exit 2 ;; esac
          docker run --rm --user 0:0 --mac-address 08:00:27:68:c9:35 \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work --env IGNORE_TIMING --entrypoint /bin/bash \
            sd2snes-ci:mk2 -c 'make host-tools && make -C verilog/sd2snes_mini mk2 HOST=LINUX XILINX_ENV= IGNORE_TIMING="$IGNORE_TIMING"'
      - uses: actions/upload-artifact@v4
        with:
          name: fpga-mk2-mini
          path: verilog/sd2snes_mini/fpga_mini.bit
          if-no-files-found: error
          retention-days: 14

  gbc-mcu:
    if: inputs.build == 'fpga' && inputs.gbc_mcu_check && contains(inputs.fpga_cores, 'mk2:gbc')
    name: Check production and experimental MkII GBC firmware
    needs: [mini-mk2, prepare-software]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: fpga-mk2-mini
          path: verilog/sd2snes_mini/
      - uses: ./.github/actions/prepare-build-image
        with:
          target: software
      - name: Compile and verify both routing policies
        run: |
          docker run --rm --user 0:0 --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            sd2snes-ci:software /bin/bash -c \
            'bash .github/scripts/check-mcu.sh mk2 && bash .github/scripts/check-mcu.sh mk2-gbc'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gbc-mk2-mcu-checks
          path: |
            mk2*.log
            src/obj-mk2*/sd2snes*.elf
            src/obj-mk2*/*.map
            src/obj-mk2*/firmware.img
            src/obj-mk2*/ovl*.img
          if-no-files-found: error
          retention-days: 14

  mcu:
    needs: [mini-mk2, prepare-software]
    if: ${{ !cancelled() && inputs.build == 'software' && needs.prepare-software.result == 'success' && (inputs.mk2_run_id != '' || needs.mini-mk2.result == 'success') }}
    name: Check ${{ matrix.board }} firmware (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: mk2
            runner: ubuntu-24.04
          - board: mk3
            runner: ubuntu-24.04
          - board: mk3-stm32
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify FPGA artifact sources
        env:
          GH_TOKEN: ${{ github.token }}
          FPGA_RUN_ID: ${{ inputs.fpga_run_id }}
          MK2_RUN_ID: ${{ inputs.mk2_run_id }}
        run: |
          for run_id in "$FPGA_RUN_ID" ${MK2_RUN_ID:+"$MK2_RUN_ID"}; do
            [[ "$run_id" =~ ^[0-9]+$ ]]
            fpga_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .head_sha)
            git diff --exit-code "$fpga_sha" HEAD -- verilog/ utils/
          done

      - uses: actions/download-artifact@v4
        with:
          name: fpga-mk3
          run-id: ${{ inputs.fpga_run_id }}
          github-token: ${{ github.token }}
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: fpga-mk2-mini
          run-id: ${{ inputs.mk2_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: verilog/sd2snes_mini/

      - uses: ./.github/actions/prepare-build-image
        with:
          target: software

      - name: Compile firmware using cached release toolchain
        env:
          BOARD: ${{ matrix.board }}
        run: |
          docker run --rm --user 0:0 --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            sd2snes-ci:software /bin/bash .github/scripts/check-mcu.sh "$BOARD"

      - name: Upload MCU binaries and size reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcu-${{ matrix.board }}-${{ matrix.runner }}
          path: |
            stm32-build.log
            stm32-toolchain.log
            mk2-build.log
            mk3-build.log
            *-command-contract.log
            *-main-sections.log
            *-elf-sections.log
            *-nano-*.log
            *-selected-nano-members.log
            *-full-newlib-integrity.log
            src/obj-${{ matrix.board }}/*.map
            src/obj-${{ matrix.board }}/*.elf
            src/obj-${{ matrix.board }}/firmware.*
            src/obj-${{ matrix.board }}/*.bin
            src/obj-${{ matrix.board }}/ovl1.*
            src/obj-${{ matrix.board }}/ovl2.*
            src/obj-${{ matrix.board }}/ovl1/reach.txt
            src/obj-${{ matrix.board }}/ovl1/imports_all.txt
            src/obj-${{ matrix.board }}/fw.hdr
            src/obj-${{ matrix.board }}/bootzx0.h
            src/obj-${{ matrix.board }}/bootscr.img
          if-no-files-found: error
          retention-days: 14

  firmware:
    name: Build and package ${{ matrix.board }} firmware
    needs: [fpga, menus, fpga-plan]
    if: ${{ !cancelled() && needs.menus.result == 'success' && inputs.build != 'software' && inputs.build != 'menus' && inputs.build != 'fpga' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fpga-plan.outputs.packages) }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-build-image
        with:
          target: software

      - uses: actions/download-artifact@v4
        with:
          name: fpga-${{ matrix.fpga }}
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: menus
          path: snes/

      - name: Download MkII Atari player and source records
        if: matrix.board == 'mk2'
        uses: actions/download-artifact@v4
        with:
          name: atari-player
          path: .

      - name: Verify MkII player source and output identity
        if: matrix.board == 'mk2'
        run: sha256sum --strict --check snes/atari/source-output.sha256

      - name: Download MkIII players and source records
        if: matrix.board != 'mk2'
        uses: actions/download-artifact@v4
        with:
          name: mk3-players
          path: .

      - name: Verify MkIII player source and output identity
        if: matrix.board != 'mk2'
        run: sha256sum --strict --check snes/players/source-output.sha256

      - name: Verify board FPGA inputs
        env:
          FPGA_BOARD: ${{ matrix.fpga }}
        run: python3 .github/scripts/check-fpga-manifest.py artifact "$FPGA_BOARD"

      - name: Compile firmware and assemble board package
        env:
          BOARD: ${{ matrix.board }}
        run: |
          docker run --rm --user 0:0 --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            sd2snes-ci:software /bin/bash .github/scripts/build.sh firmware "$BOARD"

      - name: Record package identity and timing qualification
        env:
          BOARD: ${{ matrix.board }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import shutil
          board = os.environ['BOARD']
          policy = os.environ['IGNORE_TIMING']
          if board not in ('mk2', 'mk3', 'mk3-stm32') or policy not in ('0', '1'):
              raise SystemExit('Invalid board or timing policy')
          packages = list(Path('release').glob('v*/sd2snes_firmware_v*.zip'))
          if len(packages) != 1 or not packages[0].is_file() or packages[0].is_symlink():
              raise SystemExit('Expected exactly one regular board package')
          package = packages[0]
          body = package.read_bytes()
          if not body:
              raise SystemExit('Empty board package')
          receipt = {
              'schema': 'sd2snes-package-build-qualification-v1',
              'board': board, 'sourceCommit': os.environ['GITHUB_SHA'],
              'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'ignoreTiming': policy == '1', 'timingThresholdsRequired': policy == '0',
              'timingStatus': 'unverified-user-waiver' if policy == '1' else 'normal-build-gates-required',
              'nativeToolFailuresIgnored': False, 'buildAndPackageChecksPassed': True,
              'hardwareQualified': False,
              'package': {'name': package.name, 'bytes': len(body), 'sha256': hashlib.sha256(body).hexdigest()},
          }
          # Container-created release directories are root-owned. Copy the exact
          # package to a fresh runner-owned upload directory before writing its receipt.
          upload = Path(os.environ['RUNNER_TEMP']) / ('package-' + board)
          upload.mkdir()
          shutil.copyfile(package, upload / package.name)
          if (upload / package.name).read_bytes() != body:
              raise SystemExit('Upload copy differs from checked package')
          (upload / 'build-qualification.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(board + ': package built and checked at ' + os.environ['GITHUB_SHA'] + '.\n\n')
              summary.write(('Timing thresholds were explicitly ignored. This package is timing-unverified. '
                             if policy == '1' else 'Normal build timing gates were required. ')
                            + 'Native tool failures were not ignored. Hardware qualification was not performed.\n')
          PY

      - name: Upload board firmware package
        uses: actions/upload-artifact@v4
        with:
          name: sd2snes-firmware-${{ matrix.board }}-${{ github.sha }}${{ env.IGNORE_TIMING == '1' && '-timing-unverified' || '' }}
          path: ${{ runner.temp }}/package-${{ matrix.board }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload firmware maps, binaries and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-reports-${{ matrix.board }}
          path: |
            *-build.log
            stm32-toolchain.log
            *-command-contract.log
            *-main-sections.log
            *-elf-sections.log
            *-nano-*.log
            *-selected-nano-members.log
            *-full-newlib-integrity.log
            src/obj-${{ matrix.board }}/*.map
            src/obj-${{ matrix.board }}/*.elf
            src/obj-${{ matrix.board }}/firmware.*
            src/obj-${{ matrix.board }}/*.bin
            src/obj-${{ matrix.board }}/ovl1.*
            src/obj-${{ matrix.board }}/ovl2.*
            src/obj-${{ matrix.board }}/ovl1/reach.txt
            src/obj-${{ matrix.board }}/ovl1/imports_all.txt
            src/obj-${{ matrix.board }}/fw.hdr
            src/obj-${{ matrix.board }}/bootzx0.h
            src/obj-${{ matrix.board }}/bootscr.img
            snes/atari/*.log
            snes/atari/source-output.sha256
            snes/players/*.log
            snes/players/source-output.sha256
            snes/players/source-before.sha256
            snes/players/toolchains/
            misc/nes_snes.map
          if-no-files-found: ignore
          retention-days: 14
