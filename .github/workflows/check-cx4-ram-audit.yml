name: Check CX4 RAM-path diagnostic guard

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    name: Check actual PCF and reject missing or repeated diagnostic inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: '12766357718'
          run-id: '40573718743'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/cx4-report

      - name: Validate the guard against the retained production PCF and report
        run: |
          set -euo pipefail
          core="$RUNNER_TEMP/cx4-report/sd2snes/sd2snes/verilog/sd2snes_cx4"
          test -s "$core/main.pcf" && test -s "$core/main.twr"
          python3 .github/scripts/inspect-cx4-ram-paths.py prepare \
            "$core/main.pcf" "$RUNNER_TEMP/ram-diag.pcf"
          test -s "$RUNNER_TEMP/ram-diag.pcf"

          status=0
          python3 .github/scripts/inspect-cx4-ram-paths.py prepare \
            "$RUNNER_TEMP/ram-diag.pcf" "$RUNNER_TEMP/repeated.pcf" \
            > "$RUNNER_TEMP/repeated.log" 2>&1 || status=$?
          test "$status" -ne 0
          grep -F 'Diagnostic group or constraint already exists' "$RUNNER_TEMP/repeated.log"
          test ! -e "$RUNNER_TEMP/repeated.pcf"

          python3 - "$core/main.pcf" "$RUNNER_TEMP/missing.pcf" <<'PY'
          import sys
          from pathlib import Path
          source = Path(sys.argv[1]).read_text()
          expected = 'BEL "snes_dac/ci_0_0"'
          if source.count(expected) != 1:
              raise SystemExit("Expected one selected filter register")
          Path(sys.argv[2]).write_text(source.replace(expected, 'BEL "missing_filter_register"', 1))
          PY
          status=0
          python3 .github/scripts/inspect-cx4-ram-paths.py prepare \
            "$RUNNER_TEMP/missing.pcf" "$RUNNER_TEMP/invalid.pcf" \
            > "$RUNNER_TEMP/missing.log" 2>&1 || status=$?
          test "$status" -ne 0
          grep -F 'Expected filter register absent from CLK21' "$RUNNER_TEMP/missing.log"
          test ! -e "$RUNNER_TEMP/invalid.pcf"

          status=0
          python3 .github/scripts/inspect-cx4-ram-paths.py check \
            "$core/main.twr" "$core/main.twr" \
            > "$RUNNER_TEMP/wrong-report.log" 2>&1 || status=$?
          test "$status" -ne 0
          grep -F 'Missing TS_DIAG_RAM_TO_FILTER timing section' "$RUNNER_TEMP/wrong-report.log"
          printf 'Actual production PCF accepted; repeated, missing-target and wrong-report controls rejected.\n' >> "$GITHUB_STEP_SUMMARY"
