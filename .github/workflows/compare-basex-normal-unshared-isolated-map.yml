            printf 'Basis: Rejected 41243332616 exposes shared normal-address arithmetic and actual CTX operand-mux/carry paths. Exact source keeps all4935 normal-expression bytes in a helper with local resource_sharing=no. Prior S-RTC/patch logic and all failures remain preserved. BSX/DMA failures remain unresolved.\n'
            printf 'Diagnostic target: XST Speed and timing-driven MAP Area seed46 only. No PAR/TRACE execution or timing/native pass. Original timing requirements remain mandatory for a later separately reviewed trial.\n'
