                  steps = [{k: s[k] for k in ('number', 'name', 'conclusion')} for s in job['steps']]
                  if steps != expected['steps'] or any(s['status'] != 'completed' for s in job['steps']):
                      raise SystemExit('A complete prerequisite step inventory or outcome differs')
              artifacts = []
              for expected in check['artifacts']:
                  artifact = api('actions/artifacts/' + str(expected['id']))
                  if any(artifact.get(k) != v for k, v in expected.items()) or artifact['expired'] or (artifact['workflow_run']['id'], artifact['workflow_run']['head_sha']) != (check['run'], check['head']):
                      raise SystemExit('Reviewed prerequisite artifact identity differs')
                  artifacts.append(artifact)
              observed.append({'run': run, 'jobs': jobs, 'artifacts': artifacts})
          verified_reports = []
          for reference in references:
              raw = subprocess.check_output(['gh', 'api', 'repos/secprog/sd2snes/actions/artifacts/' + str(reference['id']) + '/zip'])
              if len(raw) != reference['bytes'] or hashlib.sha256(raw).hexdigest() != reference['sha256']:
                  raise SystemExit('Physical report ZIP digest differs before parsing')
              with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                  entries = archive.infolist()
                  if len(entries) != reference['entries'] or sum(i.file_size for i in entries) != reference['textBytes'] or any(i.file_size > 8_000_000 for i in entries):
                      raise SystemExit('Unexpected complete bounded physical report inventory')
                  names = set()
                  contents = {}
                  for item in entries:
                      p = PurePosixPath(item.filename)
                      mode = (item.external_attr >> 16) & 0o170000
                      if (p.is_absolute() or '..' in p.parts or ':' in item.filename or chr(92) in item.filename
                              or item.filename in names or item.is_dir() or item.flag_bits & 1
                              or mode not in (0, 0o100000)):
                          raise SystemExit('Unsafe, duplicate or nonregular physical report member')
                      names.add(item.filename)
                      data = archive.read(item)
                      data.decode('utf-8', errors='strict')
                      contents[item.filename] = data
                  for expected in reference['members']:
                      matched = [data for name, data in contents.items() if name == expected['name'] or name.endswith('/' + expected['name'])]
                      if len(matched) != 1 or len(matched[0]) != expected['bytes'] or hashlib.sha256(matched[0]).hexdigest() != expected['sha256']:
                          raise SystemExit('Complete independently reviewed physical report bytes differ')
              verified_reports.append(reference)
          print(json.dumps({'prerequisites': observed, 'complete_physical_reports': verified_reports,
                            'original_map_inspection_failure_preserved': True,
                            'partition_whole_run_failure_preserved': True,
                            'selected_partition_dsp_job_success': True,
