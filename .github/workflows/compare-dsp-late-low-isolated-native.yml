          python3 - "$RUNNER_TEMP/dsp-late-low-isolated-native-export/late-low-map.xdl" <<'PY' | tee "$RUNNER_TEMP/dsp-late-low-isolated-native-xdl.txt"
          import importlib.util
          import re
          import sys
          from pathlib import Path
          script = Path('.github/scripts/inspect-dsp-retained-map.py')
          spec = importlib.util.spec_from_file_location('xdl', script)
          xdl = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(xdl)
          xdl.fixture_checks()
          path = Path(sys.argv[1])
          if path.stat().st_size > 32_000_000:
              raise SystemExit('Full XDL exceeds bounded inspection input')
          instances, nets = xdl.parse(path.read_text())
          names = re.compile(r'stack_late_|stack_early_|stack_restore_prefix|restore_prefix_[0-4]|run_permit|restore_permit|late_(?:low|high)_[0-9]+')
          selected_instances = {name for name, text in instances.items() if names.search(text)}
          inspection_errors = []
          # Include actual named-net drivers even when packed under unrelated COMP names.
          for name, text in nets.items():
              if not names.search(name):
                  continue
              drivers = [pin for pin in xdl.net_pins(text) if pin[0] == 'outpin']
              if len(drivers) != 1 or drivers[0][1] not in instances:
                  inspection_errors.append(f'Named net {name} lacks an unambiguous retained driver')
                  continue
              selected_instances.add(drivers[0][1])
          bindings = []
          for target in xdl.TARGETS:
              try:
                  comp = xdl.bind(instances, target)
                  ce_name, ce = xdl.ce_for(nets, comp)
              except ValueError as error:
                  inspection_errors.append(f'Target {target}: {error}')
                  continue
              selected_instances.add(comp)
              drivers = [pin for pin in xdl.net_pins(ce) if pin[0] == 'outpin']
              if len(drivers) != 1 or drivers[0][1] not in instances:
                  inspection_errors.append(f'Target {target}: missing CE driver')
                  continue
              selected_instances.add(drivers[0][1])
              bindings.append(f'Actual mapped target {target}: COMP={comp}, CE={ce_name}, driver={drivers[0]}')
          selected_nets = {name for name, text in nets.items() if names.search(text) or any(
              comp in selected_instances for kind, comp, pin in xdl.net_pins(text))}
          records = [instances[name] for name in sorted(selected_instances)]
          records += [nets[name] for name in sorted(selected_nets)]
          if not selected_instances or len(selected_instances) > 400 or len(selected_nets) > 700 or sum(len(item) for item in records) > 3_000_000:
              raise SystemExit('Missing/excessive complete mapped evidence; inspection inconclusive')
          joined = '\n'.join(records)
          print(f'Parsed {len(instances)} instances/{len(nets)} nets; retained {len(selected_instances)} complete instances/{len(selected_nets)} complete nets.')
          print('\n'.join(bindings))
          print('Complete bounded raw statements follow. No name, fixture or pin-count result proves logical depth, sequential equivalence, timing or hardware behavior.')
          print(joined)
          required_instances = ['run_permit', 'restore_permit'] + [f'late_{lane}_{i}' for lane in ('low', 'high') for i in range(16)]
          required_instances += [f'early_select_{i}/{lane}_lane' for lane in ('low', 'high') for i in range(16)]
          required_instances += [f'restore_prefix_{i}' for i in range(5)]
          for name in required_instances:
              found = bool(re.search(re.escape(name) + r'(?:/|:|\s|")', joined))
              print(f'Logical source-instance name observation {name}: {"present" if found else "absent"}')
          required_nets = ['stack_late_run', 'stack_late_restore']
          required_nets += [f'stack_restore_prefix<{i}>' for i in range(5)]
          required_nets += [f'stack_early_{lane}<{i}>' for lane in ('push', 'low', 'high') for i in range(16)]
          required_nets += [f'stack_late_{lane}<{i}>' for lane in ('low', 'high') for i in range(16)]
          missing = []
          for name in required_nets:
              found = [net for net in nets if net == name or net.endswith('/' + name)]
              print(f'Logical net-name observation {name}: {found}')
              if len(found) != 1:
                  missing.append(name)
          if missing:
              inspection_errors.append(f'Net-name inspection inconclusive for {missing}; absent name is not absent logic')
