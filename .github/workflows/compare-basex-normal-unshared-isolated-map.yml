          git diff --cached --no-ext-diff --no-renames --binary > "$RUNNER_TEMP/basex-normal-unshared-isolated-map-post-staged.diff"
          git diff --no-ext-diff --no-renames --name-only | tee "$RUNNER_TEMP/basex-normal-unshared-isolated-map-post-paths.txt"
          for path in verilog/sd2snes_base/address.v verilog/sd2snes_base/main.v verilog/sd2snes_base/main.ucf verilog/sd2snes_basex/sd2snes_basex.xise; do
