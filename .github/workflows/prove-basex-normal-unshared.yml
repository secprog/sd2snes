# Diagnostic-only proof after the independently reviewed native failure 41243332616.
# Preserve its failure and all timing/input checks. Extract the exact normal mapper
# into a target-only resource_sharing=no helper; do not change arithmetic, state,
# cycles, final patch selection or the parent S-RTC candidate. No FPGA tool runs.
name: Prove basex unshared normal mapper from measured carry paths

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: prove-basex-normal-unshared-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prove:
    name: Prove full normal and final basex address boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FAMILY: basex
    steps:
      - uses: actions/checkout@v6

      - name: Record every tracked input before tools or preparation
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/basex-normal-unshared-proof"
          echo "REPORT=$REPORT" >> "$GITHUB_ENV"
          mkdir -p "$REPORT"
          git ls-files -z | xargs -0 sha256sum > "$REPORT/tracked-before.sha256"
          git ls-files --stage > "$REPORT/index-before.txt"
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git rev-parse HEAD:verilog)" = 01ce8b6b4509a5a72e0ad739e06bf19e548a2fc1
          test "$(git hash-object --no-filters .github/scripts/prepare-basex-normal-unshared-proof.py)" = b9e4c2bb6ce09edc27883477e58c325c2ee3e166
          test "$(git hash-object --no-filters .github/scripts/run-basex-normal-unshared-proof.sh)" = 83f0ae470274dddd6c36e5b1dfe465f0043c79fb
          test "$(git hash-object --no-filters .github/scripts/download-measured-slow-path-proof.py)" = 09a778b7c0d79f224e0ff9f66a50bf802d69a90c
          test "$(git hash-object --no-filters .github/scripts/prepare-slow-path-proofs.py)" = 393d3156292af684ca3db498cc43a20de77bbda4
          test "$(git hash-object --no-filters .github/scripts/run-basex-patch-merged-proof.sh)" = 49c8d3fbc673a317d3dfba85b85bed92688e0824
          test "$(git hash-object --no-filters .github/fixtures/slow-path-proof-data.json)" = 7833210e1b7523a28aefc6a680000889efe39391
          test "$(git hash-object --no-filters .github/fixtures/slow-path-parent-basex.v)" = 544beeb3ee6c6805197d332b08d10b8ee179f38a

      - name: Bind the exact measured native failure and complete report artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, stat, subprocess, urllib.request, zipfile
          from pathlib import Path, PurePosixPath
          run, job, head = 41243332616, 124661561800, '6ba9caaa1afef6e610d5ba42b338f154e24e1408'
          artifact, length = 13058434414, 1204595
          digest = '50417cc9fb8805ff190f51b34c03d041b8c223c068664dc367ca992a7bb9e1a9'
          root = 'https://api.github.com/repos/secprog/sd2snes/'
          def get(route):
              request = urllib.request.Request(root + route, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = response.read(8 * 1024 * 1024 + 1)
              assert len(data) <= 8 * 1024 * 1024
              return json.loads(data)
          metadata = get(f'actions/runs/{run}')
          jobs = get(f'actions/runs/{run}/jobs?per_page=100')
          assert metadata['head_sha'] == head and metadata['event'] == 'workflow_dispatch' and metadata['run_attempt'] == 1
          assert metadata['status'] == 'completed' and metadata['conclusion'] == 'failure'
          assert jobs['total_count'] == len(jobs['jobs']) == 1
          selected = jobs['jobs'][0]
          assert selected['id'] == job and selected['head_sha'] == head and selected['run_attempt'] == 1
          assert selected['status'] == 'completed' and selected['conclusion'] == 'failure'
          expected_steps = [(number, 'failure' if number in (21, 25, 29) else 'success') for number in list(range(1, 30)) + [58, 59]]
          assert all(step['status'] == 'completed' for step in selected['steps'])
          assert [(step['number'], step['conclusion']) for step in selected['steps']] == expected_steps
          artifact_metadata = get(f'actions/artifacts/{artifact}')
          assert artifact_metadata['workflow_run']['id'] == run and artifact_metadata['workflow_run']['head_sha'] == head
          assert artifact_metadata['name'] == 'basex-patch-final-isolated-native-seed-46-reports'
          assert not artifact_metadata['expired'] and artifact_metadata['size_in_bytes'] == length and artifact_metadata['digest'] == 'sha256:' + digest
          raw = subprocess.check_output(['gh', 'api', f'repos/secprog/sd2snes/actions/artifacts/{artifact}/zip'], timeout=60)
          assert len(raw) == length and hashlib.sha256(raw).hexdigest() == digest
          files = {}
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              entries = archive.infolist()
              assert len(entries) == 52 and sum(item.file_size for item in entries) == 9232296
              for item in entries:
                  name = item.filename
                  assert not item.is_dir() and not PurePosixPath(name).is_absolute() and '..' not in PurePosixPath(name).parts
                  assert '\\' not in name and ':' not in name and name not in files and not (item.flag_bits & 1)
                  mode = item.external_attr >> 16
                  assert stat.S_ISREG(mode) and item.file_size <= 4 * 1024 * 1024
                  content = archive.read(item)
                  content.decode('utf-8', errors='strict')
                  files[name] = content
          pins = {
              'main.syr': (217929, '46fe095372aa6161c9aba998dc3a7885cd6dcefa51c98a582dc08d8054a1b4a7'),
              'main_map.mrp': (941263, 'e293d486c00d6f1ec7d1407e5b6b70f93fcceaebf9c08b8e48e0aa5dcf9d6d15'),
              'main.par': (9339, 'c9bfc7588279af59043cb7b579cf2af5955f03a25658c38f04d1d137a75e0e3d'),
              'main.twr': (1873945, '80009ddfaed5f0fbb85dc9955a8c90321a027a2901127babc4af627f701d7be8'),
          }
          evidence = {}
          for name, (size, expected) in pins.items():
              content = files['sd2snes/sd2snes/verilog/sd2snes_basex/' + name]
              assert len(content) == size and hashlib.sha256(content).hexdigest() == expected
              Path(os.environ['REPORT'], 'native-' + name).write_bytes(content)
              evidence[name] = content.decode()
          assert 'Timing Score: 466358 (Setup: 466358, Hold: 0, Component Switching Limit: 0)' in evidence['main.par']
          assert 'All signals are completely routed.' in evidence['main.par']
          assert 'Timing errors: 754  Score: 466358  (Setup/Max: 466358, Hold: 0)' in evidence['main.twr']
          assert 'Source:               snes_mcu_cmd/SAVERAM_MASK_B_1 (FF)' in evidence['main.twr']
          assert 'Destination:          CTX_ROM_ADDRr_21_BRB0 (FF)' in evidence['main.twr']
          assert 'Found 24-bit adder for signal <patch_normal_addr$share0000> created at line 280.' in evidence['main.syr']
          inventory = {name: {'bytes': len(content), 'sha256': hashlib.sha256(content).hexdigest()} for name, content in sorted(files.items())}
          result = {'run': metadata, 'jobs': jobs, 'artifact': artifact_metadata, 'zipSha256': digest, 'fullTextInventory': inventory,
                    'reviewedNativeFailure': {'parSetup': 466358, 'traceSetup': 754, 'traceHold': 0, 'rejected': True},
                    'independentReviewSha256': '0bb7c66e9020d3498fff7703ef690e655e5dcd84fd7045e31cc3757360001a33'}
          Path(os.environ['REPORT'], 'measured-native-failure-provenance.json').write_text(json.dumps(result, indent=2))
          print('Exact completed native failure and all step outcomes retained; full 52-text ZIP verified before source preparation')
          PY

      - name: Verify exact previously reviewed parent source proof and full artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, stat, subprocess, urllib.request, zipfile
          from pathlib import Path, PurePosixPath
          records = {
              'dsp': (41132173203, 124325549576, '6b81898fba0273cfd944f03e1e75bc35ebe17a89', 13013851609, 4016659, 'dc4c16ea44b4c2769a70a81c9a09856e592e50bf6e81efc531d3a15d6c24ec4c', 'candidate-upd77c25.v'),
              'basex': (41133271280, 124329361168, '1dacdf3682392b9ca64c55a4e013c6cf417cf23a', 13013783280, 506078, '4528ce5f55f6d93823ac7099e724247fefd6fdacd4079bc43dd06800640868db', 'candidate-address.v'),
          }
          family = os.environ['FAMILY']
          run, job, head, artifact, length, digest, member = records[family]
          root = 'https://api.github.com/repos/secprog/sd2snes/'
          def get(route, binary=False):
              if binary:
                  # Use the established CLI artifact redirect handling. urllib's
                  # forwarded API authorization caused a storage HTTP401 here.
                  data = subprocess.check_output(['gh', 'api', 'repos/secprog/sd2snes/' + route], timeout=60)
                  assert len(data) <= 8 * 1024 * 1024
                  return data
              request = urllib.request.Request(root + route, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  data = response.read(8 * 1024 * 1024 + 1)
              assert len(data) <= 8 * 1024 * 1024
              return data if binary else json.loads(data)
          metadata = get(f'actions/runs/{run}')
          jobs = get(f'actions/runs/{run}/jobs?per_page=100')
          assert metadata['head_sha'] == head and metadata['status'] == 'completed' and metadata['conclusion'] == 'success'
          assert metadata['event'] == 'workflow_dispatch' and metadata['run_attempt'] == 1
          assert jobs['total_count'] == len(jobs['jobs']) == 1
          selected = jobs['jobs'][0]
          assert selected['id'] == job and selected['status'] == 'completed' and selected['conclusion'] == 'success'
          assert all(step['conclusion'] == 'success' for step in selected['steps'])
          artifact_metadata = get(f'actions/artifacts/{artifact}')
          assert artifact_metadata['workflow_run']['id'] == run and artifact_metadata['workflow_run']['head_sha'] == head
          assert not artifact_metadata['expired'] and artifact_metadata['size_in_bytes'] == length and artifact_metadata['digest'] == 'sha256:' + digest
          raw = get(f'actions/artifacts/{artifact}/zip', True)
          assert len(raw) == length and hashlib.sha256(raw).hexdigest() == digest
          files = {}
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              items = archive.infolist()
              assert 1 <= len(items) <= 500 and sum(item.file_size for item in items) <= 96 * 1024 * 1024
              for item in items:
                  name = item.filename
                  assert not item.is_dir() and not PurePosixPath(name).is_absolute() and '..' not in PurePosixPath(name).parts
                  assert '\\' not in name and ':' not in name and name not in files and not (item.flag_bits & 1)
                  assert not stat.S_ISLNK(item.external_attr >> 16) and item.file_size <= 16 * 1024 * 1024
                  content = archive.read(item)
                  content.decode('utf-8', errors='strict')
                  files[name] = content
          assert files[member] == Path(f'.github/fixtures/slow-path-parent-{family}.v').read_bytes()
          exact_pins = {
              'candidate-address.v': (18503, '4f373b8ae27e58bc97d79ad2a6c67b1072f3f247058196f5b16ff6fd9fa46f22'),
              'gold.v': (236, 'f3094be8792d6b63d73907011f1fd13a980b22b592426f5272dcdca9c9ea028c'),
              'gate.v': (654, 'e58d13369e76f7beae2c7c58f4bfd554404184cb25e3bfa97c058c5a825e4830'),
              'gate/miter-binary.json': (18647, '055f1e3e151ccac400679f095b301d7d4c5bbdffbf8e43912872edd354c01d53'),
              'gate/miter-xstate.json': (18647, '055f1e3e151ccac400679f095b301d7d4c5bbdffbf8e43912872edd354c01d53'),
          }
          for filename, (size, expected) in exact_pins.items():
              assert len(files[filename]) == size and hashlib.sha256(files[filename]).hexdigest() == expected
          verified = []
          for line in files['SHA256SUMS'].decode().splitlines():
              expected, filename = line.split('  ', 1)
              assert filename not in verified and hashlib.sha256(files[filename]).hexdigest() == expected
              verified.append(filename)
          assert len(verified) == (52 if family == 'dsp' else 39)
          result = {'run': metadata, 'jobs': jobs, 'artifact': artifact_metadata, 'zipSha256': digest, 'allManifestEntries': verified, 'exactParent': member, 'entries': len(files)}
          Path(os.environ['REPORT'], 'parent-proof-provenance.json').write_text(json.dumps(result, indent=2))
          print(f'{family}: exact successful parent proof, full ZIP digest, all {len(verified)} source manifest entries and candidate bytes verified')
          PY

      - name: Require the full reviewed patch proof and all exact source and witness boundaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/download-measured-slow-path-proof.py basex "$RUNNER_TEMP/basex-normal-unshared-parent-proof" "$REPORT/patch-parent-proof-provenance.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          prior = Path(os.environ['RUNNER_TEMP']) / 'basex-normal-unshared-parent-proof'
          pins = {
              'candidate.v': (37359, '0bffc02d472fd317321ad90e2f3dd685951a77e7b814033408d078a15f032be4'),
              'gold.v': (5613, '2df96ae22cfc84c7c74066dfed6055417a2ae91b830967389598405c7954b1c9'),
              'gate.v': (9311, '48925efc5ba8879eb44431e80a90fe5909cb66adcd538533bb57bb655ad44458'),
              'gate/miter-binary.json': (147915, '7e8fb3b60bd80c3a520e0ad6d4a0f5f40a0e41bdd560768a73be6ea1592195b8'),
              'gate/miter-xstate.json': (147915, '7e8fb3b60bd80c3a520e0ad6d4a0f5f40a0e41bdd560768a73be6ea1592195b8'),
              'gate/miter-binary-before-merge.json': (246344, '3a67c5f08fe07278f901bcc14f2c30842a2de3bfa5d8de3189e868ee13b69c99'),
              'gate/miter-xstate-before-merge.json': (246344, '3a67c5f08fe07278f901bcc14f2c30842a2de3bfa5d8de3189e868ee13b69c99'),
          }
          for name, (length, digest) in pins.items():
              content = (prior / name).read_bytes()
              assert len(content) == length and hashlib.sha256(content).hexdigest() == digest
          variants = json.loads((prior / 'variants.json').read_text())
          assert variants == ['gold', 'gate', 'bad-patch', 'bad-direct-bit', 'bad-mapper-priority', 'bad-saveram', 'bad-sufami', 'bad-bsx-page', 'bad-menu-bank', 'bad-x-mapper', 'bad-x-mask']
          for mode in ('binary', 'xstate'):
              assert 'SAT proof finished - no model found: SUCCESS!' in (prior / 'gate' / f'proof-{mode}.log').read_text()
          for variant in variants[2:]:
              mode = 'xstate' if variant.startswith('bad-x-') else 'binary'
              assert 'SAT proof finished - model found: FAIL!' in (prior / variant / f'proof-{mode}.log').read_text()
              assert (prior / variant / f'counterexample-{mode}.json').stat().st_size > 0
              if mode == 'xstate':
                  assert 'SAT proof finished - no model found: SUCCESS!' in (prior / variant / 'proof-binary.log').read_text()
          assert 'Yosys 0.33 (git sha1 2584903a060)' in (prior / 'tool-version.txt').read_text()
          assert 'Icarus Verilog version 12.0' in (prior / 'iverilog-version.txt').read_text()
          assert (prior / 'original.v').read_bytes() == Path('.github/fixtures/slow-path-parent-basex.v').read_bytes()
          assert (prior / 'proof-data.json').read_bytes() == Path('.github/fixtures/slow-path-proof-data.json').read_bytes()
          record = {'exactReviewedPins': pins, 'actualVariants': variants,
                    'reviewedParentSrtcSha256': '0c17e5b6d23fb18a6f45b1f424821833b6318ef9622289344b178c9fb9496c6a',
                    'reviewedPatchProofSha256': 'b2715ae97699e7ccf592f8799f780f65bade15bb0c6ce1959798d4408829a73a'}
          Path(os.environ['REPORT'], 'complete-parent-proof-chain.json').write_text(json.dumps(record, indent=2))
          print('Both complete prior proofs, exact actual source/pre/post miters and all real negative witnesses bound before the new proof')
          PY

      - name: Install and identify hosted proof tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys iverilog
          yosys -V | tee "$REPORT/tool-version.txt"
          grep -F 'Yosys 0.33 (git sha1 2584903a060)' "$REPORT/tool-version.txt"
          iverilog -V > "$REPORT/iverilog-version.txt" 2>&1
          grep -F 'Icarus Verilog version 12.0' "$REPORT/iverilog-version.txt"

      - name: Prepare exact candidate and source-bound models
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare-basex-normal-unshared-proof.py "$RUNNER_TEMP/basex-normal-unshared-parent-proof" .github/fixtures "$REPORT"

      - name: Prove every component output and require actual negative witnesses
        run: |
          set -euo pipefail
          bash .github/scripts/run-basex-normal-unshared-proof.sh "$FAMILY" "$REPORT"
          cat "$REPORT/verified.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Require every tracked SHA and index entry and empty staged differences
        if: always()
        run: |
          set -euo pipefail
          test -s "$REPORT/tracked-before.sha256"
          test -s "$REPORT/index-before.txt"
          git ls-files -z | xargs -0 sha256sum > "$REPORT/tracked-after.sha256"
          git ls-files --stage > "$REPORT/index-after.txt"
          cmp "$REPORT/tracked-before.sha256" "$REPORT/tracked-after.sha256"
          cmp "$REPORT/index-before.txt" "$REPORT/index-after.txt"
          sha256sum --check "$REPORT/tracked-before.sha256" | tee "$REPORT/tracked-final-check.txt"
          git diff --exit-code
          git diff --cached --exit-code

      - name: Retain complete source, models, state views, miters and actual witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basex-normal-unshared-proof
          path: ${{ runner.temp }}/basex-normal-unshared-proof/
          if-no-files-found: error
          retention-days: 14
