# Recover complete physical records from the two already-created mapped NCDs.
# No FPGA regeneration, synthesis, MAP, PAR, TRACE, bitgen or timing waiver.
name: Inspect retained successor MAP partitions

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: successor-retained-map-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: basex
            collector: inspect-basex-unshared-retained-partitions.py
            collector_blob: df7c6789035e18590c01d1163cda64467f39be38
            xdl_name: srtc-late-bits-map.xdl
            ncd_sha256: d7491c9fa35596d64c3ab6d6820b3c36f04769ae469467524cc17258f453dc5f
            xdl_sha256: fd08df56d4253b729eb00f9cc0fcfb5b3e98a69a9812952f4c0feb0f46da839b
          - family: dsp
            collector: inspect-dsp-parallel-retained-partitions.py
            collector_blob: 13f0f9531ecd4e68637ce20ffc78865e6ae66eb2
            xdl_name: late-low-map.xdl
            ncd_sha256: 4f7b507e401b716cc16da5c89f2c7bfe18bdb6b33bc1dd76db36e43f7b961113
            xdl_sha256: 61b8d5bc20c9ce7901795981902af4b82a6047a029b9c367ce5ae3f26b947844
    name: Read-only retained ${{ matrix.family }} MAP partitions
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Locate isolated evidence directories on the hosted runner
        run: |
          set -euo pipefail
          {
            printf 'EVIDENCE_ROOT=%s/successor-map-%s\n' "$RUNNER_TEMP" '${{ matrix.family }}'
            printf 'CHECK_PREFIX=%s/successor-retained-%s\n' "$RUNNER_TEMP" '${{ matrix.family }}'
            printf 'EXPORT_ROOT=%s/successor-xdl-%s\n' "$RUNNER_TEMP" '${{ matrix.family }}'
            printf 'OUTPUT_ROOT=%s/successor-partitions-%s\n' "$RUNNER_TEMP" '${{ matrix.family }}'
          } >> "$GITHUB_ENV"

      - name: Pin all diagnostic sources and inventory every tracked input
        id: inventory
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 5ffc853511cb8f6808dd0609a94bded32665aff5
          test "$(git rev-parse HEAD:verilog)" = 01ce8b6b4509a5a72e0ad739e06bf19e548a2fc1
          test "$(git hash-object --no-filters .github/fixtures/successor-retained-map-data.json)" = 636410f9f5d073d6b8d19a04b2c6f71b34e4ed49
          test "$(git hash-object --no-filters .github/scripts/download-successor-retained-map.py)" = b26865903a6a533a7e1e971f50e93e1cb943d10e
          test "$(git hash-object --no-filters .github/scripts/${{ matrix.collector }})" = '${{ matrix.collector_blob }}'
          test "$(git hash-object --no-filters .github/scripts/inspect-dsp-retained-map.py)" = 2b3b867372717b5729e26cb4880cb1af0b01a965
          test "$(git hash-object --no-filters .github/scripts/inspect-measured-slow-path-map.py)" = 44aa3f6e7e0a708168dbb8cd8189af94ddf4f94d
          test "$(git hash-object --no-filters .github/scripts/inspect-measured-map-partitions.py)" = c3b5e255a911e76040be585abca5e7d2a5224f31
          test "$(git hash-object --no-filters .github/scripts/inspect-dsp-parallel-stack-map.py)" = 4d766f0cf16948051b62bd93ee6a5f2238e61a98
          test "$(git hash-object --no-filters .github/scripts/inspect-basex-normal-unshared-map.py)" = 2ac4e2c16c86b66271bd3a5209ca0244ff42f56b
          test "$(git hash-object --no-filters .github/actions/prepare-build-image/action.yml)" = ac2a66fc24d4a15658b666cdc5f5db7964df4c3b
          git diff --exit-code
          git diff --cached --exit-code
          git ls-files -z | xargs -0 sha256sum > "$CHECK_PREFIX-before.sha256"
          git ls-files -s > "$CHECK_PREFIX-before-index.txt"
          printf 'Checkout: %s\nProduction Verilog tree: %s\nRetained MAP head: %s\n' "$GITHUB_SHA" "$(git rev-parse HEAD:verilog)" "$(git rev-parse HEAD^)" | tee "$CHECK_PREFIX-identity.txt"

      - name: Validate hosted parser and partition controls before reading retained design
        run: |
          set -euo pipefail
          python3 .github/scripts/${{ matrix.collector }} --self-test

      - name: Bind exact failed runs, all outcomes and digest-verified retained evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/download-successor-retained-map.py '${{ matrix.family }}' "$EVIDENCE_ROOT"
          cp "$EVIDENCE_ROOT/download-provenance.json" "$CHECK_PREFIX-download-provenance.json"
          find "$EVIDENCE_ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$CHECK_PREFIX-evidence-before.sha256"
          printf '%s  %s\n' '${{ matrix.ncd_sha256 }}' "$EVIDENCE_ROOT/input/main_map.ncd" | sha256sum --check

      - uses: ./.github/actions/prepare-build-image
        with:
          target: mk2

      - name: Convert the exact retained NCD using read-only isolated XDL
        id: conversion
        run: |
          set -euo pipefail
          image_id=$(docker image inspect sd2snes-ci:mk2 --format '{{.Id}}')
          printf 'ISE image ID: %s\n' "$image_id" | tee -a "$CHECK_PREFIX-identity.txt"
          test "$image_id" = sha256:5e3bbb00649997abca8843b1d82d8529eda99a0f2868d37ad9777e0ad5fd50e8
          mkdir "$EXPORT_ROOT"
          docker run --rm --read-only --network none --user 0:0 \
            --tmpfs /tmp:rw,exec,size=256m --mac-address 08:00:27:68:c9:35 \
            --volume "$EVIDENCE_ROOT/input/main_map.ncd:/input/main_map.ncd:ro" \
            --volume "$EXPORT_ROOT:/output" --workdir /tmp \
            --entrypoint /bin/bash sd2snes-ci:mk2 -c \
            'set -euo pipefail; xdl -ncd2xdl -nopips /input/main_map.ncd /output/${{ matrix.xdl_name }}' \
            2>&1 | tee "$CHECK_PREFIX-xdl-conversion.txt"
          printf '%s  %s\n' '${{ matrix.ncd_sha256 }}' "$EVIDENCE_ROOT/input/main_map.ncd" | sha256sum --check
          printf '%s  %s\n' '${{ matrix.xdl_sha256 }}' "$EXPORT_ROOT/${{ matrix.xdl_name }}" | sha256sum --check
          sha256sum "$EXPORT_ROOT/${{ matrix.xdl_name }}" > "$CHECK_PREFIX-xdl.sha256"

      - name: Retain complete bounded partitions and preserve every original failure
        run: |
          set -euo pipefail
          python3 -u .github/scripts/${{ matrix.collector }} "$EXPORT_ROOT/${{ matrix.xdl_name }}" "$EVIDENCE_ROOT/reports" "$OUTPUT_ROOT" \
            2>&1 | tee "$CHECK_PREFIX-inspection-console.txt"
          sha256sum --check "$CHECK_PREFIX-xdl.sha256"

      - name: Require all tracked bytes, indexes and retained inputs unchanged
        if: always() && steps.inventory.outcome == 'success'
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          git ls-files -z | xargs -0 sha256sum > "$CHECK_PREFIX-after.sha256"
          cmp "$CHECK_PREFIX-before.sha256" "$CHECK_PREFIX-after.sha256"
          sha256sum --check "$CHECK_PREFIX-before.sha256" > "$CHECK_PREFIX-final-manifest-check.txt"
          git ls-files -s > "$CHECK_PREFIX-after-index.txt"
          cmp "$CHECK_PREFIX-before-index.txt" "$CHECK_PREFIX-after-index.txt"
          if [[ '${{ steps.evidence.outcome }}' == success ]]; then
            find "$EVIDENCE_ROOT" -type f -print0 | sort -z | xargs -0 sha256sum > "$CHECK_PREFIX-evidence-after.sha256"
            cmp "$CHECK_PREFIX-evidence-before.sha256" "$CHECK_PREFIX-evidence-after.sha256"
            sha256sum --check "$CHECK_PREFIX-evidence-before.sha256" > "$CHECK_PREFIX-evidence-final-check.txt"
            printf '%s  %s\n' '${{ matrix.ncd_sha256 }}' "$EVIDENCE_ROOT/input/main_map.ncd" | sha256sum --check
          fi
          if [[ '${{ steps.conversion.outcome }}' == success ]]; then
            sha256sum --check "$CHECK_PREFIX-xdl.sha256"
          fi

      - name: Retain small read-only reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: successor-retained-map-${{ matrix.family }}-reports
          path: |
            ${{ runner.temp }}/successor-retained-${{ matrix.family }}-*.txt
            ${{ runner.temp }}/successor-retained-${{ matrix.family }}-*.json
            ${{ runner.temp }}/successor-retained-${{ matrix.family }}-*.sha256
            ${{ runner.temp }}/successor-partitions-${{ matrix.family }}/**/*.txt
            ${{ runner.temp }}/successor-partitions-${{ matrix.family }}/**/*.json
          if-no-files-found: error
          retention-days: 14
