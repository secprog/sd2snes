# First mapping-only inspection of the exact proved parallel-stack successor.
# Preserve all prior proofs/failures/input gates; no PAR, TRACE or timing pass.
name: Inspect proved DSPx parallel stack mapping with isolated CoreGen

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: dsp-parallel-stack-isolated-map-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  mapping:
    name: DSPx parallel stack MAP only, original seed 68
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6

      - name: Require the independently reviewed CoreGen isolation validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/secprog/sd2snes/actions/runs/40960956589 --jq .conclusion)" = success
          test "$(gh api repos/secprog/sd2snes/actions/runs/40960956589 --jq .head_sha)" = d9e6754161a504f00ad28ae7005bb4369105c313

      - name: Require exact independently reviewed mapping, physical inspection and command controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object --no-filters .github/scripts/check-native-route-commands.py)" = e2312dc65d7e6959983efd5829bf171250771940
          test "$(git hash-object --no-filters .github/workflows/check-native-route-commands.yml)" = 75d8c410a87c6a8fb48bf42a18b713255fed9b62
          test "$(git hash-object --no-filters .github/scripts/inspect-late-decoder-stable.py)" = 25fd5038678f0edff556fb7b12d7b005ca6691ab
          test "$(git hash-object --no-filters .github/scripts/check-late-decoder-report-order.py)" = 0fc310b33719151044e4dc3876aad9c8393ac0f7
          test "$(git hash-object --no-filters .github/workflows/check-late-decoder-report-order.yml)" = b57d23e32ccfaf7f52dc8afd30ffff7ec574b7c2
          test "$(git hash-object --no-filters .github/workflows/inspect-dsp-late-low-isolated-map.yml)" = e5fd6e2911f38d3041c112355fc75728f83787b7
          python3 - <<'PY' | tee "$RUNNER_TEMP/dsp-parallel-stack-isolated-map-prerequisites.json"
          import hashlib, io, json, os, subprocess, zipfile
          from pathlib import PurePosixPath
          checks = json.loads('''[{"run":41132749432,"head":"c21eb9e893b3ca52bc6578d8b92febd232f07247","conclusion":"success","total_jobs":1,"jobs":[124327605166],"artifacts":[{"id":13014955819,"name":"dsp-late-low-isolated-map-only-reports","size_in_bytes":546348,"digest":"sha256:323902f139322dc51413acbb724ffc5c3b4c088a85f93b7c5b581514f211f7f0"}]},{"run":41137301644,"head":"a73668fa4b3511294971db2746f08849625fc639","conclusion":"success","total_jobs":1,"jobs":[124342807708],"artifacts":[{"id":13016923326,"name":"native-route-command-guard-reports","size_in_bytes":386596,"digest":"sha256:19fe2121239d89ef26d3526cb622084ff9874293afeb88c1b4f5f6cf07f890b3"}]},{"run":41136938577,"head":"e4a810b648d9bf269d609ae085f8130d38359abd","conclusion":"success","total_jobs":3,"jobs":[124341594600,124341594999,124341595190],"artifacts":[{"id":13017258331,"name":"late-decoder-predecessors-dsp-drivers-reports","size_in_bytes":351028,"digest":"sha256:45250e6005d6d8b5dd2f1472b85d7ce833d3ba0a0cce3ebf1dd7a277885c385c"},{"id":13016558555,"name":"late-decoder-predecessors-dsp-ff-low-reports","size_in_bytes":364416,"digest":"sha256:0a4d51f420de7c6aa5f41a47d0a0eae68c4e6764d8037fc70753a6df43af406c"},{"id":13016998344,"name":"late-decoder-predecessors-dsp-ff-high-reports","size_in_bytes":359511,"digest":"sha256:286c260ffbb5020ef8bb3312cd59c9385a48be3400b8b49c9a5bbe5131ae2190"}]},{"run":41231420886,"head":"07bdf25d5b609b291439c652cf03c8e47677ccfa","conclusion":"success","total_jobs":1,"jobs":[124626252744],"artifacts":[{"id":13053965982,"name":"stable-late-decoder-report-order-reports","size_in_bytes":1717375,"digest":"sha256:c35142e5f6718a75d0ddad4bdf6ecbb989b5e7951b64a7a9fb93edf032e89b53"}]}]''')
          observed = []
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/secprog/sd2snes/' + path]))
          for check in checks:
              run = api('actions/runs/' + str(check['run']))
              jobs = api('actions/runs/' + str(check['run']) + '/jobs?per_page=100')
              if (run['id'], run['head_sha'], run['status'], run['conclusion']) != (check['run'], check['head'], 'completed', check['conclusion']):
                  raise SystemExit('Prerequisite run identity/outcome differs')
              if jobs['total_count'] != check['total_jobs'] or len(jobs['jobs']) != check['total_jobs']:
                  raise SystemExit('Incomplete prerequisite job inventory')
              for job_id in check['jobs']:
                  found = [job for job in jobs['jobs'] if job['id'] == job_id]
                  if len(found) != 1 or found[0]['head_sha'] != check['head'] or found[0]['conclusion'] != 'success' or any(step['conclusion'] != 'success' for step in found[0]['steps']):
                      raise SystemExit('Required prerequisite job/step failed, missing or skipped')
              for expected in check['artifacts']:
                  artifact = api('actions/artifacts/' + str(expected['id']))
                  if any(artifact.get(k) != v for k, v in expected.items()) or artifact['expired'] or artifact['workflow_run']['id'] != check['run'] or artifact['workflow_run']['head_sha'] != check['head']:
                      raise SystemExit('Reviewed prerequisite artifact identity differs')
              observed.append({'run': run, 'jobs': jobs})
          raw = subprocess.check_output(['gh', 'api', 'repos/secprog/sd2snes/actions/artifacts/13016923326/zip'])
          if len(raw) != 386596 or hashlib.sha256(raw).hexdigest() != '19fe2121239d89ef26d3526cb622084ff9874293afeb88c1b4f5f6cf07f890b3':
              raise SystemExit('Command-control report ZIP digest differs')
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              entries = archive.infolist()
              if len(entries) > 30 or sum(i.file_size for i in entries) > 4_000_000 or any(i.file_size > 2_000_000 for i in entries):
                  raise SystemExit('Excessive command-control report inventory')
              for item in entries:
                  p = PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts or ':' in item.filename or chr(92) in item.filename:
                      raise SystemExit('Unsafe command-control report path')
              files = [i for i in entries if i.filename == 'controls.json']
              if len(files) != 1:
                  raise SystemExit('Missing/duplicate command controls')
              controls = json.loads(archive.read(files[0]).decode('utf-8', errors='strict'))
          expected_controls = ['duplicate-par', 'duplicate-trace', 'missing-par', 'missing-trace', 'unexpected-unwrapped-command', 'duplicate-console-header', 'missing-console-header', 'wrong-par-arguments', 'wrong-trace-arguments', 'forbidden-xst', 'quoted-extra-tool-command', 'extra-inline-handler', 'unrecognized-inline-tool', 'forbidden-tool-without-arguments', 'wrong-selected-seed', 'truncated-file-header']
