name: Compare basex write-gate timing

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: basex-write-gates-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prove:
    name: Prove cheat writes; reject data, priority and reset mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Prepare pinned component and native diagnostic sources
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare-basex-write-gate-experiment.py \
            verilog/sd2snes_base/cheat.v "$RUNNER_TEMP/write-proof"

      - name: Install formal tools on the GitHub runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys
          yosys -V | tee "$RUNNER_TEMP/write-proof/tool-version.txt"

      - name: Prove every cheat-array transition
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/write-proof"
          sha256sum --check SHA256SUMS
          for variant in gold gate bad-data bad-priority bad-reset; do
            mkdir "$variant"
            cp "$variant.v" "$variant/model.v"
            (
              cd "$variant"
              # Flatten the behavioral LUT helper, retaining every state bit
              # and invalid index. Do not invent reset/initial-state values.
              yosys -l preparation.log -p 'read_verilog -sv -formal model.v; hierarchy -check -top cheat_programming_model; flatten; proc; check -assert; memory -nowiden -memx; dffunmap; opt_expr -keepdc; setundef -undriven -undef; opt_clean; check -assert; write_json state.json'
              model_name=gate
              if [[ "$variant" == gold ]]; then model_name=gold; fi
              python3 "$GITHUB_WORKSPACE/.github/scripts/cut-basex-write-state.py" \
                state.json transition.json "$model_name" | tee state-audit.log
            )
          done
          for variant in gate bad-data bad-priority bad-reset; do
            cat > "$variant/prove.ys" <<'YOSYS'
          read_json ../gold/transition.json
          read_json transition.json
          miter -equiv -make_assert -make_outputs -make_outcmp -flatten gold gate miter
          hierarchy -check -top miter
          opt_clean
          check -assert
          sat -verify -enable_undef -set-def-inputs -prove-asserts -show-inputs -show-outputs -dump_json counterexample.json -timeout 180
          YOSYS
            result=0
            (cd "$variant" && yosys -l proof.log -s prove.ys) || result=$?
            if [[ "$variant" == gate ]]; then
              test "$result" -eq 0
              grep -F 'SAT proof finished - no model found: SUCCESS!' "$variant/proof.log"
            else
              test "$result" -ne 0
              grep -F 'SAT proof finished - model found: FAIL!' "$variant/proof.log"
              test -s "$variant/counterexample.json"
            fi
          done
          sha256sum --check SHA256SUMS
          printf 'All 192 cheat-array next-state bits match for every common state and input; data, priority and reset mutations rejected.\n' \
            | tee verified.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact proof inputs, state audit and counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basex-write-gate-proof
          path: ${{ runner.temp }}/write-proof/
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Basex ${{ matrix.source }} seed 46
    needs: prove
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        source: [original, factored]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: basex-write-gate-proof
          path: ${{ runner.temp }}/write-proof

      - name: Select only the proved diagnostic source
        env:
          SOURCE: ${{ matrix.source }}
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/write-proof"
          (cd "$proof_dir" && sha256sum --check SHA256SUMS)
          test -s "$proof_dir/verified.txt"
          cmp "$proof_dir/original-cheat.v" verilog/sd2snes_base/cheat.v
          if [[ "$SOURCE" == factored ]]; then
            cp "$proof_dir/candidate-cheat.v" verilog/sd2snes_base/cheat.v
          fi
          {
            printf 'Diagnostic source: %s\nRunner checkout: %s\n' "$SOURCE" "$GITHUB_SHA"
            printf 'Placement seed: 46; project, clocks, jitter and timing constraints unchanged.\n'
            while IFS= read -r -d '' source_file; do
              printf '%s %s\n' "$(git hash-object --no-filters "$source_file")" "$source_file"
            done < <(git ls-files -z verilog/sd2snes_base/ verilog/sd2snes_basex/ verilog/common.mk verilog/xilinx_scripts/ .github/scripts/build.sh)
          } | tee "$RUNNER_TEMP/basex-source.txt"

      - uses: ./.github/actions/prepare-build-image
        with:
          target: mk2

      - name: Compile Basex with strict native PAR and TRACE checks
        env:
          ISE_CTABLE: '46'
        run: |
          set -euo pipefail
          docker image inspect sd2snes-ci:mk2 --format 'ISE image ID: {{.Id}}' \
            | tee -a "$RUNNER_TEMP/basex-source.txt"
          container_name=sd2snes-basex-write-gates
          bash .github/scripts/report-activity.sh "$container_name" &
          activity_pid=$!
          trap 'kill "$activity_pid" 2>/dev/null || true; wait "$activity_pid" 2>/dev/null || true' EXIT
          docker run --rm --name "$container_name" --user 0:0 \
            --mac-address 08:00:27:68:c9:35 --env ISE_CTABLE \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            --entrypoint /bin/bash sd2snes-ci:mk2 .github/scripts/build.sh mk2 basex \
            2>&1 | tee "$RUNNER_TEMP/basex-build.log"

      - name: Record available intermediate checksums
        if: always()
        run: |
          for result_file in main.ngc main.ngd main_map.ncd main.ncd; do
            if [[ -f "verilog/sd2snes_basex/$result_file" ]]; then
              sha256sum "verilog/sd2snes_basex/$result_file"
            fi
          done > "$RUNNER_TEMP/basex-build-checksums.txt"

      - name: Upload reports without publishing diagnostic bitstreams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basex-write-gate-${{ matrix.source }}-seed-46
          path: |
            ${{ runner.temp }}/basex-source.txt
            ${{ runner.temp }}/basex-build.log
            ${{ runner.temp }}/basex-build-checksums.txt
            verilog/sd2snes_basex/main.xst
            verilog/sd2snes_basex/main.prj
            verilog/sd2snes_basex/main.pcf
            verilog/sd2snes_basex/*.syr
            verilog/sd2snes_basex/*.par
            verilog/sd2snes_basex/*.mrp
            verilog/sd2snes_basex/*.psr
            verilog/sd2snes_basex/*.twr
            verilog/sd2snes_basex/*.bld
            verilog/sd2snes_basex/*.unroutes
          if-no-files-found: error
          retention-days: 14
