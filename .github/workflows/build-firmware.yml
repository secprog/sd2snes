name: Build firmware

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      build:
        description: Full release, software checks with existing MkIII FPGA images, or menus only
        type: choice
        options: [all, software, menus]
        default: all
      fpga_run_id:
        description: Run containing fpga-mk3 (required for software checks)
        type: string
      mk2_run_id:
        description: Optional run containing fpga-mk2-mini, to reuse the MkII bootstrap
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: firmware-${{ github.ref }}-${{ inputs.build || 'all' }}-${{ inputs.build == 'software' && github.sha || 'latest' }}
  cancel-in-progress: true

jobs:
  prepare-software:
    name: Prepare cached GCC 13.5 toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-build-image
        with:
          target: software

  fpga:
    if: inputs.build != 'software' && inputs.build != 'menus'
    name: Build ${{ matrix.board }} FPGA images
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: mk2
            extension: bit
          - board: mk3
            extension: bi3
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-build-image
        with:
          target: ${{ matrix.board }}

      - name: Compile FPGA images
        env:
          BOARD: ${{ matrix.board }}
        run: |
          container_name="sd2snes-$BOARD"
          args=(--rm --name "$container_name" --user 0:0 --volume "$GITHUB_WORKSPACE:/work" --workdir /work)
          if [[ "$BOARD" == mk2 ]]; then
            # Host ID of the bundled ISE VM license (documented by upstream ise14).
            args+=(--mac-address 08:00:27:68:c9:35)
          fi
          bash .github/scripts/report-activity.sh "$container_name" &
          activity_pid=$!
          trap 'kill "$activity_pid" 2>/dev/null || true; wait "$activity_pid" 2>/dev/null || true' EXIT
          docker run "${args[@]}" --entrypoint /bin/bash "sd2snes-ci:$BOARD" \
            .github/scripts/build.sh "$BOARD"

      - name: Collect FPGA images
        env:
          FPGA_EXT: ${{ matrix.extension }}
        run: |
          shopt -s nullglob
          files=(verilog/*/fpga_*."$FPGA_EXT")
          ((${#files[@]} > 0))
          mkdir -p "$RUNNER_TEMP/fpga-artifact"
          cp --parents "${files[@]}" "$RUNNER_TEMP/fpga-artifact/"

      - uses: actions/upload-artifact@v4
        with:
          name: fpga-${{ matrix.board }}
          path: ${{ runner.temp }}/fpga-artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Upload FPGA failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fpga-${{ matrix.board }}-failure-reports
          path: |
            verilog/*/*.syr
            verilog/*/*.par
            verilog/*/output_files/*.rpt
            verilog/*/output_files/*.summary
          if-no-files-found: ignore
          retention-days: 14

  menus:
    name: Build SNES menus and onboarding
    needs: prepare-software
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-build-image
        with:
          target: software

      - name: Compile and validate menus
        run: |
          docker run --rm --user 0:0 --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            sd2snes-ci:software /bin/bash .github/scripts/build.sh menus

      - uses: actions/upload-artifact@v4
        with:
          name: menus
          path: |
            snes/menu.bin
            snes/m3nu.bin
            snes/igmenu.bin
            snes/onboarding.bin
            snes/lang_*.bin
            snes/lang_*.fnt
          if-no-files-found: error
          retention-days: 14

      - name: Upload menu failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: menu-failure-reports
          path: |
            snes/*.log
            snes/*.map
            snes/onboarding/*.log
          if-no-files-found: ignore
          retention-days: 14

  mini-mk2:
    if: inputs.build == 'software' && inputs.mk2_run_id == ''
    name: Build MkII firmware bootstrap
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/prepare-build-image
        with:
          target: mk2
      - name: Compile only the mini FPGA image
        run: |
          docker run --rm --user 0:0 --mac-address 08:00:27:68:c9:35 \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work --entrypoint /bin/bash \
            sd2snes-ci:mk2 -c 'make host-tools && make -C verilog/sd2snes_mini mk2 HOST=LINUX XILINX_ENV='
      - uses: actions/upload-artifact@v4
        with:
          name: fpga-mk2-mini
          path: verilog/sd2snes_mini/fpga_mini.bit
          if-no-files-found: error
          retention-days: 14

  mcu:
    needs: [mini-mk2, prepare-software]
    if: ${{ !cancelled() && inputs.build == 'software' && needs.prepare-software.result == 'success' && (inputs.mk2_run_id != '' || needs.mini-mk2.result == 'success') }}
    name: Check ${{ matrix.board }} firmware (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: mk2
            runner: ubuntu-24.04
          - board: mk3
            runner: ubuntu-24.04
          - board: mk3-stm32
            runner: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify FPGA artifact sources
        env:
          GH_TOKEN: ${{ github.token }}
          FPGA_RUN_ID: ${{ inputs.fpga_run_id }}
          MK2_RUN_ID: ${{ inputs.mk2_run_id }}
        run: |
          for run_id in "$FPGA_RUN_ID" ${MK2_RUN_ID:+"$MK2_RUN_ID"}; do
            [[ "$run_id" =~ ^[0-9]+$ ]]
            fpga_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .head_sha)
            git diff --exit-code "$fpga_sha" HEAD -- verilog/ utils/
          done

      - uses: actions/download-artifact@v4
        with:
          name: fpga-mk3
          run-id: ${{ inputs.fpga_run_id }}
          github-token: ${{ github.token }}
          path: .

      - uses: actions/download-artifact@v4
        with:
          name: fpga-mk2-mini
          run-id: ${{ inputs.mk2_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: verilog/sd2snes_mini/

      - uses: ./.github/actions/prepare-build-image
        with:
          target: software

      - name: Compile firmware using cached release toolchain
        env:
          BOARD: ${{ matrix.board }}
        run: |
          docker run --rm --user 0:0 --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            sd2snes-ci:software /bin/bash .github/scripts/check-mcu.sh "$BOARD"

      - name: Upload MCU binaries and size reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcu-${{ matrix.board }}-${{ matrix.runner }}
          path: |
            stm32-build.log
            stm32-toolchain.log
            mk2-build.log
            mk3-build.log
            src/obj-${{ matrix.board }}/*.map
            src/obj-${{ matrix.board }}/*.elf
            src/obj-${{ matrix.board }}/firmware.*
            src/obj-${{ matrix.board }}/*.bin
          if-no-files-found: error
          retention-days: 14

  firmware:
    name: Build and package Mk.II and Mk.III firmware
    needs: [fpga, menus]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/prepare-build-image
        with:
          target: software

      - uses: actions/download-artifact@v4
        with:
          pattern: fpga-mk[23]
          merge-multiple: true
          path: .

      - name: Compile firmware and menus and assemble package
        run: |
          docker run --rm --user 0:0 --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            sd2snes-ci:software /bin/bash .github/scripts/build.sh firmware

      - name: Upload firmware package
        uses: actions/upload-artifact@v4
        with:
          name: sd2snes-firmware-${{ github.sha }}
          path: release/v*/sd2snes_firmware_v*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload firmware failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-failure-reports
          path: |
            src/obj-*/*.map
            snes/*.log
            snes/onboarding/*.log
          if-no-files-found: ignore
          retention-days: 14
