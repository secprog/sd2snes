# Authorized hosted continuation after the report-order diagnostic fix; preserve every native/input gate.
name: Trial basex proved late S-RTC address bits with isolated CoreGen

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: basex-srtc-late-bits-isolated-native-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  mapping:
    name: Basex late S-RTC bits, one PAR and TRACE seed 46
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6

      - name: Require the independently reviewed CoreGen isolation validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/secprog/sd2snes/actions/runs/40960956589 --jq .conclusion)" = success
          test "$(gh api repos/secprog/sd2snes/actions/runs/40960956589 --jq .head_sha)" = d9e6754161a504f00ad28ae7005bb4369105c313

      - name: Require exact independently reviewed mapping, physical inspection and command controls
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object --no-filters .github/scripts/check-native-route-commands.py)" = e2312dc65d7e6959983efd5829bf171250771940
          test "$(git hash-object --no-filters .github/workflows/check-native-route-commands.yml)" = 75d8c410a87c6a8fb48bf42a18b713255fed9b62
          test "$(git hash-object --no-filters .github/scripts/inspect-late-decoder-stable.py)" = 25fd5038678f0edff556fb7b12d7b005ca6691ab
          test "$(git hash-object --no-filters .github/scripts/check-late-decoder-report-order.py)" = 0fc310b33719151044e4dc3876aad9c8393ac0f7
          test "$(git hash-object --no-filters .github/workflows/check-late-decoder-report-order.yml)" = b57d23e32ccfaf7f52dc8afd30ffff7ec574b7c2
          test "$(git hash-object --no-filters .github/workflows/inspect-basex-srtc-late-bits-isolated-map.yml)" = 345925b2cc0d6ee3136e089cce4f69d61514700a
          python3 - <<'PY' | tee "$RUNNER_TEMP/basex-srtc-late-bits-isolated-native-prerequisites.json"
          import hashlib, io, json, os, subprocess, zipfile
          from pathlib import PurePosixPath
          checks = json.loads('''[{"run":41133808054,"head":"a252d29ee7a3375d403c77ef2a6a477b97c94546","conclusion":"success","total_jobs":1,"jobs":[124331159647],"artifacts":[{"id":13015870909,"name":"basex-srtc-late-bits-isolated-map-only-reports","size_in_bytes":553721,"digest":"sha256:20c62c0d382aca68080e8112194313c635e10da06faa732919ba50034d6c8b8a"}]},{"run":41137301644,"head":"a73668fa4b3511294971db2746f08849625fc639","conclusion":"success","total_jobs":1,"jobs":[124342807708],"artifacts":[{"id":13016923326,"name":"native-route-command-guard-reports","size_in_bytes":386596,"digest":"sha256:19fe2121239d89ef26d3526cb622084ff9874293afeb88c1b4f5f6cf07f890b3"}]},{"run":41135768963,"head":"5a40b1915b25180f6615c0dd43d70595fabbf9f6","conclusion":"failure","total_jobs":2,"jobs":[124337706603],"artifacts":[{"id":13015763462,"name":"late-decoder-predecessors-basex-reports","size_in_bytes":351636,"digest":"sha256:fd7dabda879ce45e4ce440900a4aa040b1dab2f9c1c948e680317b3698e7cc5c"}]},{"run":41231420886,"head":"07bdf25d5b609b291439c652cf03c8e47677ccfa","conclusion":"success","total_jobs":1,"jobs":[124626252744],"artifacts":[{"id":13053965982,"name":"stable-late-decoder-report-order-reports","size_in_bytes":1717375,"digest":"sha256:c35142e5f6718a75d0ddad4bdf6ecbb989b5e7951b64a7a9fb93edf032e89b53"}]}]''')
          observed = []
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/secprog/sd2snes/' + path]))
          for check in checks:
              run = api('actions/runs/' + str(check['run']))
              jobs = api('actions/runs/' + str(check['run']) + '/jobs?per_page=100')
              if (run['id'], run['head_sha'], run['status'], run['conclusion']) != (check['run'], check['head'], 'completed', check['conclusion']):
                  raise SystemExit('Prerequisite run identity/outcome differs')
              if jobs['total_count'] != check['total_jobs'] or len(jobs['jobs']) != check['total_jobs']:
                  raise SystemExit('Incomplete prerequisite job inventory')
              for job_id in check['jobs']:
                  found = [job for job in jobs['jobs'] if job['id'] == job_id]
                  if len(found) != 1 or found[0]['head_sha'] != check['head'] or found[0]['conclusion'] != 'success' or any(step['conclusion'] != 'success' for step in found[0]['steps']):
                      raise SystemExit('Required prerequisite job/step failed, missing or skipped')
              for expected in check['artifacts']:
                  artifact = api('actions/artifacts/' + str(expected['id']))
                  if any(artifact.get(k) != v for k, v in expected.items()) or artifact['expired'] or artifact['workflow_run']['id'] != check['run'] or artifact['workflow_run']['head_sha'] != check['head']:
                      raise SystemExit('Reviewed prerequisite artifact identity differs')
              observed.append({'run': run, 'jobs': jobs})
          raw = subprocess.check_output(['gh', 'api', 'repos/secprog/sd2snes/actions/artifacts/13016923326/zip'])
          if len(raw) != 386596 or hashlib.sha256(raw).hexdigest() != '19fe2121239d89ef26d3526cb622084ff9874293afeb88c1b4f5f6cf07f890b3':
              raise SystemExit('Command-control report ZIP digest differs')
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              entries = archive.infolist()
              if len(entries) > 30 or sum(i.file_size for i in entries) > 4_000_000 or any(i.file_size > 2_000_000 for i in entries):
                  raise SystemExit('Excessive command-control report inventory')
              for item in entries:
                  p = PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts or ':' in item.filename or chr(92) in item.filename:
                      raise SystemExit('Unsafe command-control report path')
              files = [i for i in entries if i.filename == 'controls.json']
              if len(files) != 1:
                  raise SystemExit('Missing/duplicate command controls')
              controls = json.loads(archive.read(files[0]).decode('utf-8', errors='strict'))
          expected_controls = ['duplicate-par', 'duplicate-trace', 'missing-par', 'missing-trace', 'unexpected-unwrapped-command', 'duplicate-console-header', 'missing-console-header', 'wrong-par-arguments', 'wrong-trace-arguments', 'forbidden-xst', 'quoted-extra-tool-command', 'extra-inline-handler', 'unrecognized-inline-tool', 'forbidden-tool-without-arguments', 'wrong-selected-seed', 'truncated-file-header']
          if [item['name'] for item in controls['synthetic_controls_only']] != expected_controls or any(not item['reason'] for item in controls['synthetic_controls_only']):
              raise SystemExit('Incomplete successful command negative controls')
          count = controls['authentic_count_only']
          if (count['original_par_recipes'], count['original_trace_recipes'], count['same_run_trace_command_headers'], count['seed'], count['timing_pass_inferred']) != (1, 1, 1, 68, False):
              raise SystemExit('Authentic command control outcome differs')
          if any(controls[k] is not True for k in ['original_native_failure_retained', 'original_command_gate_failure_retained', 'no_fpga_execution', 'no_timing_pass']):
              raise SystemExit('Original failure retention or diagnostic scope differs')
          raw = subprocess.check_output(['gh', 'api', 'repos/secprog/sd2snes/actions/artifacts/13053965982/zip'])
          if len(raw) != 1717375 or hashlib.sha256(raw).hexdigest() != 'c35142e5f6718a75d0ddad4bdf6ecbb989b5e7951b64a7a9fb93edf032e89b53':
              raise SystemExit('Stable report guard ZIP digest differs')
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              entries = archive.infolist()
              if len(entries) != 79 or sum(i.file_size for i in entries) != 14224454 or any(i.file_size > 8_000_000 for i in entries):
                  raise SystemExit('Unexpected complete stable report guard inventory')
              names = set()
              for item in entries:
                  p = PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts or ':' in item.filename or chr(92) in item.filename or item.filename in names:
                      raise SystemExit('Unsafe/duplicate stable report guard member')
                  names.add(item.filename)
              summaries = [i for i in entries if i.filename.endswith('/summary.json')]
              if len(summaries) != 1:
                  raise SystemExit('Missing/duplicate stable report summary')
              stable = json.loads(archive.read(summaries[0]).decode('utf-8', errors='strict'))
              if stable['native_execution'] is not False or stable['old_failures_preserved'] is not True:
                  raise SystemExit('Stable report guard scope/failure retention differs')
              expected_stable = json.loads('{"native_execution":false,"old_failures_preserved":true,"families":[{"family":"basex","reference_bytes":253550,"reference_sha256":"174fbb7b93b55740756ab19448a570150c077e6187d5c6b126012f6790eb7cbe","binding_lines_including_duplicates":40,"partial_fixture_controls":[{"python_hash_seed":"0","bytes":253547,"sha256":"affb5dabdb65ac7d548ef02fbc5cd8f512b54e51ea24755fb347a58356ed4b7c"},{"python_hash_seed":"1","bytes":253547,"sha256":"affb5dabdb65ac7d548ef02fbc5cd8f512b54e51ea24755fb347a58356ed4b7c"}],"synthetic_negatives":[{"synthetic":"lut","exit":0,"output_sha256":"7382034c5dce8b695d9c3e5020fdde8ff7e9dbfa45c49c05e868b7167be8fe25","exact_output_rejected":true},{"synthetic":"init","exit":0,"output_sha256":"57d774859198f7a225fcfda8965764c24f0dc13967c53b1f2bdbc0b00a817506","exact_output_rejected":true},{"synthetic":"truncated","exit":1,"output_sha256":"495dcd06940008baafb5732db1a53b3d504f141b74a8805cc4797da506ffdbb6","exact_output_rejected":true}]},{"family":"dsp-drivers","reference_bytes":251303,"reference_sha256":"07333d0cb76b6a4342ac9bcd4acbf0cc7ff90bb3857cf413d1bb66d709490a9b","binding_lines_including_duplicates":34,"partial_fixture_controls":[{"python_hash_seed":"0","bytes":251300,"sha256":"962acc9090dee1fa02d96fced8e2dbe06c7876075e70f80fd3ec09ad8b68ef6c"},{"python_hash_seed":"1","bytes":251300,"sha256":"962acc9090dee1fa02d96fced8e2dbe06c7876075e70f80fd3ec09ad8b68ef6c"}],"synthetic_negatives":[{"synthetic":"lut","exit":0,"output_sha256":"8d462b14d399bc19a63885c481ca4e66c303dc70a67760509980d9be15e96eb0","exact_output_rejected":true},{"synthetic":"init","exit":0,"output_sha256":"9e4f65e2938edcde0fe783db0f00dd6777a7f85dabdd0659043023014df7497e","exact_output_rejected":true},{"synthetic":"truncated","exit":1,"output_sha256":"495dcd06940008baafb5732db1a53b3d504f141b74a8805cc4797da506ffdbb6","exact_output_rejected":true}]},{"family":"dsp-ff-low","reference_bytes":408974,"reference_sha256":"f5eed88fa1dbecb5b641bfe6a622c65b4187923f3383d57c04e6210ec8867d1e","binding_lines_including_duplicates":88,"partial_fixture_controls":[{"python_hash_seed":"0","bytes":408971,"sha256":"9919f79f0d28a465eea08b7c9d51c07b0682e63c3072d89531a1e234117531f4"},{"python_hash_seed":"1","bytes":408971,"sha256":"9919f79f0d28a465eea08b7c9d51c07b0682e63c3072d89531a1e234117531f4"}],"synthetic_negatives":[{"synthetic":"lut","exit":0,"output_sha256":"1c272f4d6a86f66c7275c041f933af6d0aaf41be09c9fa25680f9828fba9508c","exact_output_rejected":true},{"synthetic":"init","exit":0,"output_sha256":"cb4d2ee0194b047da3f372d46f3c7c8ebd0ffa4508102b7c6a4bdbf9de24373c","exact_output_rejected":true},{"synthetic":"truncated","exit":1,"output_sha256":"495dcd06940008baafb5732db1a53b3d504f141b74a8805cc4797da506ffdbb6","exact_output_rejected":true}]},{"family":"dsp-ff-high","reference_bytes":364313,"reference_sha256":"de638a4e6ba8edcbd49f2740dee99f887408b45f251e468648ecf7a5407a94ad","binding_lines_including_duplicates":88,"partial_fixture_controls":[{"python_hash_seed":"0","bytes":364310,"sha256":"4cc87053b7ead15d2239ae7cff5241632f9c3ee4357023b3e3c50ad9311a6d28"},{"python_hash_seed":"1","bytes":364310,"sha256":"4cc87053b7ead15d2239ae7cff5241632f9c3ee4357023b3e3c50ad9311a6d28"}],"synthetic_negatives":[{"synthetic":"lut","exit":0,"output_sha256":"e44d4cebef52c31a715b2ef2b0e2aabf208d822ca0d198d2aa353a730b6d12ae","exact_output_rejected":true},{"synthetic":"init","exit":0,"output_sha256":"bfb3f1c2761daf87edb869f0e924eb6b98e606c7d2a9353c327065742dc6b2f5","exact_output_rejected":true},{"synthetic":"truncated","exit":1,"output_sha256":"495dcd06940008baafb5732db1a53b3d504f141b74a8805cc4797da506ffdbb6","exact_output_rejected":true}]}]}')
              if stable != expected_stable:
                  raise SystemExit('Reviewed complete stable report control outcomes differ')
              for item in stable['families']:
                  members = [i for i in entries if i.filename.endswith('/' + item['family'] + '-canonical-reference.txt')]
                  if len(members) != 1:
                      raise SystemExit('Missing/duplicate canonical physical report')
                  data = archive.read(members[0])
                  if len(data) != item['reference_bytes'] or hashlib.sha256(data).hexdigest() != item['reference_sha256']:
                      raise SystemExit('Reviewed canonical physical report bytes differ')
          print(json.dumps({'prerequisites': observed, 'command_controls': controls, 'stable_report_controls': stable}, indent=2))
          PY

      - name: Download the independently inspected source-bound proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/secprog/sd2snes/actions/runs/41133271280 --jq .conclusion)" = success
          test "$(gh api repos/secprog/sd2snes/actions/runs/41133271280 --jq .head_sha)" = 1dacdf3682392b9ca64c55a4e013c6cf417cf23a
          gh api repos/secprog/sd2snes/actions/artifacts/13013783280 > "$RUNNER_TEMP/srtc-late-bits-proof-metadata.json"
          python3 - "$RUNNER_TEMP/srtc-late-bits-proof-metadata.json" <<'PY'
          import json
          import sys
          from pathlib import Path
          artifact = json.loads(Path(sys.argv[1]).read_text())
          expected = {'id': 13013783280, 'name': 'basex-srtc-late-bits-proof', 'expired': False,
                      'digest': 'sha256:4528ce5f55f6d93823ac7099e724247fefd6fdacd4079bc43dd06800640868db'}
          if any(artifact.get(key) != value for key, value in expected.items()):
              raise SystemExit('Proof artifact identity differs')
          run = artifact['workflow_run']
          if run['id'] != 41133271280 or run['head_sha'] != '1dacdf3682392b9ca64c55a4e013c6cf417cf23a':
              raise SystemExit('Proof run identity differs')
          PY
          gh api repos/secprog/sd2snes/actions/artifacts/13013783280/zip > "$RUNNER_TEMP/srtc-late-bits-proof.zip"
          printf '4528ce5f55f6d93823ac7099e724247fefd6fdacd4079bc43dd06800640868db  %s\n' "$RUNNER_TEMP/srtc-late-bits-proof.zip" | sha256sum --check
          python3 - "$RUNNER_TEMP/srtc-late-bits-proof.zip" "$RUNNER_TEMP/basex-srtc-late-bits-proof" <<'PY'
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath
          root = Path(sys.argv[2])
          with zipfile.ZipFile(sys.argv[1]) as archive:
              entries = archive.infolist()
              if len(entries) != 103 or sum(item.file_size for item in entries) != 1668643:
                  raise SystemExit('Unexpected complete proof artifact inventory')
              for item in entries:
                  path = PurePosixPath(item.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in item.filename or ':' in item.filename:
                      raise SystemExit('Unsafe proof artifact path')
                  if item.file_size > 16_000_000:
                      raise SystemExit('Unexpectedly large proof member')
              archive.extractall(root)
          print('Exact independently reviewed proof artifact ZIP identity and complete contents verified.')
          PY

      - name: Download the original basex timing report for comparison
        uses: actions/download-artifact@v4
        with:
          name: basex-write-gate-original-seed-46
          path: ${{ runner.temp }}/basex-srtc-late-bits-original
          run-id: 40528297097
          github-token: ${{ github.token }}

      - name: Select exactly the proved runner-only source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:verilog)" = 01ce8b6b4509a5a72e0ad739e06bf19e548a2fc1
          test "$(git hash-object --no-filters .github/scripts/build.sh)" = 847665b375209d705de918d54f89cff194b074b1
          test "$(git hash-object --no-filters .github/actions/prepare-build-image/action.yml)" = ac2a66fc24d4a15658b666cdc5f5db7964df4c3b
          test "$(git hash-object --no-filters verilog/common.mk)" = c6b13825f8b7942711d3ae9723ce4fc83fdaa3cc
          test "$(git hash-object --no-filters .github/scripts/inspect-dsp-retained-map.py)" = 2b3b867372717b5729e26cb4880cb1af0b01a965
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git hash-object --no-filters verilog/sd2snes_base/address.v)" = 36ce9a5c17fc80b9ddda1d869f0d75a4fb52356c
          test "$(git hash-object --no-filters verilog/sd2snes_base/main.v)" = 2bd168af3e0254a6c985ff7cd5b0413afafab0a9
          test "$(git hash-object --no-filters verilog/sd2snes_base/main.ucf)" = e582e03059fbbcf21b4124e5dd7aa9ac8792fd6b
          test "$(git hash-object --no-filters verilog/sd2snes_basex/sd2snes_basex.xise)" = 5338e8fa5fef0af0c526ff99563b17a0763ed34a
          test "$(git hash-object --no-filters .github/scripts/prepare-basex-srtc-late-bits-proof.py)" = b1acdae7997eb48aee63817168fa5a1b75685bc0
          test "$(git hash-object --no-filters .github/workflows/prove-basex-srtc-late-bits.yml)" = 33df91ba18a0d55a8885eee3720d5e81d3a3e7b1
          test ! -e verilog/sd2snes_basex/ucf.extra
          proof="$RUNNER_TEMP/basex-srtc-late-bits-proof"
          test "$(wc -l < "$proof/SHA256SUMS")" = 39
          (cd "$proof" && sha256sum --check SHA256SUMS)
          test -s "$proof/verified.txt"
          grep -F 'Yosys 0.33 (git sha1 2584903a060)' "$proof/tool-version.txt"
          grep -F 'Icarus Verilog version 12.0' "$proof/iverilog-version.txt"
          test "$(sha256sum "$proof/candidate-address.v" | cut -d' ' -f1)" = 4f373b8ae27e58bc97d79ad2a6c67b1072f3f247058196f5b16ff6fd9fa46f22
          test "$(sha256sum "$proof/gold.v" | cut -d' ' -f1)" = f3094be8792d6b63d73907011f1fd13a980b22b592426f5272dcdca9c9ea028c
          test "$(sha256sum "$proof/gate.v" | cut -d' ' -f1)" = e58d13369e76f7beae2c7c58f4bfd554404184cb25e3bfa97c058c5a825e4830
          test "$(git hash-object --no-filters "$proof/candidate-address.v")" = 544beeb3ee6c6805197d332b08d10b8ee179f38a
          for mode in binary xstate; do
            test "$(sha256sum "$proof/gate/miter-$mode.json" | cut -d' ' -f1)" = 055f1e3e151ccac400679f095b301d7d4c5bbdffbf8e43912872edd354c01d53
            grep -F 'SAT proof finished - no model found: SUCCESS!' "$proof/gate/proof-$mode.log"
          done
          for variant in bad-bit4 bad-bit6 bad-prefix-field bad-prefix-value bad-bank bad-feature bad-join; do
            test -s "$proof/$variant/miter-binary.json"
            test -s "$proof/$variant/counterexample-binary.json"
            grep -F 'SAT proof finished - model found: FAIL!' "$proof/$variant/proof-binary.log"
          done
          for variant in bad-x-address bad-x-feature; do
            test -s "$proof/$variant/miter-binary.json"
            test -s "$proof/$variant/miter-xstate.json"
            test -s "$proof/$variant/counterexample-xstate.json"
            grep -F 'SAT proof finished - no model found: SUCCESS!' "$proof/$variant/proof-binary.log"
            grep -F 'SAT proof finished - model found: FAIL!' "$proof/$variant/proof-xstate.log"
          done
          cmp "$proof/original-address.v" verilog/sd2snes_base/address.v
          cp "$proof/candidate-address.v" verilog/sd2snes_base/address.v
          test "$(git diff --name-only)" = verilog/sd2snes_base/address.v
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/basex-srtc-late-bits-isolated-native-before.sha256"
          git ls-files -s > "$RUNNER_TEMP/basex-srtc-late-bits-isolated-native-before-index.txt"
          {
            printf 'Checkout: %s\nVerilog tree: %s\n' "$GITHUB_SHA" "$(git rev-parse HEAD:verilog)"
            printf 'Proof run: 41133271280; candidate address blob: 544beeb3ee6c6805197d332b08d10b8ee179f38a\n'
            printf 'Original project: 5338e8fa5fef0af0c526ff99563b17a0763ed34a; original UCF: e582e03059fbbcf21b4124e5dd7aa9ac8792fd6b\n'
            printf 'Basis: original Area46 has SNES_ADDR6/4 to SRTC rtc_ptr3 through three decoder stages; new exact proved candidate puts those bits in a final three-input LUT after a kept other-input permit. No source state or cycles added. Old rejected candidates stay rejected.\n'
            printf 'Diagnostic target: XST Speed, timing-driven MAP Area seed 46 only. No PAR/TRACE, timing or native pass; requirements unchanged.\n'
          } | tee "$RUNNER_TEMP/basex-srtc-late-bits-isolated-native-identity.txt"

      - uses: ./.github/actions/prepare-build-image
        with:
          target: mk2

      - name: Generate candidate mapped NCD only; no PAR or TRACE result
        id: mapping
        env:
          ISE_CTABLE: '46'
        run: |
          set -euo pipefail
          image_id=$(docker image inspect sd2snes-ci:mk2 --format '{{.Id}}')
          printf 'ISE image ID: %s\n' "$image_id" | tee -a "$RUNNER_TEMP/basex-srtc-late-bits-isolated-native-identity.txt"
          test "$image_id" = sha256:5e3bbb00649997abca8843b1d82d8529eda99a0f2868d37ad9777e0ad5fd50e8
          container_name=sd2snes-basex-srtc-late-bits-isolated-native
          bash .github/scripts/report-activity.sh "$container_name" &
          activity_pid=$!
          trap 'kill "$activity_pid" 2>/dev/null || true; wait "$activity_pid" 2>/dev/null || true' EXIT
          # MAP requires the existing licensed Ethernet identity. The none
          # driver creates only loopback, so retain the established bridge NIC.
          docker run --rm --network bridge --name "$container_name" --user 0:0 \
            --mac-address 08:00:27:68:c9:35 --env ISE_CTABLE \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            --entrypoint /bin/bash sd2snes-ci:mk2 -c \
