# Authorized correction of observed name/bounds failures using retained MAP checkpoints only.
# No FPGA regeneration, synthesis, MAP, PAR, TRACE or bitgen; every original failure remains a failure.
name: Inspect present basex mapper bits 10 through 15

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: basex-patch-midbits-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: basex
            run: '41237363927'
            job: '124643843571'
            head: 08e4697f99bdca238e5ac1673b4d3a1823aa0d92
            workflow: .github/workflows/inspect-basex-patch-final-isolated-map.yml
            workflow_blob: 2e1d78f21084db4379cd11d20676f56c4c6e8793
            artifact: '13055842828'
            name: basex-patch-final-isolated-map-only-mapped-ncd
            bytes: '896791'
            zip_sha: 5de6ed309cb62913c6a1b64efa786a53b902f925113dfedcd182bff74553d5e1
            ncd_sha: b50a97abd07699f4b7d870bceff25d2a8af4d69ae453bbc05d6a5f85cab6e92d
            scopes: 'basex-bits-10'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      FAMILY: ${{ matrix.family }}
      RETAINED_RUN: ${{ matrix.run }}
      RETAINED_JOB: ${{ matrix.job }}
      RETAINED_HEAD: ${{ matrix.head }}
      RETAINED_ARTIFACT: ${{ matrix.artifact }}
      RETAINED_NAME: ${{ matrix.name }}
      RETAINED_BYTES: ${{ matrix.bytes }}
      RETAINED_ZIP_SHA: ${{ matrix.zip_sha }}
      RETAINED_NCD_SHA: ${{ matrix.ncd_sha }}
      RETAINED_WORKFLOW: ${{ matrix.workflow }}
      RETAINED_WORKFLOW_BLOB: ${{ matrix.workflow_blob }}
      SCOPES: ${{ matrix.scopes }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 5
      - name: Pin sources and inventory every tracked byte and index entry
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/midbits-reports" "$RUNNER_TEMP/midbits-input" "$RUNNER_TEMP/midbits-export"
          test "$(git rev-parse HEAD^)" = 50fb1ed619c3cb204417c1387b196b1e5baa90f3
          test "$(git rev-parse HEAD^^)" = f091a83e67b1d28c1976797c9af2443b7a210dd5
          test "$(git rev-parse HEAD^^^)" = 90c02e6671b1f78d6c4fdc2711d49993a7c6933c
          test "$(git rev-parse HEAD^^^^)" = "$RETAINED_HEAD"
          test "$(git rev-parse HEAD:verilog)" = 01ce8b6b4509a5a72e0ad739e06bf19e548a2fc1
          test "$(git hash-object --no-filters .github/scripts/inspect-dsp-retained-map.py)" = 2b3b867372717b5729e26cb4880cb1af0b01a965
          test "$(git hash-object --no-filters .github/actions/prepare-build-image/action.yml)" = ac2a66fc24d4a15658b666cdc5f5db7964df4c3b
          test "$(git hash-object --no-filters .github/scripts/inspect-basex-patch-midbits.py)" = ae9ea938bf80f130c1b24f4f2dffe030187315f0
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/midbits-reports/tracked-before.sha256"
          git ls-files --stage > "$RUNNER_TEMP/midbits-reports/index-before.txt"
          git diff --exit-code
          git diff --cached --exit-code
      - name: Verify exact failed inspection outcomes and retained mapped NCD
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/midbits-reports"
          test "$(git rev-parse "$RETAINED_HEAD:$RETAINED_WORKFLOW")" = "$RETAINED_WORKFLOW_BLOB"
          gh api "repos/secprog/sd2snes/actions/runs/$RETAINED_RUN" > "$report/run.json"
          gh api "repos/secprog/sd2snes/actions/runs/$RETAINED_RUN/jobs?per_page=100" > "$report/jobs.json"
          gh api "repos/secprog/sd2snes/actions/artifacts/$RETAINED_ARTIFACT" > "$report/artifact.json"
          gh api "repos/secprog/sd2snes/actions/artifacts/$RETAINED_ARTIFACT/zip" > "$RUNNER_TEMP/midbits-input.zip"
          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          e = os.environ
          report = Path(e['RUNNER_TEMP']) / 'midbits-reports'
          run = json.loads((report / 'run.json').read_text())
          jobs = json.loads((report / 'jobs.json').read_text())
          artifact = json.loads((report / 'artifact.json').read_text())
          if (run['id'], run['head_sha'], run['status'], run['conclusion']) != (int(e['RETAINED_RUN']), e['RETAINED_HEAD'], 'completed', 'failure'):
              raise SystemExit('Retained run identity/outcome differs')
          if jobs['total_count'] != 1 or len(jobs['jobs']) != 1:
              raise SystemExit('Unexpected complete retained job inventory')
          job = jobs['jobs'][0]
          failed_steps = {13, 14} if e['FAMILY'] == 'dsp' else {13}
          expected_steps = {n: ('failure' if n in failed_steps else 'success')
                            for n in list(range(1, 19)) + [36, 37]}
          if (job['id'] != int(e['RETAINED_JOB']) or job['status'] != 'completed'
                  or job['conclusion'] != 'failure' or job['head_sha'] != e['RETAINED_HEAD']
                  or run['path'] != e['RETAINED_WORKFLOW']
                  or any(s['status'] != 'completed' for s in job['steps'])
                  or len(job['steps']) != len(expected_steps)
                  or {s['number']: s['conclusion'] for s in job['steps']} != expected_steps
                  or run['event'] != 'workflow_dispatch' or run['run_attempt'] != 1):
              raise SystemExit('Exact failed inspection job/step identity or outcomes differ')
          expected = {'id': int(e['RETAINED_ARTIFACT']), 'name': e['RETAINED_NAME'], 'expired': False, 'size_in_bytes': int(e['RETAINED_BYTES']), 'digest': 'sha256:' + e['RETAINED_ZIP_SHA']}
          if any(artifact.get(k) != v for k, v in expected.items()) or artifact['workflow_run']['id'] != int(e['RETAINED_RUN']) or artifact['workflow_run']['head_sha'] != e['RETAINED_HEAD']:
              raise SystemExit('Retained artifact identity differs')
          archive_path = Path(e['RUNNER_TEMP']) / 'midbits-input.zip'
          raw = archive_path.read_bytes()
          if len(raw) != int(e['RETAINED_BYTES']) or hashlib.sha256(raw).hexdigest() != e['RETAINED_ZIP_SHA']:
              raise SystemExit('Retained ZIP digest differs')
          with zipfile.ZipFile(archive_path) as archive:
              members = archive.infolist()
              if len(members) != 1 or members[0].filename != 'main_map.ncd' or members[0].file_size > 16_000_000 or members[0].flag_bits & 1 or (members[0].external_attr >> 16) & 0o170000 == 0o120000:
                  raise SystemExit('Unexpected single bounded NCD inventory')
              ncd = archive.read(members[0])
          if hashlib.sha256(ncd).hexdigest() != e['RETAINED_NCD_SHA']:
              raise SystemExit('Retained NCD digest differs')
          (Path(e['RUNNER_TEMP']) / 'midbits-input/main_map.ncd').write_bytes(ncd)
          print('Exact FAILED inspection provenance and failure steps preserved; ZIP digest and single mapped NCD verified.')
          PY
      - name: Bind the exact failed low-alias inspection and retained control records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^^^:.github/workflows/inspect-measured-map-partitions.yml)" = db014e22ed318c2f729125e8b57f1f42ba558ca6
          python3 - <<'PY'
          import hashlib, io, json, os, subprocess, zipfile
          from pathlib import Path, PurePosixPath
          root = Path(os.environ['RUNNER_TEMP']) / 'midbits-reports'
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/secprog/sd2snes/' + path]))
          run = api('actions/runs/41239356788')
          jobs = api('actions/runs/41239356788/jobs?per_page=100')
          head = '90c02e6671b1f78d6c4fdc2711d49993a7c6933c'
          if (run['id'], run['head_sha'], run['status'], run['conclusion'], run['event'], run['run_attempt'], run['path']) != (41239356788, head, 'completed', 'failure', 'workflow_dispatch', 1, '.github/workflows/inspect-measured-map-partitions.yml'):
              raise SystemExit('Failed partition run identity/outcome differs')
          if jobs['total_count'] != 2 or len(jobs['jobs']) != 2 or {j['id'] for j in jobs['jobs']} != {124649795135, 124649795371}:
              raise SystemExit('Incomplete partition job inventory')
          for job in jobs['jobs']:
              failed = job['id'] == 124649795135
              expected = {n: ('failure' if failed and n == 6 else 'success') for n in list(range(1, 9)) + [16, 17]}
              if (job['head_sha'] != head or job['status'] != 'completed' or job['conclusion'] != ('failure' if failed else 'success')
                      or len(job['steps']) != len(expected) or any(s['status'] != 'completed' for s in job['steps'])
                      or {s['number']: s['conclusion'] for s in job['steps']} != expected):
                  raise SystemExit('Exact mixed inspection outcomes differ')
          artifact = api('actions/artifacts/13056717757')
          expected = {'id': 13056717757, 'name': 'measured-map-partitions-basex-reports', 'size_in_bytes': 433166, 'expired': False, 'digest': 'sha256:0442e5f1308b83067d6779c4af88b0f1082c475120b64ca2e9a7b34829135c34'}
          if any(artifact.get(k) != v for k, v in expected.items()) or artifact['workflow_run']['id'] != 41239356788 or artifact['workflow_run']['head_sha'] != head:
              raise SystemExit('Failed partition report identity differs')
          raw = subprocess.check_output(['gh', 'api', 'repos/secprog/sd2snes/actions/artifacts/13056717757/zip'])
          if len(raw) != 433166 or hashlib.sha256(raw).hexdigest() != expected['digest'].split(':')[1]:
              raise SystemExit('Partition report ZIP digest differs')
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              entries = archive.infolist()
              if len(entries) != 15 or sum(i.file_size for i in entries) != 1887019 or any(i.file_size > 500_000 for i in entries):
                  raise SystemExit('Unexpected bounded complete partition report inventory')
              names = set()
              for item in entries:
                  p = PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts or ':' in item.filename or chr(92) in item.filename or item.filename in names or item.flag_bits & 1 or (item.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit('Unsafe/duplicate/encrypted partition member')
                  names.add(item.filename)
                  archive.read(item).decode('utf-8', errors='strict')
              pins = {'raw-basex-bits-0.txt': (442, 'd12384a8be26a218f8d4e3aff1f44887ae89b2b48b13fe98c0170fb2b5ddddb6'),
                      'raw-basex-bits-8.txt': (364531, 'c6432a4955da7a01492cdf807d8d5ddf944be4fd1847e45e93cea934726e3a7c'),
                      'raw-basex-bits-16.txt': (334837, 'fe2a0862c51c1834f41c6bf3ecd8351f7bdf95e22a33da91b11f8098cd275233'),
                      'raw-basex-control.txt': (234589, 'd6ce7103cdfe3ed1d21a707d0a1e2acaf592eb3051811a60a982c3420df52f7e')}
              for name, (length, digest) in pins.items():
                  data = archive.read(name)
                  if len(data) != length or hashlib.sha256(data).hexdigest() != digest:
                      raise SystemExit('Exact retained physical/failed-scope record differs')
              old_failed = archive.read('raw-basex-bits-8.txt')
              failures = [line for line in old_failed.decode('utf-8', errors='strict').splitlines() if line.startswith('Observed net absent:')]
              if failures != ['Observed net absent: MAPPED_SNES_ADDR<8>; not absent logic', 'Observed net absent: MAPPED_SNES_ADDR<9>; not absent logic']:
                  raise SystemExit('The two exact original missing-name failures differ')
              (root / 'reference-failed-bits-8.txt').write_bytes(old_failed)
          (root / 'partition-provenance.json').write_text(json.dumps({'run': run, 'jobs': jobs, 'artifact': artifact, 'raw_pins': pins}, indent=2) + chr(10))
          print('Whole partition run and basex job remain FAILED; exact recorded physical consumer evidence verified.')
          PY
      - name: Preserve exact successful consumer inspection provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object --no-filters .github/workflows/inspect-basex-patch-consumers.yml)" = 619add2c787cd4f029c880ee8e49d4a332305add
          test "$(git hash-object --no-filters .github/scripts/inspect-basex-patch-consumers.py)" = 972b9f29c862dddb5fb0ea1f74ae094de38bd9f3
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          expected = json.loads('''{"id":41240921372,"head":"f091a83e67b1d28c1976797c9af2443b7a210dd5","path":".github/workflows/inspect-basex-patch-consumers.yml","conclusion":"success","jobs":[{"id":124654460057,"steps":[{"number":1,"name":"Set up job","conclusion":"success"},{"number":2,"name":"Run actions/checkout@v6","conclusion":"success"},{"number":3,"name":"Pin sources and inventory every tracked byte and index entry","conclusion":"success"},{"number":4,"name":"Verify exact failed inspection outcomes and retained mapped NCD","conclusion":"success"},{"number":5,"name":"Bind the exact failed low-alias inspection and retained control records","conclusion":"success"},{"number":6,"name":"Run ./.github/actions/prepare-build-image","conclusion":"success"},{"number":7,"name":"Convert retained NCD read-only and inspect declared independent scopes","conclusion":"success"},{"number":8,"name":"Require all tracked SHA/index/staged inputs and retained NCD unchanged","conclusion":"success"},{"number":9,"name":"Retain small read-only reports","conclusion":"success"},{"number":18,"name":"Post Run actions/checkout@v6","conclusion":"success"},{"number":19,"name":"Complete job","conclusion":"success"}]}],"artifact":{"id":13056864967,"name":"basex-patch-consumers-reports","size_in_bytes":456846,"digest":"sha256:a8651eb8159ceed0e1b82eee852b14e885ea7d112ab52a282df134602181484c"}}''')
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', 'repos/secprog/sd2snes/' + path]))
          run = api('actions/runs/' + str(expected['id']))
          jobs = api('actions/runs/' + str(expected['id']) + '/jobs?per_page=100')
          if (run['id'], run['head_sha'], run['path'], run['status'], run['conclusion'], run['event'], run['run_attempt']) != (expected['id'], expected['head'], expected['path'], 'completed', 'success', 'workflow_dispatch', 1):
              raise SystemExit('Successful consumer run identity/outcome differs')
          if jobs['total_count'] != 1 or len(jobs['jobs']) != 1:
              raise SystemExit('Incomplete consumer job inventory')
          job = jobs['jobs'][0]
          if (job['id'], job['run_id'], job['head_sha'], job['status'], job['conclusion'], job['run_attempt']) != (expected['jobs'][0]['id'], expected['id'], expected['head'], 'completed', 'success', 1):
              raise SystemExit('Successful consumer job identity/outcome differs')
          steps = [{k: s[k] for k in ('number', 'name', 'conclusion')} for s in job['steps']]
          if steps != expected['jobs'][0]['steps'] or any(s['status'] != 'completed' for s in job['steps']):
              raise SystemExit('Complete consumer step inventory/outcomes differ')
          artifact = api('actions/artifacts/' + str(expected['artifact']['id']))
          if any(artifact.get(k) != v for k, v in expected['artifact'].items()) or artifact['expired'] or (artifact['workflow_run']['id'], artifact['workflow_run']['head_sha']) != (expected['id'], expected['head']):
              raise SystemExit('Consumer artifact identity differs')
          (Path(os.environ['RUNNER_TEMP']) / 'midbits-reports/consumer-prerequisite.json').write_text(json.dumps({'run': run, 'jobs': jobs, 'artifact': artifact}, indent=2) + chr(10))
          print('Exact successful consumer inspection retained separately from both earlier failed runs; no FPGA timing pass inferred.')
          PY
      - uses: ./.github/actions/prepare-build-image
        with:
          target: mk2
      - name: Convert retained NCD read-only and inspect declared independent scopes
        run: |
          set -euo pipefail
          test "$(docker image inspect sd2snes-ci:mk2 --format '{{.Id}}')" = sha256:5e3bbb00649997abca8843b1d82d8529eda99a0f2868d37ad9777e0ad5fd50e8
          printf '%s  %s\n' "$RETAINED_NCD_SHA" "$RUNNER_TEMP/midbits-input/main_map.ncd" | tee "$RUNNER_TEMP/midbits-reports/ncd-before.sha256" | sha256sum --check
          docker run --rm --read-only --network none --mac-address 08:00:27:68:c9:35 --user 0:0 --tmpfs /tmp:rw,exec,size=256m \
            --volume "$RUNNER_TEMP/midbits-input/main_map.ncd:/input/main_map.ncd:ro" \
            --volume "$RUNNER_TEMP/midbits-export:/output" --workdir /tmp \
            --entrypoint /bin/bash sd2snes-ci:mk2 -c \
            'set -euo pipefail; xdl -ncd2xdl -nopips /input/main_map.ncd /output/retained.xdl' \
            2>&1 | tee "$RUNNER_TEMP/midbits-reports/conversion.log"
          sha256sum --check "$RUNNER_TEMP/midbits-reports/ncd-before.sha256"
          sha256sum "$RUNNER_TEMP/midbits-export/retained.xdl" > "$RUNNER_TEMP/midbits-reports/xdl.sha256"
          result=0
          for scope in $SCOPES; do
            python3 -u .github/scripts/inspect-basex-patch-midbits.py "$scope" "$RUNNER_TEMP/midbits-export/retained.xdl" 2>&1 | tee "$RUNNER_TEMP/midbits-reports/raw-$scope.txt" || result=1
          done
          sha256sum --check "$RUNNER_TEMP/midbits-reports/ncd-before.sha256"
          test "$result" -eq 0
      - name: Require every original physical record and preserve old missing-name failures
        run: |
          set -euo pipefail
          test "$(git hash-object --no-filters .github/scripts/inspect-dsp-retained-map.py)" = 2b3b867372717b5729e26cb4880cb1af0b01a965
          python3 - <<'PY'
          import hashlib, importlib.util, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'midbits-reports'
          old = (root / 'reference-failed-bits-8.txt').read_bytes()
          new = (root / 'raw-basex-bits-10.txt').read_bytes()
          if len(old) != 364531 or hashlib.sha256(old).hexdigest() != 'c6432a4955da7a01492cdf807d8d5ddf944be4fd1847e45e93cea934726e3a7c':
              raise SystemExit('Complete original failed report changed')
          missing = ['Observed net absent: MAPPED_SNES_ADDR<8>; not absent logic',
                     'Observed net absent: MAPPED_SNES_ADDR<9>; not absent logic']
          old_text, new_text = old.decode('utf-8', errors='strict'), new.decode('utf-8', errors='strict')
          if [line for line in old_text.splitlines() if line.startswith('Observed net absent:')] != missing:
              raise SystemExit('Original two missing-name failures not retained exactly')
          if any(line.startswith('Observed net absent:') for line in new_text.splitlines()):
              raise SystemExit('New declared scope remains inconclusive')
          marker = 'Complete bounded raw records precede binding outcomes; mapped only, not routed timing.\n'
          def body(text):
              if text.count(marker) != 1:
                  raise SystemExit('Missing or duplicate complete raw marker')
              after = text.split(marker, 1)[1]
              if '\nObserved net ' not in after:
                  raise SystemExit('Missing binding footer boundary')
              return after.split('\nObserved net ', 1)[0].encode('utf-8')
          old_body, new_body = body(old_text), body(new_text)
          if len(old_body) != 359377 or hashlib.sha256(old_body).hexdigest() != '24cfb05f8ce0e7b06b8462a62833fcddc96899cd3354067a7b3bd73873e0cda0' or new_body != old_body:
              raise SystemExit('Complete original 391-record physical body differs')
          spec = importlib.util.spec_from_file_location('xdl', Path('.github/scripts/inspect-dsp-retained-map.py'))
          xdl = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(xdl)
          instances, nets = xdl.parse(new_body.decode('utf-8', errors='strict'))
          if len(instances) != 47 or len(nets) != 344:
              raise SystemExit('Complete original physical record inventory differs')
          if len(new) != 364547 or hashlib.sha256(new).hexdigest() != '5a3ba193305672c763adeafd8cb1858dd6870549d3c23a0dfba24322c62fe71d':
              raise SystemExit('Full new report differs from the reviewed static footer-only expectation')
          summary = {'old_scope_failure_retained': missing, 'new_scope': 'basex-bits-10',
                     'required_nets': ['MAPPED_SNES_ADDR<' + str(i) + '>' for i in range(10, 16)],
                     'all_original_physical_records_byte_equal': True, 'instances': 47, 'nets': 344,
                     'body_bytes': len(new_body), 'body_sha256': hashlib.sha256(new_body).hexdigest(),
                     'new_report_bytes': len(new), 'new_report_sha256': hashlib.sha256(new).hexdigest(),
                     'native_timing_pass_inferred': False}
          (root / 'body-identity.json').write_text(json.dumps(summary, indent=2) + chr(10))
          print(json.dumps(summary, indent=2))
          PY
      - name: Require all tracked SHA/index/staged inputs and retained NCD unchanged
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/midbits-reports"
          git ls-files -z | xargs -0 sha256sum > "$report/tracked-after.sha256"
          git ls-files --stage > "$report/index-after.txt"
          cmp "$report/tracked-before.sha256" "$report/tracked-after.sha256"
          cmp "$report/index-before.txt" "$report/index-after.txt"
          sha256sum --check "$report/tracked-before.sha256" > "$report/final-sha-check.txt"
          git diff --exit-code
          git diff --cached --exit-code
          sha256sum --check "$report/ncd-before.sha256"
      - name: Retain small read-only reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: basex-patch-midbits-reports
          path: ${{ runner.temp }}/midbits-reports/
          if-no-files-found: error
          retention-days: 14
