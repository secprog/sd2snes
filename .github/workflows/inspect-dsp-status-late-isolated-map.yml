# New source/report-led mapping diagnostic only. Broad human authorization remains in force.
# Complete exact proof selection, all source/IP/PCF gates and raw bounded review are mandatory.
name: Inspect DSPx late status control with isolated CoreGen

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: dsp-status-late-isolated-map-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  mapping:
    name: DSPx late status control and isolated IP inputs, MAP only
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v6

      - name: Require the independently reviewed CoreGen isolation validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/secprog/sd2snes/actions/runs/40960956589 --jq .conclusion)" = success
          test "$(gh api repos/secprog/sd2snes/actions/runs/40960956589 --jq .head_sha)" = d9e6754161a504f00ad28ae7005bb4369105c313

      - name: Download the exact independently reviewed successful component proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object --no-filters .github/scripts/download-measured-slow-path-proof.py)" = 09a778b7c0d79f224e0ff9f66a50bf802d69a90c
          python3 .github/scripts/download-measured-slow-path-proof.py dsp "$RUNNER_TEMP/dsp-status-late-proof" "$RUNNER_TEMP/dsp-status-late-isolated-map-proof-provenance.json"

      - name: Download the original DSPx timing report for comparison
        uses: actions/download-artifact@v4
        with:
          name: dsp-stack-original-seed-68
          path: ${{ runner.temp }}/dsp-stack-late-low-original
          run-id: 40524388250
          github-token: ${{ github.token }}

      - name: Select exactly the proved runner-only source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:verilog)" = 01ce8b6b4509a5a72e0ad739e06bf19e548a2fc1
          test "$(git hash-object --no-filters .github/scripts/build.sh)" = 847665b375209d705de918d54f89cff194b074b1
          test "$(git hash-object --no-filters .github/actions/prepare-build-image/action.yml)" = ac2a66fc24d4a15658b666cdc5f5db7964df4c3b
          test "$(git hash-object --no-filters verilog/common.mk)" = c6b13825f8b7942711d3ae9723ce4fc83fdaa3cc
          test "$(git hash-object --no-filters .github/scripts/inspect-dsp-retained-map.py)" = 2b3b867372717b5729e26cb4880cb1af0b01a965
          git diff --exit-code
          git diff --cached --exit-code
          test "$(git hash-object --no-filters verilog/sd2snes_dsp/upd77c25.v)" = ba14f5b6dd198fbb5645f005fb3784890beec2c4
          test "$(git hash-object --no-filters verilog/sd2snes_dsp/main.v)" = cc6889c4f00f653b0df19184ec8c7d726df9d2c9
          test "$(git hash-object --no-filters verilog/sd2snes_dsp/main.ucf)" = 4f34c4cf9e475ac171a216c3f15fff74918fd03c
          test "$(git hash-object --no-filters verilog/sd2snes_dspx/sd2snes_dspx.xise)" = 2822b63c005bce73e8e7aaf332bcdbd983d1492d
          test "$(git hash-object --no-filters .github/scripts/prepare-slow-path-proofs.py)" = 393d3156292af684ca3db498cc43a20de77bbda4
          test "$(git hash-object --no-filters .github/fixtures/slow-path-proof-data.json)" = 7833210e1b7523a28aefc6a680000889efe39391
          test "$(git hash-object --no-filters .github/scripts/inspect-measured-slow-path-map.py)" = 44aa3f6e7e0a708168dbb8cd8189af94ddf4f94d
          test ! -e verilog/sd2snes_dspx/ucf.extra
          python3 .github/scripts/inspect-measured-slow-path-map.py --self-test
          proof="$RUNNER_TEMP/dsp-status-late-proof"
          test "$(wc -l < "$proof/SHA256SUMS")" = 52
          (cd "$proof" && sha256sum --check SHA256SUMS)
          test -s "$proof/verified.txt"
          grep -F 'Yosys 0.33 (git sha1 2584903a060)' "$proof/tool-version.txt"
          grep -F 'Icarus Verilog version 12.0' "$proof/iverilog-version.txt"
          test "$(sha256sum "$proof/candidate.v" | cut -d' ' -f1)" = 95aa37433035439b6998e09e6fb2d85d934ea42f31f9666fd02085bf428e7007
          test "$(git hash-object --no-filters "$proof/candidate.v")" = 5fd95bbd641a0068fcca947bd9a2a26da67a4553
          test "$(sha256sum "$proof/gold.v" | cut -d' ' -f1)" = b993dd8bd302c7108ed53fe2abb800232831084d41d688471db8775533d9f35f
          test "$(sha256sum "$proof/gate.v" | cut -d' ' -f1)" = 228137f16b4c3a79d876175cb6cca876e5832d7eabf69a57c24612e39660df93
          for mode in binary xstate; do
            test "$(sha256sum "$proof/gate/miter-$mode.json" | cut -d' ' -f1)" = 630431e93f9b31305f5ccb3623fac80aa5f76ae31408e1ffaa27b1ecc18764ad
            grep -F 'SAT proof finished - no model found: SUCCESS!' "$proof/gate/proof-$mode.log"
          done
          for variant in bad-opdst bad-lddst bad-state bad-low-address bad-high-address bad-low-data bad-high-data bad-cpu-data bad-freeze bad-reset-hold bad-reset-clear; do
            test -s "$proof/$variant/miter-binary.json"
            test -s "$proof/$variant/counterexample-binary.json"
            grep -F 'SAT proof finished - model found: FAIL!' "$proof/$variant/proof-binary.log"
          done
          for variant in bad-x-guard bad-x-data; do
            test -s "$proof/$variant/miter-binary.json"
            test -s "$proof/$variant/miter-xstate.json"
            test -s "$proof/$variant/counterexample-xstate.json"
            grep -F 'SAT proof finished - no model found: SUCCESS!' "$proof/$variant/proof-binary.log"
            grep -F 'SAT proof finished - model found: FAIL!' "$proof/$variant/proof-xstate.log"
          done
          for variant in gold gate bad-opdst bad-lddst bad-state bad-low-address bad-high-address bad-low-data bad-high-data bad-cpu-data bad-freeze bad-reset-hold bad-reset-clear bad-x-guard bad-x-data; do
            test -s "$proof/$variant/state.json"
            test -s "$proof/$variant/transition.json"
            test -s "$proof/$variant/initial-state-audit.json"
            grep -F 'SAT proof finished - no model found: SUCCESS!' "$proof/$variant/state-view.log"
          done
          grep -F 'SAT proof finished - model found: FAIL!' "$proof/gold/state-view-mutant.log"
          test -s "$proof/gold/state-view-mutant-counterexample.json"
          cmp "$proof/original.v" .github/fixtures/slow-path-parent-dsp.v
          cp "$proof/candidate.v" verilog/sd2snes_dsp/upd77c25.v
          test "$(git diff --name-only)" = verilog/sd2snes_dsp/upd77c25.v
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/dsp-status-late-isolated-map-before.sha256"
          git ls-files -s > "$RUNNER_TEMP/dsp-status-late-isolated-map-before-index.txt"
          {
            printf 'Checkout: %s\nVerilog tree: %s\n' "$GITHUB_SHA" "$(git rev-parse HEAD:verilog)"
            printf 'Proof run: 41235863589; exact candidate blob: 5fd95bbd641a0068fcca947bd9a2a26da67a4553\n'
            printf 'Original project: 2822b63c005bce73e8e7aaf332bcdbd983d1492d; original UCF: 4f34c4cf9e475ac171a216c3f15fff74918fd03c\n'
            printf 'Basis: Rejected 41231726943 has ss_frozen to regs_sr7 at -3.171ns through N99 49-load and N428 hold control. Exact proved change places reset/freeze at final status enable/data LUTs without new state or cycle. All older native failures remain rejected.\n'
            printf 'Diagnostic target: XST Speed, timing-driven MAP Area seed 68 only. No PAR/TRACE, timing or native pass; requirements unchanged.\n'
          } | tee "$RUNNER_TEMP/dsp-status-late-isolated-map-identity.txt"

      - uses: ./.github/actions/prepare-build-image
        with:
          target: mk2

      - name: Generate candidate mapped NCD only; no PAR or TRACE result
        id: mapping
        env:
          ISE_CTABLE: '68'
        run: |
          set -euo pipefail
          image_id=$(docker image inspect sd2snes-ci:mk2 --format '{{.Id}}')
          printf 'ISE image ID: %s\n' "$image_id" | tee -a "$RUNNER_TEMP/dsp-status-late-isolated-map-identity.txt"
          test "$image_id" = sha256:5e3bbb00649997abca8843b1d82d8529eda99a0f2868d37ad9777e0ad5fd50e8
          container_name=sd2snes-dsp-status-late-isolated-map
          bash .github/scripts/report-activity.sh "$container_name" &
          activity_pid=$!
          trap 'kill "$activity_pid" 2>/dev/null || true; wait "$activity_pid" 2>/dev/null || true' EXIT
          # MAP requires the existing licensed Ethernet identity. The none
          # driver creates only loopback, so retain the established bridge NIC.
          docker run --rm --network bridge --name "$container_name" --user 0:0 \
            --mac-address 08:00:27:68:c9:35 --env ISE_CTABLE \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            --entrypoint /bin/bash sd2snes-ci:mk2 -c \
            'set -euo pipefail; observed_mac=$(cat /sys/class/net/eth0/address); printf "Observed build-container eth0 MAC: %s\n" "$observed_mac"; test "$observed_mac" = 08:00:27:68:c9:35; make -C verilog/sd2snes_dspx -j2 main_map.ncd HOST=LINUX XILINX_ENV= IGNORE_TIMING=0; test -s verilog/sd2snes_dspx/main_map.ncd; test ! -e verilog/sd2snes_dspx/main.ncd; test ! -e verilog/sd2snes_dspx/main.par; test ! -e verilog/sd2snes_dspx/main.twr' \
            2>&1 | tee "$RUNNER_TEMP/dsp-status-late-isolated-map-build.log"

      - name: Retain every post-build tracked difference and generated IP hash
        if: always() && steps.mapping.outcome != 'skipped'
        run: |
          set -euo pipefail
          git ls-files -z | xargs -0 sha256sum > "$RUNNER_TEMP/dsp-status-late-isolated-map-after.sha256"
          git ls-files -s > "$RUNNER_TEMP/dsp-status-late-isolated-map-after-index.txt"
          git diff --no-ext-diff --no-renames --binary > "$RUNNER_TEMP/dsp-status-late-isolated-map-post.diff"
          git diff --cached --no-ext-diff --no-renames --binary > "$RUNNER_TEMP/dsp-status-late-isolated-map-post-staged.diff"
          git diff --no-ext-diff --no-renames --name-only | tee "$RUNNER_TEMP/dsp-status-late-isolated-map-post-paths.txt"
          for path in verilog/sd2snes_dsp/upd77c25.v verilog/sd2snes_dsp/main.v verilog/sd2snes_dsp/main.ucf verilog/sd2snes_dspx/sd2snes_dspx.xise; do
            printf '%s %s\n' "$(git hash-object --no-filters "$path")" "$path"
          done | tee "$RUNNER_TEMP/dsp-status-late-isolated-map-post-hashes.txt"
          {
            missing=0
            for core in dac_buf msu_databuf snescmd_buf upd77c25_datram upd77c25_datrom upd77c25_pgmrom; do
              file="verilog/sd2snes_dsp/ip/mk2/build/$core.ngc"
              if [[ -s "$file" ]]; then sha256sum "$file"; else printf 'MISSING %s\n' "$file"; missing=1; fi
            done
            exit "$missing"
          } | tee "$RUNNER_TEMP/dsp-status-late-isolated-map-ngc-hashes.txt"

      - name: Verify candidate, project, constraints and all tracked inputs
        if: always() && steps.mapping.outcome != 'skipped'
        run: |
          set -euo pipefail
          test "$(git hash-object --no-filters verilog/sd2snes_dsp/upd77c25.v)" = 5fd95bbd641a0068fcca947bd9a2a26da67a4553
          test "$(git hash-object --no-filters verilog/sd2snes_dsp/main.v)" = cc6889c4f00f653b0df19184ec8c7d726df9d2c9
          test "$(git hash-object --no-filters verilog/sd2snes_dsp/main.ucf)" = 4f34c4cf9e475ac171a216c3f15fff74918fd03c
          test "$(git hash-object --no-filters verilog/sd2snes_dspx/sd2snes_dspx.xise)" = 2822b63c005bce73e8e7aaf332bcdbd983d1492d
          test "$(git diff --name-only)" = verilog/sd2snes_dsp/upd77c25.v
          git diff --cached --exit-code
          cmp "$RUNNER_TEMP/dsp-status-late-isolated-map-before.sha256" "$RUNNER_TEMP/dsp-status-late-isolated-map-after.sha256"
          cmp "$RUNNER_TEMP/dsp-status-late-isolated-map-before-index.txt" "$RUNNER_TEMP/dsp-status-late-isolated-map-after-index.txt"
          echo 'Every tracked SHA and index entry is unchanged after selecting the exact proved candidate; staged inputs unchanged.'

      - name: Verify actual synthesis and MAP options; forbid routing execution
        if: always() && steps.mapping.outcome != 'skipped'
        run: |
          set -euo pipefail
          grep -Fx -- '-sd {"../sd2snes_dsp/ip/mk2/build"}' verilog/sd2snes_dspx/main.xst
          grep -Fx -- '-opt_mode Speed' verilog/sd2snes_dspx/main.xst
          grep -Fx -- '-define { MK2 DSP_COMP }' verilog/sd2snes_dspx/main.xst
          grep -Fx -- '-resource_sharing Yes' verilog/sd2snes_dspx/main.xst
          grep -Fx -- '-register_balancing Yes' verilog/sd2snes_dspx/main.xst
          python3 - "$RUNNER_TEMP/dsp-status-late-isolated-map-build.log" <<'PY'
          import re
          import shlex
          import sys
          from pathlib import Path
          lines = Path(sys.argv[1]).read_text(errors="strict").splitlines()
          translations = [line for line in lines if re.match(r"^\s*/\S*/ngdbuild\s+-", line)]
          if len(translations) != 1:
              raise SystemExit('Missing or ambiguous NGDBUILD command')
          translate_args = shlex.split(translations[0])
          if translate_args.count('-sd') != 1 or translate_args[translate_args.index('-sd') + 1] != '../sd2snes_dsp/ip/mk2/build':
              raise SystemExit('NGDBUILD does not consume the isolated IP netlists')
          print(f'Verified NGDBUILD isolated search path: {translations[0]}')
          project = Path('verilog/sd2snes_dspx/main.prj').read_text().splitlines()
          ip_lines = [line for line in project if '/ip/mk2/' in line]
          expected_ips = ['dac_buf', 'msu_databuf', 'snescmd_buf', 'upd77c25_datram', 'upd77c25_datrom', 'upd77c25_pgmrom']
          if sorted(ip_lines) != sorted(f'verilog work "../sd2snes_dsp/ip/mk2/build/{ip}.v"' for ip in expected_ips):
              raise SystemExit('XST project does not consume exactly the six isolated IP sources')
          print('\n'.join(ip_lines))
          if any(re.search(r"/(?:par|trce)\s+-", line) for line in lines):
              raise SystemExit("Unexpected PAR/TRACE execution in mapping-only diagnostic")
          for tool, expected in (
              ("map", {"-logic_opt": "on", "-ol": "high", "-xe": "n", "-t": "68", "-register_duplication": "on", "-cm": "area"}),
          ):
              commands = [line for line in lines if re.search(r"/" + tool + r"\s+-", line)]
              if len(commands) != 1:
                  raise SystemExit(f"Missing or ambiguous {tool} command")
              args = shlex.split(commands[0].split(" || ", 1)[0].strip())
              if tool == "map" and args.count("-timing") != 1:
                  raise SystemExit("MAP is not explicitly timing-driven")
              for flag, value in expected.items():
                  if args.count(flag) != 1 or args.index(flag) + 1 >= len(args) or args[args.index(flag) + 1] != value:
                      raise SystemExit(f"Unexpected {tool} option {flag}")
              print(f"Verified {tool} command: {commands[0]}")
          PY

      - name: Compare PCF timing statements with the original report
        if: always() && steps.mapping.outcome != 'skipped'
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/dsp-stack-late-low-original" verilog/sd2snes_dspx/main.pcf <<'PY'
          import hashlib
          import re
          import sys
          from pathlib import Path
          originals = list(Path(sys.argv[1]).rglob('main.pcf'))
          if len(originals) != 1:
              raise SystemExit('Missing or ambiguous original PCF')
          if hashlib.sha256(originals[0].read_bytes()).hexdigest() != '849380275e2d1c6116bfae918abfa8b2d0f57317a049c7fd09905bffe4762c2b':
              raise SystemExit('Original PCF hash differs from the retained baseline report')
          def timing(path):
              lines = path.read_text().splitlines()
              return [line.strip() for line in lines if re.match(r'^(SYSTEM_JITTER|TS_\S+\s*=)', line.strip())]
          old, new = timing(originals[0]), timing(Path(sys.argv[2]))
          if not old or old != new or 'SYSTEM_JITTER = 480 ps;' not in new:
              raise SystemExit(f'PCF timing statements differ: old={old!r}, new={new!r}')
          print('\n'.join(new))
          PY

      - name: Retain bounded actual mapped nets, muxes and target FF bindings before evaluating names
        if: always() && steps.mapping.outcome != 'skipped'
        run: |
          set -euo pipefail
          core=verilog/sd2snes_dspx
          attribute_result=0
          for unit in dsp_status_late_enable dsp_status_late_data; do
            if ! grep -E "Set property \"LUT_MAP = yes\" for unit <$unit([^>]*)>\\." "$core/main.syr"; then attribute_result=1; fi
          done
          result=0
          grep -i 'keep' "$core/main.syr" > "$RUNNER_TEMP/dsp-status-late-isolated-map-keep-messages.txt" || result=$?
          test "$result" -le 1
          test -s "$core/main_map.ncd"
          test "$(stat -c %s "$core/main_map.ncd")" -le 16000000
          sha256sum "$core/main_map.ncd" | tee "$RUNNER_TEMP/dsp-status-late-isolated-map-map-sha256.txt"
          mkdir "$RUNNER_TEMP/dsp-status-late-isolated-map-export"
          docker run --rm --read-only --network none --user 0:0 \
            --tmpfs /tmp:rw,exec,size=256m --mac-address 08:00:27:68:c9:35 \
            --volume "$GITHUB_WORKSPACE/$core/main_map.ncd:/input/main_map.ncd:ro" \
            --volume "$RUNNER_TEMP/dsp-status-late-isolated-map-export:/output" --workdir /tmp \
            --entrypoint /bin/bash sd2snes-ci:mk2 -c \
            'set -euo pipefail; xdl -ncd2xdl -nopips /input/main_map.ncd /output/late-low-map.xdl'
          sha256sum --check "$RUNNER_TEMP/dsp-status-late-isolated-map-map-sha256.txt"
          sha256sum "$RUNNER_TEMP/dsp-status-late-isolated-map-export/late-low-map.xdl" | tee "$RUNNER_TEMP/dsp-status-late-isolated-map-xdl-sha256.txt"
          python3 -u .github/scripts/inspect-measured-slow-path-map.py dsp "$RUNNER_TEMP/dsp-status-late-isolated-map-export/late-low-map.xdl" | tee "$RUNNER_TEMP/dsp-status-late-isolated-map-xdl.txt"
          test "$attribute_result" -eq 0

      - name: Retain all previously proved stack or S-RTC physical scopes
        if: always() && steps.mapping.outcome != 'skipped'
        run: |
          set -euo pipefail
          result=0
          for scope in dsp-stack-decode dsp-stack-low dsp-stack-high; do
            python3 -u .github/scripts/inspect-measured-slow-path-map.py "$scope" "$RUNNER_TEMP/dsp-status-late-isolated-map-export/late-low-map.xdl" 2>&1 | tee "$RUNNER_TEMP/dsp-status-late-isolated-map-scope-$scope.txt" || result=1
          done
          test "$result" -eq 0

      - name: Require original tracked inputs after mapping-only inspections
        if: always() && steps.mapping.outcome != 'skipped'
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = verilog/sd2snes_dsp/upd77c25.v
          git diff --cached --exit-code
          test "$(git hash-object --no-filters verilog/sd2snes_dsp/upd77c25.v)" = 5fd95bbd641a0068fcca947bd9a2a26da67a4553
          sha256sum --check "$RUNNER_TEMP/dsp-status-late-isolated-map-before.sha256" > "$RUNNER_TEMP/dsp-status-late-isolated-map-final-manifest-check.txt"
          git ls-files -s > "$RUNNER_TEMP/dsp-status-late-isolated-map-final-index.txt"
          cmp "$RUNNER_TEMP/dsp-status-late-isolated-map-before-index.txt" "$RUNNER_TEMP/dsp-status-late-isolated-map-final-index.txt"

      - name: Upload small reports and source differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsp-status-late-isolated-map-only-reports
          path: |
            ${{ runner.temp }}/dsp-status-late-isolated-map-*.sha256
            ${{ runner.temp }}/dsp-status-late-isolated-map-*-index.txt
            ${{ runner.temp }}/dsp-status-late-isolated-map-final-manifest-check.txt
            ${{ runner.temp }}/dsp-status-late-isolated-map-identity.txt
            ${{ runner.temp }}/dsp-status-late-isolated-map-proof-provenance.json
            ${{ runner.temp }}/dsp-status-late-isolated-map-build.log
            ${{ runner.temp }}/dsp-status-late-isolated-map-post.diff
            ${{ runner.temp }}/dsp-status-late-isolated-map-post-staged.diff
            ${{ runner.temp }}/dsp-status-late-isolated-map-post-paths.txt
            ${{ runner.temp }}/dsp-status-late-isolated-map-post-hashes.txt
            ${{ runner.temp }}/dsp-status-late-isolated-map-ngc-hashes.txt
            ${{ runner.temp }}/dsp-status-late-isolated-map-map-sha256.txt
            ${{ runner.temp }}/dsp-status-late-isolated-map-xdl.txt
            ${{ runner.temp }}/dsp-status-late-isolated-map-scope-*.txt
            ${{ runner.temp }}/dsp-status-late-isolated-map-xdl-sha256.txt
            ${{ runner.temp }}/dsp-status-late-isolated-map-keep-messages.txt
            verilog/sd2snes_dspx/main.xst
            verilog/sd2snes_dspx/main.prj
            verilog/sd2snes_dspx/main.pcf
            verilog/sd2snes_dspx/sd2snes_dspx.xise
            verilog/sd2snes_dspx/*.syr
            verilog/sd2snes_dspx/*.mrp
            verilog/sd2snes_dspx/*.psr
            verilog/sd2snes_dspx/*.bld
          if-no-files-found: error
          retention-days: 14

      - name: Retain the mapped NCD separately on GitHub
        if: always() && steps.mapping.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: dsp-status-late-isolated-map-only-mapped-ncd
          path: verilog/sd2snes_dspx/main_map.ncd
          if-no-files-found: error
          retention-days: 14

      - name: Retain all same-run generated IP netlists separately
        if: always() && steps.mapping.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: dsp-status-late-isolated-map-ip-netlists
          path: verilog/sd2snes_dsp/ip/mk2/build/*.ngc
          if-no-files-found: error
          retention-days: 14
