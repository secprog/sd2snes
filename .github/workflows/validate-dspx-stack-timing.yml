name: Validate basex captured window and strict timing
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: basex-window-predecode-${{ github.ref }}
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  IGNORE_TIMING: '0'
jobs:
  proof:
    name: Prove complete BSX state and the window capture invariant
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Bind only the complete BSX window capture rewrite and unchanged native constraints
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/basex-proof"
          mkdir "$report"
          python3 .github/scripts/validate-basex-window-predecode.py contract "$report"
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$report/source-before"
      - name: Install and identify GitHub-hosted proof tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys iverilog
          yosys -V | tee "$RUNNER_TEMP/basex-proof/yosys-version.txt"
          grep -F 'Yosys 0.33 (git sha1 2584903a060)' "$RUNNER_TEMP/basex-proof/yosys-version.txt"
          iverilog -V > "$RUNNER_TEMP/basex-proof/iverilog-version.txt" 2>&1
          grep -F 'Icarus Verilog version 12.0' "$RUNNER_TEMP/basex-proof/iverilog-version.txt"
      - name: Prove all BSX state and window startup step and X counterexamples
        run: python3 .github/scripts/validate-basex-window-predecode.py proof "$RUNNER_TEMP/basex-proof/models"
      - name: Require complete source and index immutability
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/basex-proof"
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$report/source-after"
          cmp "$report/source-before.json" "$report/source-after.json"
          cmp "$report/source-before-index.txt" "$report/source-after-index.txt"
          printf 'Complete source/index checks passed\n' > "$report/integrity-verified.txt"
      - name: Retain complete formal graphs on GitHub and audit bounded proof text
        if: always()
        run: |
          set -euo pipefail
          python3 .github/scripts/validate-basex-window-predecode.py proof-design "$RUNNER_TEMP/basex-proof" "$RUNNER_TEMP/basex-proof-design"
          python3 .github/scripts/validate-basex-window-predecode.py union "$RUNNER_TEMP/basex-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basex-window-predecode-formal-graphs-github-only
          path: ${{ runner.temp }}/basex-proof-design/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basex-window-predecode-complete-source-proof
          path: ${{ runner.temp }}/basex-proof/
          if-no-files-found: error
          retention-days: 14
  native:
    name: Build one basex candidate with every original timing requirement
    needs: proof
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: basex-window-predecode-complete-source-proof
          path: ${{ runner.temp }}/basex-proof-binding
      - name: Bind native input to this run successful complete BSX and capture-invariant proof
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/basex-native"
          mkdir "$report"
          python3 .github/scripts/validate-basex-window-predecode.py contract "$report"
          cmp "$report/source-contract.json" "$RUNNER_TEMP/basex-proof-binding/source-contract.json"
          python3 - "$RUNNER_TEMP/basex-proof-binding/models/proof-result.json" <<'PY'
          import json,os,sys
          p=json.load(open(sys.argv[1]))
          assert p['head']==os.environ['GITHUB_SHA']
          assert p['completeBsxStateAndAllOutputs'] and p['baseRegisterStateBits']==192
          assert p['allMemoryInitializerBitsAudited']==256 and p['originalStateBits']>=192
          assert p['oneNewPrivatePredicateBit'] and p['privateInitializationAndStepInvariantProved']
          assert p['strictBinaryAndXEquality'] and p['arbitraryOriginalSharedState']
          assert p['noResetEnableOrAlignmentAssumptions']
          assert p['originalFeatureQualifiersAndGlobalStrobesPreserved']
          assert p['startupSimulationChecks']==2049 and p['noStartupCyclesSkipped']
          assert p['allSixNonTargetProfilesUnchanged'] and p['preprocessorProfiles']==7
          assert [x['exit'] for x in p['sat']]==[0,0,1,1,1,0,1]
          assert all(x['actualSatResult'] for x in p['sat'])
          PY
          cp "$RUNNER_TEMP/basex-proof-binding/models/proof-result.json" "$report/accepted-source-proof.json"
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$report/source-before"
      - name: Bind exact original basex timing reports and workflow identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/validate-basex-window-predecode.py baseline "$RUNNER_TEMP/basex-native/baseline"
      - name: Exercise existing hosted source and owned-container controls
        run: |
          set -euo pipefail
          python3 .github/scripts/post-sync-evidence.py --self-test "$RUNNER_TEMP/basex-window-controls-raw"
          cp "$RUNNER_TEMP/basex-window-controls-raw/self-test-results.json" "$RUNNER_TEMP/basex-native/evidence-controls.json"
      - uses: ./.github/actions/prepare-build-image
        with:
          target: mk2
      - name: Generate all three original isolated base IPs and verify all four consumers reuse them
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/basex-native"
          python3 .github/scripts/post-sync-evidence.py coregen "$GITHUB_WORKSPACE" "$report/ip" base "basex-ip-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 .github/scripts/validate-basex-window-predecode.py freeze-ip "$report" before
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$report/source-after-ip"
          cmp "$report/source-before.json" "$report/source-after-ip.json"
          cmp "$report/source-before-index.txt" "$report/source-after-ip-index.txt"
      - name: Run one original strict basex build with unchanged cost table46
        id: native
        run: python3 .github/scripts/validate-basex-window-predecode.py container "$RUNNER_TEMP/basex-native" native
      - name: Preserve native reports and require complete source index and IP immutability
        if: always()
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/basex-native"
          python3 .github/scripts/validate-basex-window-predecode.py collect "$report"
          python3 .github/scripts/post-sync-evidence.py snapshot "$GITHUB_WORKSPACE" "$report/source-after"
          cmp "$report/source-before.json" "$report/source-after.json"
          cmp "$report/source-before-index.txt" "$report/source-after-index.txt"
          python3 .github/scripts/validate-basex-window-predecode.py freeze-ip "$report" after
          printf 'Complete source/index/IP byte and mtime checks passed\n' > "$report/integrity-verified.txt"
      - name: Measure every gain while keeping actual strict timing failures
        if: always() && steps.native.outcome != 'skipped'
        run: python3 .github/scripts/validate-basex-window-predecode.py analyze "$RUNNER_TEMP/basex-native" "$RUNNER_TEMP/basex-native/baseline"
      - name: Audit complete bounded native text
        if: always()
        run: python3 .github/scripts/validate-basex-window-predecode.py union "$RUNNER_TEMP/basex-native"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basex-window-predecode-complete-native-reports
          path: ${{ runner.temp }}/basex-native/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basex-window-predecode-design-github-only
          path: |
            verilog/sd2snes_basex/*.ncd
            verilog/sd2snes_basex/*.ngd
            verilog/sd2snes_basex/*.ngc
            verilog/sd2snes_basex/*.pcf
            verilog/sd2snes_basex/*.bit
            verilog/sd2snes_base/ip/mk2/build/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: basex-window-predecode-synthetic-raw-controls-github-only
          path: ${{ runner.temp }}/basex-window-controls-raw/
          if-no-files-found: error
          retention-days: 14
