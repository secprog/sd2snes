name: Check GBC RTL
on:
  workflow_dispatch:
    inputs:
      suite:
        description: RTL checks to execute on the hosted runner
        type: choice
        options: [all, clock]
        default: all
permissions:
  contents: read
jobs:
  rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Prepare hosted simulator
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends iverilog
      - name: Check production RTL
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          set -o pipefail
          args=()
          if [[ "$SUITE" == clock ]]; then args+=(--clock-only); fi
          python3 tests/test_gbc_mk2.py "${args[@]}" | tee "$RUNNER_TEMP/gbc-rtl.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gbc-rtl-checks
          path: ${{ runner.temp }}/gbc-rtl.log
          retention-days: 14
