name: Compare DSPx stack write-gate timing

on:
  workflow_dispatch:
    inputs:
      include_original:
        description: Repeat the measured original Area seed-68 control
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dsp-stack-write-gates-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  prove:
    name: Prove all stack transitions and reads; reject three mutations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Prepare pinned component and native diagnostic sources
        run: |
          set -euo pipefail
          python3 .github/scripts/prepare-dsp-stack-gate-experiment.py \
            verilog/sd2snes_dsp/upd77c25.v "$RUNNER_TEMP/stack-gate-proof"

      - name: Install formal tools on the GitHub runner
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends yosys
          yosys -V | tee "$RUNNER_TEMP/stack-gate-proof/tool-version.txt"

      - name: Prove the full transition relation and both read paths
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/stack-gate-proof"
          sha256sum --check SHA256SUMS
          for variant in gold gate bad-data bad-freeze bad-wrap; do
            mkdir "$variant"
            cp "$variant.v" "$variant/model.v"
            (
              cd "$variant"
              # Retain explicit invalid-index behavior, every state bit and
              # asynchronous reads. Do not invent reset/initial-state values.
              yosys -l preparation.log -p 'read_verilog -sv -formal model.v; hierarchy -check -top stack_model; flatten; proc; check -assert; memory -nowiden -memx; dffunmap; opt_expr -keepdc; setundef -undriven -undef; opt_clean; check -assert; write_json state.json'
              model_name=gate
              if [[ "$variant" == gold ]]; then model_name=gold; fi
              python3 "$GITHUB_WORKSPACE/.github/scripts/cut-dsp-stack-state.py" \
                state.json transition.json "$model_name" | tee state-audit.log
            )
          done
          for variant in gate bad-data bad-freeze bad-wrap; do
            cat > "$variant/prove.ys" <<'YOSYS'
          read_json ../gold/transition.json
          read_json transition.json
          miter -equiv -make_assert -make_outputs -make_outcmp -flatten gold gate miter
          hierarchy -check -top miter
          opt_clean
          check -assert
          sat -verify -enable_undef -set-def-inputs -prove-asserts -show-inputs -show-outputs -dump_json counterexample.json -timeout 180
          YOSYS
            result=0
            (cd "$variant" && yosys -l proof.log -s prove.ys) || result=$?
            if [[ "$variant" == gate ]]; then
              test "$result" -eq 0
              grep -F 'SAT proof finished - no model found: SUCCESS!' "$variant/proof.log"
            else
              test "$result" -ne 0
              grep -F 'SAT proof finished - model found: FAIL!' "$variant/proof.log"
              test -s "$variant/counterexample.json"
            fi
          done
          sha256sum --check SHA256SUMS
          printf 'All 176 next-state bits and both stack reads match for every common state and input; data, freeze and index-wrap mutations rejected.\n' \
            | tee verified.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact proof inputs, state audit and counterexamples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsp-stack-write-gate-proof
          path: ${{ runner.temp }}/stack-gate-proof/
          if-no-files-found: error
          retention-days: 14

  compare:
    name: DSPx ${{ matrix.source }} MAP Area seed 68
    needs: prove
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(inputs.include_original && '["original","factored"]' || '["factored"]') }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: dsp-stack-write-gate-proof
          path: ${{ runner.temp }}/stack-gate-proof

      - name: Select only the proved diagnostic source
        env:
          SOURCE: ${{ matrix.source }}
          MAP_GOAL: Area
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/stack-gate-proof"
          (cd "$proof_dir" && sha256sum --check SHA256SUMS)
          test -s "$proof_dir/verified.txt"
          cmp "$proof_dir/original-upd77c25.v" verilog/sd2snes_dsp/upd77c25.v
          if [[ "$SOURCE" == factored ]]; then
            cp "$proof_dir/candidate-upd77c25.v" verilog/sd2snes_dsp/upd77c25.v
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          goal = os.environ["MAP_GOAL"]
          if goal not in ("Area", "Speed"):
              raise SystemExit("Invalid diagnostic MAP cover mode")
          path = Path("verilog/sd2snes_dspx/sd2snes_dspx.xise")
          text = path.read_text()
          original = 'xil_pn:name="Optimization Strategy (Cover Mode)" xil_pn:value="Area" xil_pn:valueState="default"'
          if text.count(original) != 1:
              raise SystemExit("Expected exactly one original Area MAP property")
          if goal == "Speed":
              changed = original.replace('value="Area"', 'value="Speed"').replace('valueState="default"', 'valueState="non-default"')
              text = text.replace(original, changed)
          path.write_text(text)
          PY
          {
            printf 'Diagnostic source: %s\nRunner checkout: %s\n' "$SOURCE" "$GITHUB_SHA"
            printf 'MAP cover: %s; placement seed: 68. Other project properties, clocks, jitter and timing constraints unchanged.\n' "$MAP_GOAL"
            while IFS= read -r -d '' source_file; do
              printf '%s %s\n' "$(git hash-object --no-filters "$source_file")" "$source_file"
            done < <(git ls-files -z verilog/sd2snes_dsp/ verilog/sd2snes_dspx/ verilog/common.mk verilog/xilinx_scripts/ .github/scripts/build.sh)
          } | tee "$RUNNER_TEMP/dsp-source.txt"

      - uses: ./.github/actions/prepare-build-image
        with:
          target: mk2

      - name: Compile DSPx with strict native PAR and TRACE checks
        env:
          ISE_CTABLE: '68'
        run: |
          set -euo pipefail
          docker image inspect sd2snes-ci:mk2 --format 'ISE image ID: {{.Id}}' \
            | tee -a "$RUNNER_TEMP/dsp-source.txt"
          container_name=sd2snes-dsp-stack-write-gates
          bash .github/scripts/report-activity.sh "$container_name" &
          activity_pid=$!
          trap 'kill "$activity_pid" 2>/dev/null || true; wait "$activity_pid" 2>/dev/null || true' EXIT
          docker run --rm --name "$container_name" --user 0:0 \
            --mac-address 08:00:27:68:c9:35 --env ISE_CTABLE \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            --entrypoint /bin/bash sd2snes-ci:mk2 .github/scripts/build.sh mk2 dspx \
            2>&1 | tee "$RUNNER_TEMP/dsp-build.log"

      - name: Record available intermediate checksums
        if: always()
        run: |
          for result_file in main.ngc main.ngd main_map.ncd main.ncd; do
            if [[ -f "verilog/sd2snes_dspx/$result_file" ]]; then
              sha256sum "verilog/sd2snes_dspx/$result_file"
            fi
          done > "$RUNNER_TEMP/dsp-build-checksums.txt"

      - name: Upload reports without publishing diagnostic bitstreams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsp-stack-gate-${{ matrix.source }}-map-Area-seed-68
          path: |
            ${{ runner.temp }}/dsp-source.txt
            ${{ runner.temp }}/dsp-build.log
            ${{ runner.temp }}/dsp-build-checksums.txt
            verilog/sd2snes_dspx/main.xst
            verilog/sd2snes_dspx/main.prj
            verilog/sd2snes_dspx/main.pcf
            verilog/sd2snes_dspx/sd2snes_dspx.xise
            verilog/sd2snes_dspx/*.syr
            verilog/sd2snes_dspx/*.par
            verilog/sd2snes_dspx/*.mrp
            verilog/sd2snes_dspx/*.psr
            verilog/sd2snes_dspx/*.twr
            verilog/sd2snes_dspx/*.bld
            verilog/sd2snes_dspx/*.unroutes
          if-no-files-found: error
          retention-days: 14
